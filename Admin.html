<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1F3A34" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="favicon.ico" sizes="48x48" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>VettedHands Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const API_BASE = "https://vettedhands-backend.onrender.com";

async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}

/* ============ ICONS ============ */
const ICON_PATHS = {
  shieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></>,
  checkCircle2: <><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>,
  xCircle: <><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>,
  clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
  activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>,
  star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
  mapPin: <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>,
  alertTriangle: <><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
  arrowLeft: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
  logOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
};
function Icon({ name, size = 18, color, strokeWidth = 2, fill = "none", stroke = "currentColor", style, ...rest }) {
  const shape = ICON_PATHS[name];
  if (!shape) return null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill={fill} stroke={color || stroke} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }} {...rest}>{shape}</svg>
  );
}
const ShieldCheck = (p) => <Icon name="shieldCheck" {...p} />;
const CheckCircle2 = (p) => <Icon name="checkCircle2" {...p} />;
const XCircle = (p) => <Icon name="xCircle" {...p} />;
const Clock = (p) => <Icon name="clock" {...p} />;
const Activity = (p) => <Icon name="activity" {...p} />;
const Star = (p) => <Icon name="star" {...p} />;
const MapPin = (p) => <Icon name="mapPin" {...p} />;
const AlertTriangle = (p) => <Icon name="alertTriangle" {...p} />;
const ArrowLeft = (p) => <Icon name="arrowLeft" {...p} />;
const LogOut = (p) => <Icon name="logOut" {...p} />;

function initials(name = "") { return name.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase(); }
function tradeLabel(t) { return { ELECTRICIAN: "Electrician", PLUMBER: "Plumber", TAILOR: "Tailor", PHONE_REPAIR: "Phone Repair" }[t] || t; }

/* ============ LOGIN ============ */
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setErr(null); setBusy(true);
    try { await onLogin(email.trim(), password); }
    catch (ex) { setErr(ex.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="phone">
      <div className="content" style={{ alignItems: "center", justifyContent: "center", display: "flex", padding: 24 }}>
        <form onSubmit={submit} style={{ width: "100%", maxWidth: 300, display: "flex", flexDirection: "column", gap: 14 }}>
          <div className="brand" style={{ justifyContent: "center", marginBottom: 6 }}>
            <span className="brand-mark"><ShieldCheck size={16} /></span><span className="brand-name">VettedHands</span><span className="brand-sub">Admin</span>
          </div>
          <label style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-soft)" }}>Admin email
            <input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="badge-select" style={{ width: "100%", marginTop: 6 }} />
          </label>
          <label style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-soft)" }}>Password
            <input required type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="badge-select" style={{ width: "100%", marginTop: 6 }} />
          </label>
          {err && <div className="modal-note" style={{ color: "var(--danger)" }}>{err}</div>}
          <button className="approve-btn" disabled={busy} style={{ justifyContent: "center" }}>{busy ? "Please wait…" : "Log in"}</button>
        </form>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [token, setToken] = useState(() => localStorage.getItem("vh_admin_token") || null);
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(!!token);

  useEffect(() => {
    if (!token) { setChecking(false); return; }
    api("/api/auth/me", { token })
      .then((d) => {
        if (d.user.role !== "ADMIN") throw new Error("Not an admin account");
        setUser(d.user);
      })
      .catch(() => { localStorage.removeItem("vh_admin_token"); setToken(null); })
      .finally(() => setChecking(false));
  }, [token]);

  async function login(email, password) {
    const d = await api("/api/auth/login", { method: "POST", body: { email, password } });
    if (d.user.role !== "ADMIN") throw new Error("This account isn't an admin");
    localStorage.setItem("vh_admin_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  function logout() { localStorage.removeItem("vh_admin_token"); setToken(null); setUser(null); }

  return (
    <div className="app">
      <Style />
      {checking ? (
        <div className="phone"><div className="content" style={{ alignItems: "center", justifyContent: "center", display: "flex" }}>Loading…</div></div>
      ) : !token || !user ? (
        <LoginScreen onLogin={login} />
      ) : (
        <Dashboard token={token} user={user} onLogout={logout} />
      )}
    </div>
  );
}

function Dashboard({ token, user, onLogout }) {
  const [tab, setTab] = useState("pending");
  const [pending, setPending] = useState([]);
  const [active, setActive] = useState([]);
  const [activity, setActivity] = useState([]);
  const [selectedApp, setSelectedApp] = useState(null);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);
  const [stats, setStats] = useState(null);
  const [serviceRequests, setServiceRequests] = useState([]);
  const [reports, setReports] = useState([]);
  const [selectedArtisanDetail, setSelectedArtisanDetail] = useState(null);

  function flash(msg) { setToast(msg); setTimeout(() => setToast(null), 2200); }
  function fail(e) { flash(e.message || "Something went wrong"); }

  async function loadAll() {
    setLoading(true);
    try {
      const [pendingRes, artisansRes, activityRes, statsRes, requestsRes, reportsRes] = await Promise.all([
        api("/api/admin/applications?status=pending", { token }),
        api("/api/admin/artisans", { token }),
        api("/api/admin/activity", { token }),
        api("/api/admin/stats", { token }),
        api("/api/admin/requests", { token }),
        api("/api/admin/reports", { token }),
      ]);
      setPending(pendingRes.applications);
      setActive(artisansRes.artisans);
      setActivity(activityRes.activity);
      setStats(statsRes.stats);
      setServiceRequests(requestsRes.requests);
      setReports(reportsRes.reports);
    } catch (e) { fail(e); }
    finally { setLoading(false); }
  }
  useEffect(() => { loadAll(); }, []);

  async function approve(app) {
    try {
      await api(`/api/admin/applications/${app.id}`, { method: "PATCH", token, body: { status: "APPROVED" } });
      setPending((p) => p.filter((x) => x.id !== app.id));
      setSelectedApp(null);
      flash(`${app.user.name} approved and now live`);
      loadAll();
    } catch (e) { fail(e); }
  }
  async function reject(app) {
    try {
      await api(`/api/admin/applications/${app.id}`, { method: "PATCH", token, body: { status: "REJECTED" } });
      setPending((p) => p.filter((x) => x.id !== app.id));
      setSelectedApp(null);
      flash(`${app.user.name}'s application rejected`);
    } catch (e) { fail(e); }
  }

  async function requestInfo(app) {
    const note = window.prompt("What do you need from this applicant?");
    if (!note || !note.trim()) return;
    try {
      const d = await api(`/api/admin/applications/${app.id}/info`, { method: "PATCH", token, body: { note: note.trim() } });
      setPending((p) => p.map((x) => (x.id === app.id ? d.application : x)));
      setSelectedApp(d.application);
      flash("Info request sent");
    } catch (e) { fail(e); }
  }

  async function openArtisanDetail(a) {
    try {
      const d = await api(`/api/admin/artisans/${a.id}/detail`, { token });
      setSelectedArtisanDetail(d);
    } catch (e) { fail(e); }
  }

    async function toggleProStatus(a) {
    try {
      const nextIsPro = !a.isPro;
      let proExpiresAt = null;
      if (nextIsPro) {
        const days = window.prompt("Grant Pro for how many days?", "30");
        if (!days) return;
        const d = new Date();
        d.setDate(d.getDate() + Number(days));
        proExpiresAt = d.toISOString();
      }
      await api(`/api/admin/artisans/${a.id}`, { method: "PATCH", token, body: { isPro: nextIsPro, proExpiresAt } });
      setActive((arr) => arr.map((x) => (x.id === a.id ? { ...x, isPro: nextIsPro, proExpiresAt } : x)));
      flash(nextIsPro ? `${a.user.name} is now Pro` : `${a.user.name}'s Pro status removed`);
    } catch (e) { fail(e); }
  }

  async function setBadge(id, badge) {
    try {
      await api(`/api/admin/artisans/${id}`, { method: "PATCH", token, body: { badge } });
      setActive((a) => a.map((x) => (x.id === id ? { ...x, badge } : x)));
      flash("Badge updated");
    } catch (e) {
      if (badge === "TOP_RATED" && /not eligible/i.test(e.message)) {
        const ok = window.confirm(`${e.message}\n\nOverride anyway?`);
        if (ok) {
          try {
            await api(`/api/admin/artisans/${id}`, { method: "PATCH", token, body: { badge, force: true } });
            setActive((a) => a.map((x) => (x.id === id ? { ...x, badge } : x)));
            flash("Badge force-updated");
          } catch (e2) { fail(e2); }
        }
        return;
      }
      fail(e);
    }
  }
    async function toggleSuspend(a) {
    try {
      const nextSuspended = !a.suspended;
      await api(`/api/admin/artisans/${a.id}`, { method: "PATCH", token, body: { suspended: nextSuspended } });
      setActive((arr) => arr.map((x) => (x.id === a.id ? { ...x, suspended: nextSuspended } : x)));
      flash(nextSuspended ? `${a.user.name} suspended — hidden from customers` : `${a.user.name} reactivated`);
    } catch (e) { fail(e); }
  }

  const flaggedCount = active.filter((a) => a.flagged).length;

  return (
    <div className="phone">
      <div className="content">
        <div className="topbar">
          <div className="brand"><span className="brand-mark"><ShieldCheck size={16} /></span><span className="brand-name">VettedHands</span><span className="brand-sub">Admin</span></div>
          <button className="iconbtn" onClick={onLogout} title="Log out"><LogOut size={16} /></button>
        </div>

        {loading ? (
          <div className="empty"><div className="empty-title">Loading…</div></div>
        ) : (
          <>
            {stats && (
              <div className="stats-grid stats-grid--full">
                <div className="stat-box"><div className="stat-num">{stats.totalUsers}</div><div className="stat-label">Users</div></div>
                <div className="stat-box"><div className="stat-num">{stats.totalArtisans}</div><div className="stat-label">Artisans</div></div>
                <div className="stat-box"><div className="stat-num">{stats.pendingApplications}</div><div className="stat-label">Pending apps</div></div>
                <div className="stat-box"><div className="stat-num">{stats.pendingRequests}</div><div className="stat-label">Pending req.</div></div>
                <div className="stat-box"><div className="stat-num">{stats.activeJobs}</div><div className="stat-label">Active jobs</div></div>
                <div className="stat-box"><div className="stat-num">{stats.completedJobs}</div><div className="stat-label">Completed</div></div>
                <div className="stat-box"><div className="stat-num">{stats.cancelledJobs}</div><div className="stat-label">Cancelled</div></div>
                <div className="stat-box"><div className="stat-num">{stats.reviews}</div><div className="stat-label">Reviews</div></div>
                <div className="stat-box stat-box--warn"><div className="stat-num">{flaggedCount}</div><div className="stat-label">Flagged</div></div>
                <div className="stat-box stat-box--warn"><div className="stat-num">{stats.reports}</div><div className="stat-label">Reports</div></div>
              </div>
            )}

            <div className="tabs tabs--wrap">
              <button className={"tab" + (tab === "pending" ? " tab--active" : "")} onClick={() => setTab("pending")}>Pending {pending.length > 0 && <span className="tab-count">{pending.length}</span>}</button>
              <button className={"tab" + (tab === "active" ? " tab--active" : "")} onClick={() => setTab("active")}>Active</button>
              <button className={"tab" + (tab === "requests" ? " tab--active" : "")} onClick={() => setTab("requests")}>Requests</button>
              <button className={"tab" + (tab === "reports" ? " tab--active" : "")} onClick={() => setTab("reports")}>Reports {reports.length > 0 && <span className="tab-count">{reports.length}</span>}</button>
              <button className={"tab" + (tab === "activity" ? " tab--active" : "")} onClick={() => setTab("activity")}>Activity</button>
            </div>

            {tab === "pending" && (
              <div className="feed feed--scroll">
                {pending.length === 0 && <div className="empty"><div className="empty-title">Nothing waiting</div><div className="empty-sub">All applications have been reviewed.</div></div>}
                {pending.map((app) => (
                  <button key={app.id} className="app-card" onClick={() => setSelectedApp(app)}>
                    <div className="app-top">
                      <div className="avatar">{initials(app.user.name)}</div>
                      <div className="app-top-text">
                        <div className="app-name">{app.user.name}</div>
                        <div className="app-trade"><MapPin size={11} /> {tradeLabel(app.trade)} · {app.user.area || "—"}</div>
                      </div>
                    </div>
                    <div className="app-bio">{app.bio}</div>
                    {app.infoRequestNote && <div className="info-tag">Info requested</div>}
                  </button>
                ))}
              </div>
            )}

            {tab === "active" && (
              <div className="feed feed--scroll">
                {active.map((a) => (
                  <div key={a.id} className={"artisan-row" + (a.flagged ? " artisan-row--flagged" : "") + (a.suspended ? " artisan-row--suspended" : "")}>
                    <button className="app-top" style={{ background: "none", border: "none", padding: 0, cursor: "pointer", width: "100%", textAlign: "left" }} onClick={() => openArtisanDetail(a)}>
                      <div className="avatar">{initials(a.user.name)}</div>
                      <div className="app-top-text">
                        <div className="app-name">{a.user.name} {a.flagged && <AlertTriangle size={12} className="flag-icon" />} {a.suspended && <span className="suspended-tag">Suspended</span>}</div>
                        <div className="app-trade"><MapPin size={11} /> {tradeLabel(a.trade)} · {a.area}</div>
                      </div>
                    </button>
                    <div className="artisan-meta">
                      <span><Star size={12} fill="#B5651D" stroke="none" /> {Number(a.rating).toFixed(1)}</span>
                      <span className="dot-sep">·</span>
                      <span>{a.jobsCompleted} jobs</span>
                    </div>
                    <div className="artisan-actions">
                      <select value={a.badge} onChange={(e) => setBadge(a.id, e.target.value)} className="badge-select">
                        <option value="VETTED">Vetted</option>
                        <option value="TOP_RATED">Top Rated</option>
                      </select>
                      <button className={"pro-btn" + (a.isPro ? " pro-btn--active" : "")} onClick={() => toggleProStatus(a)}>{a.isPro ? "Pro ✓" : "Make Pro"}</button>
                      <button className={"suspend-btn" + (a.suspended ? " suspend-btn--reactivate" : "")} onClick={() => toggleSuspend(a)}>{a.suspended ? "Reactivate" : "Suspend"}</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

                        {tab === "requests" && (
              <div className="feed feed--scroll">
                {serviceRequests.length === 0 && <div className="empty"><div className="empty-title">No requests yet</div></div>}
                {serviceRequests.map((r) => (
                  <div key={r.id} className="req-row">
                    <div className="req-row-top">
                      <span className="req-row-parties">{r.student.name} → {r.artisanProfile.user.name}</span>
                      <span className={"status-pill status-pill--" + r.status.toLowerCase()}>{r.status}</span>
                    </div>
                    <div className="req-row-job">{r.job}</div>
                    <div className="req-row-meta">{tradeLabel(r.artisanProfile.trade)} · {new Date(r.updatedAt).toLocaleString()}</div>
                  </div>
                ))}
              </div>
            )}

            {tab === "reports" && (
              <div className="feed feed--scroll">
                {reports.length === 0 && <div className="empty"><div className="empty-title">No reports</div></div>}
                {reports.map((rep) => (
                  <div key={rep.id} className="report-row">
                    <div className="req-row-top">
                      <span className="req-row-parties">{rep.reporter.name} reported {rep.artisanProfile.user.name}</span>
                      <span className="report-reason">{rep.reason}</span>
                    </div>
                    {rep.note && <div className="report-note">"{rep.note}"</div>}
                    <div className="req-row-meta">Job: {rep.request.job} · {new Date(rep.createdAt).toLocaleString()}</div>
                  </div>
                ))}
              </div>
            )}

            {tab === "activity" && (
              <div className="feed feed--scroll">
                {activity.map((f) => (
                  <div key={f.id} className="activity-wrap">
                    <div className="activity-row"><Activity size={13} /><span>{f.text}</span></div>
                    <span className="activity-time">{new Date(f.time).toLocaleString()}</span>
                  </div>
                ))}
                {activity.length === 0 && <div className="empty"><div className="empty-title">No activity yet</div></div>}
              </div>
            )}
          </>
        )}
      </div>

      {selectedApp && (
        <div className="modal-backdrop" onClick={() => setSelectedApp(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-back" onClick={() => setSelectedApp(null)}><ArrowLeft size={16} /> Back</button>
            <div className="modal-top">
              <div className="avatar avatar--lg">{initials(selectedApp.user.name)}</div>
              <div>
                <div className="modal-name">{selectedApp.user.name}</div>
                <div className="app-trade"><MapPin size={12} /> {tradeLabel(selectedApp.trade)} · {selectedApp.user.area || "—"}</div>
              </div>
            </div>
            <p className="modal-bio">{selectedApp.bio}</p>
            {(selectedApp.phone || selectedApp.socialHandle) && (
              <div className="modal-contact">
                {selectedApp.phone && <div><strong>Phone:</strong> {selectedApp.phone}</div>}
                {selectedApp.socialHandle && <div><strong>Social:</strong> {selectedApp.socialHandle}</div>}
              </div>
            )}
            {selectedApp.idDocumentUrl && (
              <div className="modal-id-section">
                <div className="modal-id-label">Government ID</div>
                <img src={selectedApp.idDocumentUrl} className="modal-id-img" />
              </div>
            )}
            {selectedApp.photos && selectedApp.photos.length > 0 && (
              <div className="modal-photos">
                {selectedApp.photos.map((p, i) => (
                  <img key={p.id || i} src={p.url || p} className="modal-photo-tile" />
                ))}
              </div>
            )}
            <div className="modal-note"><AlertTriangle size={13} /> Vetting checklist (manual, off-app for now): confirm the ID photo matches their name, call the listed phone number, cross-check their social handle, review sample work photos before approving.</div>
            {selectedApp.infoRequestNote && (
              <div className="modal-contact"><strong>Info requested:</strong> {selectedApp.infoRequestNote}</div>
            )}
            <div className="modal-actions">
              <button className="reject-btn" onClick={() => reject(selectedApp)}><XCircle size={15} /> Reject</button>
              <button className="info-btn" onClick={() => requestInfo(selectedApp)}>Request info</button>
              <button className="approve-btn" onClick={() => approve(selectedApp)}><CheckCircle2 size={15} /> Approve &amp; list</button>
            </div>
          </div>
        </div>
      )}

      {selectedArtisanDetail && (
        <div className="modal-backdrop" onClick={() => setSelectedArtisanDetail(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-back" onClick={() => setSelectedArtisanDetail(null)}><ArrowLeft size={16} /> Back</button>
            <div className="modal-top">
              <div className="avatar avatar--lg">{initials(selectedArtisanDetail.artisan.user.name)}</div>
              <div>
                <div className="modal-name">{selectedArtisanDetail.artisan.user.name}</div>
                <div className="app-trade"><MapPin size={12} /> {tradeLabel(selectedArtisanDetail.artisan.trade)} · {selectedArtisanDetail.artisan.area}</div>
              </div>
            </div>
            <div className="modal-contact">
              {selectedArtisanDetail.artisan.phone && <div><strong>Phone:</strong> {selectedArtisanDetail.artisan.phone}</div>}
              {selectedArtisanDetail.artisan.socialHandle && <div><strong>Social:</strong> {selectedArtisanDetail.artisan.socialHandle}</div>}
              <div><strong>Email:</strong> {selectedArtisanDetail.artisan.user.email}</div>
            </div>
            {selectedArtisanDetail.artisan.idDocumentUrl && (
              <div className="modal-id-section">
                <div className="modal-id-label">Government ID</div>
                <img src={selectedArtisanDetail.artisan.idDocumentUrl} className="modal-id-img" />
              </div>
            )}
            <div className="detail-section-label">Jobs ({selectedArtisanDetail.jobs.length})</div>
            <div className="detail-list">
              {selectedArtisanDetail.jobs.map((j) => (
                <div key={j.id} className="req-row">
                  <div className="req-row-top"><span className="req-row-parties">{j.student.name}</span><span className={"status-pill status-pill--" + j.status.toLowerCase()}>{j.status}</span></div>
                  <div className="req-row-job">{j.job}</div>
                </div>
              ))}
              {selectedArtisanDetail.jobs.length === 0 && <div className="empty-sub">No jobs yet.</div>}
            </div>
            <div className="detail-section-label">Reviews ({selectedArtisanDetail.reviews.length})</div>
            <div className="detail-list">
              {selectedArtisanDetail.reviews.map((r) => (
                <div key={r.id} className="review-row">★{r.rating} — "{r.reviewText}" <span className="review-row-author">({r.student.name})</span></div>
              ))}
              {selectedArtisanDetail.reviews.length === 0 && <div className="empty-sub">No reviews yet.</div>}
            </div>
            <div className="detail-section-label">Reports ({selectedArtisanDetail.reports.length})</div>
            <div className="detail-list">
              {selectedArtisanDetail.reports.map((rep) => (
                <div key={rep.id} className="report-row">
                  <div className="req-row-top"><span className="req-row-parties">{rep.reporter.name}</span><span className="report-reason">{rep.reason}</span></div>
                  {rep.note && <div className="report-note">"{rep.note}"</div>}
                </div>
              ))}
              {selectedArtisanDetail.reports.length === 0 && <div className="empty-sub">No reports.</div>}
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

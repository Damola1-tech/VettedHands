<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0F4D3A" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="favicon.ico" sizes="48x48" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>VettedHands Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{--bg:#F5F0E4;--surface:#fff;--ink:#14201B;--soft:#6B6B5E;--line:#E4DCC8;--green:#0F4D3A;--mint:#E3EFE9;--amber:#B97A12;--amberbg:#FBEBC8;--red:#A8402D;--redbg:#F8E3DD;--blue:#1F5A8A;--bluebg:#DDE9F4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',sans-serif}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:26px;margin:0}
h3{font-size:17px;font-weight:700;margin:0}
button,input,select,textarea{font-family:inherit;font-size:14px}
.boot{padding:60px;text-align:center;color:var(--soft)}
.soft{color:var(--soft)} .good{color:var(--green);font-weight:600} .bad{color:var(--red);font-weight:600} .center{text-align:center}
.shell{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:244px;background:var(--green);color:#fff;display:flex;flex-direction:column;padding:22px 12px;z-index:40;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;padding:0 8px 22px}
.logo small{display:block;font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:500;opacity:.7}
.logo-mark{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 12px;border:none;background:none;color:rgba(255,255,255,.82);font-weight:500;font-size:14.5px;border-radius:10px;cursor:pointer;text-align:left;margin-bottom:2px}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:rgba(255,255,255,.15);color:#fff;font-weight:700}
.nav-n{background:#D69A1F;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding:14px 8px 0;display:flex;align-items:center;gap:10px}
.side-foot .avatar{background:#fff!important;color:var(--green)!important}
.side-who{flex:1;min-width:0;font-weight:700;font-size:13.5px}
.side-who span{display:block;font-weight:400;opacity:.7;font-size:12px}
.side-out{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
.main{margin-left:244px;flex:1;min-width:0;padding:32px 36px 70px}
.mtop{display:none}
.scrim{display:none}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head-sub{margin:6px 0 0;color:var(--soft)}
.search{min-width:260px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;flex-shrink:0;font-family:'Bricolage Grotesque',sans-serif}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;font:inherit}
.stat.click{cursor:pointer}
.stat-l{color:var(--soft);font-size:13px}
.stat-n{font-family:'Bricolage Grotesque',sans-serif;font-size:34px;font-weight:800;margin:4px 0 2px}
.stat-s{color:var(--soft);font-size:12.5px}
.stat.amber{border-color:#EBD7A8}.stat.amber .stat-n{color:var(--amber)}
.stat.red{border-color:#E9C7BD}.stat.red .stat-n{color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.split.rep{grid-template-columns:370px minmax(0,1fr)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip span{opacity:.6;margin-left:6px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-align:left;padding:14px 16px;background:#FAF7EE;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid #EEE7D5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:#FBF9F2}
tr.sel td{background:#EEF6F1}
.who{display:flex;align-items:center;gap:11px}
.who b{display:block}
.who small{color:var(--soft)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-green{background:var(--mint);color:var(--green)}.p-amber{background:var(--amberbg);color:#7A4F0C}.p-blue{background:var(--bluebg);color:var(--blue)}
.p-red{background:var(--redbg);color:var(--red)}.p-grey{background:#ECE7D8;color:#4A4636}.p-dark{background:var(--green);color:#fff}
.badges{display:inline-flex;gap:5px;flex-wrap:wrap}
.btn{border:1.5px solid var(--green);background:#fff;color:var(--green);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--green);color:#fff}
.btn-danger{border-color:#C9806F;color:var(--red)}
.btn-info{border-color:#2F6A96;color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.btn-sm{padding:7px 12px;font-size:13px}
.empty{padding:50px 20px;text-align:center;color:var(--soft)}
.empty.err{color:var(--red)}
.back{background:none;border:none;color:var(--green);font-weight:700;cursor:pointer;padding:0;margin-bottom:16px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px;margin-top:6px}
.kv label,.lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:3px;font-weight:600}
.kv div b{font-weight:600}
.doc{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.doc-i{width:40px;height:44px;background:#ECE7D8;border-radius:8px;flex-shrink:0}
.doc-t{flex:1;min-width:0}
.doc-t small{display:block;color:var(--soft)}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.ptiles img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--green)}
.note{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:96px;resize:vertical}
.stack>*{margin-top:10px}
.hist{margin:12px 0 0;padding:0;list-style:none}
.hist li{padding:8px 0;border-bottom:1px solid #EEE7D5;font-size:13px}
.hist li:last-child{border-bottom:none}
.hist small{display:block;color:var(--soft)}
.panel-top{display:flex;gap:12px;align-items:center}
.panel-warn{background:var(--redbg);color:var(--red);border-radius:12px;padding:12px;margin:14px 0;font-size:13px}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.count{background:#F4EFE0;border-radius:12px;text-align:center;padding:12px 6px}
.count b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px}
.count span{font-size:12px;color:var(--soft)}
.vrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EEE7D5;font-size:13.5px}
.vrow:last-child{border-bottom:none}
.mini{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #EEE7D5;font-size:13px}
.mini:last-child{border-bottom:none}
.mini span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:18px 0 4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:210px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;border-radius:8px 8px 0 0;min-height:3px}
.bar-v{font-size:12px;font-weight:700;margin-bottom:4px}
.bar-l{font-size:11.5px;color:var(--soft);margin-top:8px}
.hb{display:flex;align-items:center;gap:12px;margin:10px 0}
.hb-n{width:110px;font-weight:600;flex-shrink:0}
.hb-t{flex:1;height:12px;background:#EEE7D5;border-radius:999px;overflow:hidden}
.hb-t div{height:100%;background:var(--green);border-radius:999px}
.hb-v{width:40px;text-align:right;font-weight:700}
.prog{width:140px}
.prog small{color:var(--soft);display:flex;justify-content:space-between}
.prog i{display:block;height:7px;background:#EEE7D5;border-radius:99px;margin-top:4px;overflow:hidden}
.prog i b{display:block;height:100%;background:var(--green)}
.callout{background:var(--amberbg);border-radius:12px;padding:14px 16px;margin-top:16px;color:#6B4509}
.revcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.revhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.revtext{font-size:15px;margin:10px 0}
.revact{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.revwhy{color:var(--red);font-size:12.5px;font-weight:600;flex:1}
.rep-list{display:flex;flex-direction:column;gap:10px}
.rep-item{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:inherit}
.rep-item.on{border:2px solid var(--green);padding:13px}
.rep-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rep-t{font-weight:600;margin:8px 0 6px}
.rep-b{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.s-new{color:var(--red);font-weight:700}.s-investigating{color:var(--amber);font-weight:700}.s-resolved{color:var(--green);font-weight:700}.s-dismissed{color:var(--soft);font-weight:700}
.stmt{background:#F4EFE0;border-radius:12px;padding:16px;font-size:15px;margin:14px 0}
.tl{margin:8px 0 0;padding:0;list-style:none;max-height:260px;overflow-y:auto}
.tl li{display:flex;gap:16px;padding:6px 0}
.tl time{width:70px;color:var(--soft);font-size:12.5px;flex-shrink:0}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.lightbox{position:fixed;inset:0;background:rgba(10,20,16,.82);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}
.lightbox-x{position:absolute;top:18px;right:20px;background:#fff;border:none;border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;z-index:90;max-width:90vw}
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.login-left{background:var(--green);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-left .logo{padding:0}
.login-left h1{font-size:46px;line-height:1.05;max-width:480px;margin-bottom:18px}
.login-left p{opacity:.82;max-width:440px;font-size:16px;margin:0}
.login-right{display:flex;align-items:center;justify-content:center;padding:30px}
.login-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login-form label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.login-form input{border:1.5px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.login-form input:focus{outline:none;border-color:var(--green)}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--soft);font-weight:700}
.login-err{background:var(--redbg);color:var(--red);padding:10px 12px;border-radius:10px}
.login-note{font-size:12.5px;color:var(--soft)}
@media (max-width:1150px){.split,.split.rep,.two{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
 .side{transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
 .mtop{display:flex;position:fixed;top:0;left:0;right:0;height:56px;background:var(--green);color:#fff;align-items:center;gap:12px;padding:0 14px;z-index:30;font-weight:700}
 .mtop button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;font-size:16px}
 .main{margin-left:0;padding:76px 16px 60px}
 h1{font-size:26px}.search{min-width:0;width:100%}
}
@media (max-width:800px){.login{grid-template-columns:1fr}.login-left{display:none}}
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const API_BASE = "https://vettedhands-backend.onrender.com";

async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}

/* ============ helpers ============ */
const TRADES = { ELECTRICIAN: "Electrician", PLUMBER: "Plumber", TAILOR: "Tailor", PHONE_REPAIR: "Phone Repair", LAPTOP_REPAIR: "Laptop Repair", PAINTER: "Painter", CARPENTER: "Carpenter", CLEANER: "Cleaner" };
const tradeLabel = (t) => TRADES[t] || t;
const NAV = [["dashboard", "Dashboard"], ["applications", "Artisan Applications"], ["artisans", "Artisans"], ["customers", "Customers"], ["requests", "Service Requests"], ["active", "Active Jobs"], ["completed", "Completed Jobs"], ["reviews", "Reviews"], ["reports", "Reports"], ["verification", "Verification"], ["settings", "Settings"]];
const PAGES = NAV.map((n) => n[0]);
const initials = (n = "") => n.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
const fmtDate = (d) => new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const fmtDateLong = (d) => new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const fmtTime = (d) => new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
function relDay(d) { const x = new Date(d), t = new Date(); if (x.toDateString() === t.toDateString()) return "Today"; if (x.toDateString() === new Date(t.getTime() - 864e5).toDateString()) return "Yesterday"; return fmtDate(d); }
function ago(d) { const s = (Date.now() - new Date(d).getTime()) / 1000; if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " hours ago"; if (s < 172800) return "Yesterday"; return Math.round(s / 86400) + " days ago"; }
function waitLabel(d) { const n = Math.floor((Date.now() - new Date(d).getTime()) / 864e5); return n < 1 ? "Today" : n === 1 ? "1 day" : n + " days"; }
const shortId = (id, p = "VH") => `${p}-${String(id).slice(0, 4).toUpperCase()}`;
const firstLast = (name = "") => { const p = name.trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : p[0]; };
const match = (q, ...f) => !q.trim() || f.join(" ").toLowerCase().includes(q.trim().toLowerCase());
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function downloadCsv(rows, name) {
  const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const url = URL.createObjectURL(new Blob([rows.map((r) => r.map(esc).join(",")).join("\n")], { type: "text/csv" }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
}

const TINTS = [["#E3EFE9", "#0F4D3A"], ["#FBEBC8", "#8A5A12"], ["#DDE9F4", "#1F5A8A"], ["#F6E1DA", "#9A3B26"], ["#ECE7D8", "#4A4636"]];
function Avatar({ name, size = 38 }) {
  let h = 0; for (const c of name || "") h += c.charCodeAt(0);
  const [bg, fg] = TINTS[h % TINTS.length];
  return <span className="avatar" style={{ width: size, height: size, background: bg, color: fg, fontSize: size * 0.36 }}>{initials(name)}</span>;
}
const Shield = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><polyline points="9 12 11 14 15 10" /></svg>;

const REQ_STATUS = { PENDING: ["Pending", "p-amber"], ACCEPTED: ["Accepted", "p-blue"], CONFIRMED: ["In Progress", "p-green"], COMPLETED: ["Completed", "p-dark"], DECLINED: ["Cancelled", "p-red"], CLOSED: ["Cancelled", "p-red"] };
const ReqPill = ({ status }) => { const [t, c] = REQ_STATUS[status] || [status, "p-grey"]; return <span className={"pill " + c}>{t}</span>; };
const Badges = ({ a }) => <span className="badges"><span className="pill p-green">Vetted</span>{a.skillVerified && <span className="pill p-blue">Skill</span>}{a.badge === "TOP_RATED" && <span className="pill p-amber">Top</span>}</span>;
const Head = ({ title, sub, right }) => <div className="head"><div><h1>{title}</h1>{sub && <p className="head-sub">{sub}</p>}</div>{right}</div>;
const SearchBox = ({ value, onChange, placeholder }) => <input className="search" value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} />;
const Chips = ({ items, value, onChange }) => <div className="chips">{items.map(([k, l, n]) => <button key={k} className={"chip" + (value === k ? " on" : "")} onClick={() => onChange(k)}>{l}{n != null && <span>{n}</span>}</button>)}</div>;
const Lightbox = ({ src, onClose }) => !src ? null : <div className="lightbox" onClick={onClose}><img src={src} onClick={(e) => e.stopPropagation()} /><button className="lightbox-x" onClick={onClose}>✕</button></div>;
const docsLabel = (a) => !a.hasId ? <span className="bad">ID missing</span> : <span className="good">ID{a.photoCount ? ` + ${plural(a.photoCount, "photo")}` : ""}</span>;

function useFetch(token, path) {
  const [st, setSt] = useState({ path: null, data: null, loading: true, error: null });
  const [tick, setTick] = useState(0);
  useEffect(() => {
    if (!path) { setSt({ path: null, data: null, loading: false, error: null }); return; }
    let live = true;
    setSt((s) => ({ path, data: s.path === path ? s.data : null, loading: true, error: null }));
    api(path, { token })
      .then((data) => { if (live) setSt({ path, data, loading: false, error: null }); })
      .catch((e) => { if (live) setSt({ path, data: null, loading: false, error: e.message }); });
    return () => { live = false; };
  }, [path, token, tick]);
  return { data: st.data, loading: st.loading, error: st.error, reload: () => setTick((t) => t + 1) };
}
function wait(res) {
  if (res.error) return <div className="empty err">{res.error}</div>;
  if (!res.data) return <div className="empty">Loading…</div>;
  return null;
}

/* ============ charts ============ */
function LineChart({ data }) {
  const W = 560, H = 230, p = { l: 34, r: 14, t: 26, b: 30 };
  const top = Math.max(4, Math.ceil(Math.max(...data.map((d) => d.count)) / 4) * 4);
  const x = (i) => p.l + (i * (W - p.l - p.r)) / Math.max(1, data.length - 1);
  const y = (v) => p.t + (H - p.t - p.b) * (1 - v / top);
  const line = data.map((d, i) => `${i ? "L" : "M"}${x(i)},${y(d.count)}`).join(" ");
  const area = `${line} L${x(data.length - 1)},${y(0)} L${x(0)},${y(0)} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%">
      {[0, 1, 2, 3, 4].map((i) => { const v = (top / 4) * i; return <g key={i}><line x1={p.l} x2={W - p.r} y1={y(v)} y2={y(v)} stroke="#E4DCC8" /><text x={p.l - 8} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#6B6B5E">{v}</text></g>; })}
      <path d={area} fill="#0F4D3A" opacity=".08" />
      <path d={line} fill="none" stroke="#0F4D3A" strokeWidth="2.5" />
      {data.map((d, i) => <g key={i}><circle cx={x(i)} cy={y(d.count)} r="4.5" fill="#fff" stroke="#0F4D3A" strokeWidth="2" /><text x={x(i)} y={y(d.count) - 10} textAnchor="middle" fontSize="11.5" fontWeight="700">{d.count}</text><text x={x(i)} y={H - 8} textAnchor="middle" fontSize="11" fill="#6B6B5E">{d.label}</text></g>)}
    </svg>
  );
}
function BarChart({ data, color }) {
  const max = Math.max(1, ...data.map((d) => d.count));
  return <div className="bars">{data.map((d) => <div className="bar-col" key={d.label}><div className="bar-v">{d.count}</div><div className="bar" style={{ height: (d.count / max) * 150 + "px", background: color }} /><div className="bar-l">{d.label}</div></div>)}</div>;
}
function HBars({ data }) {
  if (!data.length) return <div className="empty">No requests yet.</div>;
  const max = Math.max(...data.map((d) => d.count));
  return <div>{data.map((d) => <div className="hb" key={d.trade}><span className="hb-n">{tradeLabel(d.trade)}</span><span className="hb-t"><div style={{ width: (d.count / max) * 100 + "%" }} /></span><span className="hb-v">{d.count}</span></div>)}</div>;
}

/* ============ login + app ============ */
function Login({ onLogin }) {
  const [email, setEmail] = useState(""); const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);
  async function submit(e) { e.preventDefault(); setErr(null); setBusy(true); try { await onLogin(email.trim(), password); } catch (ex) { setErr(ex.message); } finally { setBusy(false); } }
  return (
    <div className="login">
      <div className="login-left">
        <div className="logo"><span className="logo-mark"><Shield /></span>VettedHands</div>
        <div><h1>Trust is built by the people behind the badges.</h1><p>Review applications, verify artisans and keep every job fair. Your decisions decide who customers can trust.</p></div>
        <div style={{ opacity: .6, fontSize: 13 }}>VettedHands Admin</div>
      </div>
      <div className="login-right">
        <form className="login-form" onSubmit={submit}>
          <div className="kicker">ADMIN CONSOLE</div>
          <h2>Sign in</h2>
          <label>Work email<input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} /></label>
          <label>Password<input required type="password" value={password} onChange={(e) => setPassword(e.target.value)} /></label>
          {err && <div className="login-err">{err}</div>}
          <button className="btn btn-primary wide" disabled={busy}>{busy ? "Please wait…" : "Sign in to dashboard"}</button>
          <div className="login-note">Admin accounts only.</div>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => localStorage.getItem("vh_admin_token") || null);
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(!!token);
  useEffect(() => {
    if (!token) { setChecking(false); return; }
    api("/api/auth/me", { token })
      .then((d) => { if (d.user.role !== "ADMIN") throw new Error("Not an admin account"); setUser(d.user); })
      .catch(() => { localStorage.removeItem("vh_admin_token"); setToken(null); })
      .finally(() => setChecking(false));
  }, [token]);
  async function login(email, password) {
    const d = await api("/api/auth/login", { method: "POST", body: { email, password } });
    if (d.user.role !== "ADMIN") throw new Error("This account isn't an admin");
    localStorage.setItem("vh_admin_token", d.token); setToken(d.token); setUser(d.user);
  }
  function logout() { localStorage.removeItem("vh_admin_token"); setToken(null); setUser(null); }
  if (checking) return <div className="boot">Loading…</div>;
  if (!token || !user) return <Login onLogin={login} />;
  return <Shell token={token} user={user} onLogout={logout} />;
}

function Shell({ token, user, onLogout }) {
  const first = (window.location.hash || "").replace(/^#\//, "");
  const [page, setPage] = useState(PAGES.includes(first) ? first : "dashboard");
  const [param, setParam] = useState(null);
  const [menu, setMenu] = useState(false);
  const [toast, setToast] = useState(null);
  const [img, setImg] = useState(null);
  const stats = useFetch(token, "/api/admin/stats");
  const s = stats.data ? stats.data.stats : null;
  const badge = { applications: s ? s.pendingApplications : 0, reports: s ? s.openReports : 0 };

  function go(p, id = null) { setPage(p); setParam(id); setMenu(false); window.location.hash = "/" + p; window.scrollTo(0, 0); }
  function flash(m) { setToast(m); clearTimeout(window.__vhT); window.__vhT = setTimeout(() => setToast(null), 2800); }
  const c = { token, flash, go, param, openImage: setImg, refreshStats: stats.reload, statsRes: stats };

  let body;
  if (page === "dashboard") body = <Dashboard {...c} />;
  else if (page === "applications") body = param ? <ApplicationDetail key={param} id={param} {...c} /> : <Applications {...c} />;
  else if (page === "artisans") body = <Artisans key={param || "x"} {...c} />;
  else if (page === "customers") body = <Customers {...c} />;
  else if (page === "requests") body = <Requests {...c} />;
  else if (page === "active") body = <ActiveJobs {...c} />;
  else if (page === "completed") body = <Completed {...c} />;
  else if (page === "reviews") body = <Reviews {...c} />;
  else if (page === "reports") body = <Reports {...c} />;
  else if (page === "verification") body = <Verification {...c} />;
  else body = <Settings {...c} user={user} />;

  return (
    <div className="shell">
      <div className="mtop"><button onClick={() => setMenu(true)}>☰</button>VettedHands Admin</div>
      <div className={"scrim" + (menu ? " open" : "")} onClick={() => setMenu(false)} />
      <aside className={"side" + (menu ? " open" : "")}>
        <div className="logo"><span className="logo-mark"><Shield /></span><div>VettedHands<small>Admin</small></div></div>
        {NAV.map(([k, l]) => (
          <button key={k} className={"nav" + (page === k ? " on" : "")} onClick={() => go(k)}>
            {l}{badge[k] > 0 && <span className="nav-n">{badge[k]}</span>}
          </button>
        ))}
        <div className="side-foot">
          <Avatar name={user.name} size={36} />
          <div className="side-who">{user.name}<span>Admin</span></div>
          <button className="side-out" onClick={onLogout}>Log out</button>
        </div>
      </aside>
      <main className="main">{body}</main>
      <Lightbox src={img} onClose={() => setImg(null)} />
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

  const today = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const last = (a) => (a.length ? a[a.length - 1].count : 0);
  const Card = ({ l, n, sub, tone, to }) => <button className={"stat" + (tone ? " " + tone : "") + (to ? " click" : "")} onClick={() => to && go(to)}><div className="stat-l">{l}</div><div className="stat-n">{n}</div><div className="stat-s">{sub}</div></button>;
  return (
    <>
      <Head title="Dashboard" sub={`${today} · Ado-Ekiti`} />
      <div className="stats">
        <Card l="Total users" n={s.totalUsers} sub={`+${s.newUsers30d} this month`} />
        <Card l="Total artisans" n={s.totalArtisans} sub={`${s.activeArtisans} currently active`} to="artisans" />
        <Card l="Pending applications" n={s.pendingApplications} tone="amber" sub={s.pendingApplications ? `Oldest waiting ${plural(s.oldestPendingDays, "day")}` : "Nothing waiting"} to="applications" />
        <Card l="Active jobs" n={s.activeJobs} sub="Accepted or in progress" to="active" />
        <Card l="Completed jobs" n={s.completedJobs} sub={`${s.completedThisWeek} this week`} to="completed" />

        <div className="card"><div className="card-h"><h3>Completed jobs</h3><span className="soft">Per week · {last(series.completed)} this week</span></div><BarChart data={series.completed} color="#0F4D3A" /></div>
        <div className="card"><div className="card-h"><h3>New artisans</h3><span className="soft">Approved per week · {last(series.artisans)} this week</span></div><BarChart data={series.artisans} color="#1B6650" /></div>
        <div className="card"><div className="card-h"><h3>Popular services</h3><span className="soft">Requests, all time</span></div><HBars data={popular} /></div>

/* ============ applications ============ */
const BUCKET = { review: ["Under review", "p-amber"], info: ["More info needed", "p-blue"], approved: ["Approved", "p-green"], rejected: ["Rejected", "p-red"] };
const bucketOf = (a) => a.status === "PENDING" ? (a.infoRequestNote ? "info" : "review") : a.status === "APPROVED" ? "approved" : "rejected";

function Applications({ token, go }) {
  const res = useFetch(token, "/api/admin/applications?status=all");
  const [chip, setChip] = useState("all"); const [q, setQ] = useState("");
  const w = wait(res); if (w) return w;
  const all = res.data.applications.map((a) => ({ ...a, bucket: bucketOf(a) }));
  const n = (b) => all.filter((a) => a.bucket === b).length;
  const rows = all.filter((a) => (chip === "all" || a.bucket === chip) && match(q, a.user.name, tradeLabel(a.trade), a.user.area));
  const waiting = n("review") + n("info");
  return (
    <>
      <Head title="Artisan applications" sub={`${waiting} waiting for review · oldest first`} right={<SearchBox value={q} onChange={setQ} placeholder="Search by name, trade or location" />} />
      <Chips value={chip} onChange={setChip} items={[["all", "All", all.length], ["review", "Under review", n("review")], ["info", "More info needed", n("info")], ["approved", "Approved", n("approved")], ["rejected", "Rejected", n("rejected")]]} />
      <div className="tbl-wrap"><table>
        <thead><tr><th>Applicant</th><th>Trade</th><th>Location</th><th>Applied</th><th>Documents</th><th>Status</th><th></th></tr></thead>
        <tbody>
          {rows.map((a) => { const [t, c] = BUCKET[a.bucket]; return (
            <tr key={a.id} className="row" onClick={() => go("applications", a.id)}>
              <td><div className="who"><Avatar name={a.user.name} /><div><b>{a.user.name}</b><small>{a.user.email}</small></div></div></td>
              <td>{tradeLabel(a.trade)}</td><td>{a.user.area || "—"}</td><td>{fmtDate(a.createdAt)}</td><td>{docsLabel(a)}</td>
              <td><span className={"pill " + c}>{t}</span></td>
              <td><button className="btn btn-primary btn-sm">Review</button></td>
            </tr>); })}
        </tbody>
      </table>{!rows.length && <div className="empty">No applications here.</div>}</div>
    </>
  );
}

function ApplicationDetail({ token, id, go, flash, refreshStats, openImage }) {
  const res = useFetch(token, `/api/admin/applications/${id}`);
  const [identityOk, setIdentityOk] = useState(false);
  const [skillOk, setSkillOk] = useState(false);
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (res.data) setNote(res.data.application.adminNote || ""); }, [res.data && res.data.application.id]);
  const w = wait(res); if (w) return w;
  const a = res.data.application;
  const pending = a.status === "PENDING";
  const [stText, stCls] = BUCKET[bucketOf(a)];

  async function decide(status) {
    if (status === "REJECTED" && !note.trim()) return flash("Add a reason in the note so the applicant knows why");
    setBusy(true);
    try {
      await api(`/api/admin/applications/${id}`, { method: "PATCH", token, body: { status, note: note.trim(), skillVerified: skillOk } });
      flash(status === "APPROVED" ? `${a.user.name} approved and now live` : "Application rejected");
      refreshStats(); go("applications");
    } catch (e) { flash(e.message); setBusy(false); }
  }
  async function askInfo() {
    if (!note.trim()) return flash("Write what you need from the applicant in the note");
    setBusy(true);
    try { await api(`/api/admin/applications/${id}/info`, { method: "PATCH", token, body: { note: note.trim() } }); flash("Info request saved"); res.reload(); }
    catch (e) { flash(e.message); }
    setBusy(false);
  }

  return (
    <>
      <button className="back" onClick={() => go("applications")}>← All applications</button>
      <div className="head">
        <div className="who" style={{ gap: 16 }}>
          <Avatar name={a.user.name} size={64} />
          <div><h1>{a.user.name}</h1><p className="head-sub">{tradeLabel(a.trade)} · {a.user.area || "—"} · Applied {fmtDateLong(a.createdAt)} · {shortId(a.id, "APP")}</p></div>
        </div>
        <span className={"pill " + stCls}>{stText}</span>
      </div>
      <div className="two">
        <div className="stack">
          <div className="card">
            <h3>Identity and trade</h3>
            <div className="kv">
              <div><label>Full name</label><b>{a.user.name}</b></div>
              <div><label>Phone</label><b>{a.phone || "—"}</b></div>
              <div><label>Email</label><b>{a.user.email}</b></div>
              <div><label>Trade</label><b>{tradeLabel(a.trade)}</b></div>
              <div><label>Location</label><b>{a.user.area || "—"}</b></div>
              <div><label>Social</label><b>{a.socialHandle || "—"}</b></div>
            </div>
            <div style={{ marginTop: 16 }}><label className="lbl">About their service</label>{a.bio}</div>
          </div>
          <div className="card">
            <h3>Documents</h3>
            <div className="doc"><div className="doc-i" /><div className="doc-t"><b>Government ID</b><small>{a.idDocumentUrl ? "Uploaded " + fmtDate(a.createdAt) : "Not provided"}</small></div>
              {a.idDocumentUrl ? <button className="btn btn-sm" onClick={() => openImage(a.idDocumentUrl)}>Open</button> : <span className="pill p-red">Missing</span>}</div>
          </div>
          <div className="card">
            <h3>Portfolio</h3>
            {a.photos.length ? <div className="ptiles">{a.photos.map((p) => <img key={p.id} src={p.url} onClick={() => openImage(p.url)} />)}</div> : <p className="soft">No work photos uploaded.</p>}
          </div>
        </div>
        <div className="stack">
          <div className="card" style={{ border: "2px solid var(--green)" }}>
            <h3>Decision</h3>
            {pending ? (<>
              <label className="chk"><input type="checkbox" checked={identityOk} onChange={(e) => setIdentityOk(e.target.checked)} />Identity verified</label>
              <label className="chk"><input type="checkbox" checked={skillOk} onChange={(e) => setSkillOk(e.target.checked)} />Skill verified</label>
              <label className="lbl" style={{ marginTop: 12 }}>Internal note / reason</label>
              <textarea className="note" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Required when you reject or ask for more information" />
              <button className="btn btn-primary wide" disabled={busy || !identityOk || !a.idDocumentUrl} onClick={() => decide("APPROVED")}>Approve · make Vetted</button>
              <button className="btn btn-info wide" disabled={busy} onClick={askInfo}>Request more information</button>
              <button className="btn btn-danger wide" disabled={busy} onClick={() => decide("REJECTED")}>Reject application</button>
              <p className="soft" style={{ fontSize: 12.5 }}>Approval needs the ID on file and "Identity verified" ticked. It makes the profile visible to customers.</p>
            </>) : (<>
              <p>This application was <b>{a.status.toLowerCase()}</b>{a.reviewedAt ? ` on ${fmtDateLong(a.reviewedAt)}` : ""}.</p>
              {(a.rejectionReason || a.adminNote) && <p className="soft">Note: {a.rejectionReason || a.adminNote}</p>}
            </>)}
          </div>
          <div className="card">
            <h3>Review history</h3>
            <ul className="hist">
              <li>Application submitted<small>{fmtDateLong(a.createdAt)} · {fmtTime(a.createdAt)}</small></li>
              {a.infoRequestedAt && <li>More information requested<small>{fmtDateLong(a.infoRequestedAt)} · "{a.infoRequestNote}"</small></li>}
              {a.reviewedAt && <li>{a.status === "APPROVED" ? "Approved" : "Rejected"}<small>{fmtDateLong(a.reviewedAt)}</small></li>}
            </ul>
          </div>
        </div>
      </div>
    </>
  );
}

/* ============ artisans ============ */
function Artisans({ token, flash, refreshStats, param, openImage }) {
  const list = useFetch(token, "/api/admin/artisans");
  const [sel, setSel] = useState(param || null);
  const [q, setQ] = useState("");
  const detail = useFetch(token, sel ? `/api/admin/artisans/${sel}/detail` : null);
  const w = wait(list); if (w) return w;
  const all = list.data.artisans;
  const rows = all.filter((a) => match(q, a.user.name, tradeLabel(a.trade), a.area));
  const susp = all.filter((a) => a.suspended).length;
  const changed = () => { list.reload(); detail.reload(); refreshStats(); };
  return (
    <>
      <Head title="Artisans" sub={`${all.length} artisans · ${all.length - susp} active · ${susp} suspended`} right={<SearchBox value={q} onChange={setQ} placeholder="Search by name, trade or location" />} />
      <div className="split">
        <div className="tbl-wrap"><table>
          <thead><tr><th>Artisan</th><th>Trade</th><th>Badges</th><th>Jobs</th><th>Rating</th><th>Status</th></tr></thead>
          <tbody>{rows.map((a) => (
            <tr key={a.id} className={"row" + (sel === a.id ? " sel" : "")} onClick={() => setSel(a.id)}>
              <td><div className="who"><Avatar name={a.user.name} /><div><b>{a.user.name}</b><small>{a.area}</small></div></div></td>
              <td>{tradeLabel(a.trade)}</td><td><Badges a={a} /></td><td>{a.jobsCompleted}</td><td>{Number(a.rating).toFixed(1)}</td>
              <td><span className={"pill " + (a.suspended ? "p-red" : "p-green")}>{a.suspended ? "Suspended" : "Active"}</span></td>
            </tr>))}</tbody>
        </table>{!rows.length && <div className="empty">No artisans match.</div>}</div>
        {sel ? <ArtisanPanel token={token} res={detail} rules={list.data.rules} flash={flash} onChanged={changed} openImage={openImage} />
             : <div className="card empty">Select an artisan to see their record.</div>}
      </div>
    </>
  );
}

function ArtisanPanel({ token, res, rules, flash, onChanged, openImage }) {
  if (!res.data) return <div className="card empty">{res.error || "Loading…"}</div>;
  const { artisan: a, jobs, reviews, reports } = res.data;
  const name = a.user.name;
  async function patch(body, msg) { try { await api(`/api/admin/artisans/${a.id}`, { method: "PATCH", token, body }); flash(msg); onChanged(); } catch (e) { flash(e.message); } }
  function suspend() { const r = window.prompt("Reason for suspending (admins only)"); if (r === null) return; patch({ suspended: true, reason: r.trim() }, `${name} suspended and hidden from customers`); }
  function pro() {
    if (a.isPro) return patch({ isPro: false }, "Pro listing removed");
    const days = window.prompt("Grant Pro listing for how many days?", "30"); if (!days) return;
    const d = new Date(); d.setDate(d.getDate() + Number(days)); patch({ isPro: true, proExpiresAt: d.toISOString() }, "Pro listing granted");
  }
  async function delist() {
    if (!window.confirm(`Permanently delist ${name}? This cannot be undone. Suspending is usually better.`)) return;
    if (window.prompt("Type DELIST to confirm") !== "DELIST") return;
    try { await api(`/api/admin/artisans/${a.id}`, { method: "DELETE", token }); flash(`${name} delisted`); onChanged(); } catch (e) { flash(e.message); }
  }
  async function viewId() { try { const d = await api(`/api/admin/artisans/${a.id}/id-document`, { token }); d.idDocumentUrl ? openImage(d.idDocumentUrl) : flash("No ID on file"); } catch (e) { flash(e.message); } }
  const topLine = a.badge === "TOP_RATED" ? "Earned" : a.jobsCompleted < rules.minJobs ? `Not eligible: ${a.jobsCompleted} of ${rules.minJobs} jobs` : `Not eligible: rating ${Number(a.rating).toFixed(1)} of ${rules.minRating}`;
  return (
    <div className="card" style={{ border: "2px solid var(--green)" }}>
      <div className="panel-top"><Avatar name={name} size={52} /><div><h3>{name}</h3><span className="soft">{tradeLabel(a.trade)} · {a.area} · {a.jobsCompleted} jobs · {Number(a.rating).toFixed(1)} ★</span></div></div>
      {a.suspended && <div className="panel-warn">Suspended {a.suspendedAt ? fmtDate(a.suspendedAt) : ""}{a.suspendedReason ? ` · ${a.suspendedReason}` : ""}. Hidden from customers.</div>}
      <div className="stack">
        {a.suspended ? <button className="btn btn-primary wide" onClick={() => patch({ suspended: false }, `${name} reactivated`)}>Reactivate artisan</button>
                     : <button className="btn btn-danger wide" onClick={suspend}>Suspend artisan</button>}
        <button className="btn wide" onClick={() => patch({ skillVerified: !a.skillVerified }, a.skillVerified ? "Skill Verified removed" : "Skill Verified granted")}>{a.skillVerified ? "Revoke Skill Verified" : "Grant Skill Verified"}</button>
        <button className="btn wide" onClick={viewId}>View ID document</button>
        <button className="btn btn-danger wide" onClick={delist}>Delist permanently</button>
      </div>
      <div className="counts"><div className="count"><b>{jobs.length}</b><span>Jobs</span></div><div className="count"><b>{reviews.length}</b><span>Reviews</span></div><div className="count"><b>{reports.length}</b><span>Reports</span></div></div>
      <div className="h4">Verification</div>
      <div className="vrow"><span>Vetted (identity)</span><b className="good">Verified</b></div>
      <div className="vrow"><span>Skill Verified</span><b className={a.skillVerified ? "good" : "soft"}>{a.skillVerified ? "Verified" : "Not verified"}</b></div>
      <div className="vrow"><span>Top Rated</span><b className={a.badge === "TOP_RATED" ? "good" : "soft"}>{topLine}</b></div>

}

/* ============ requests / jobs ============ */
function Requests({ token }) {
  const res = useFetch(token, "/api/admin/requests");
  const [chip, setChip] = useState("all"); const [q, setQ] = useState("");
  const w = wait(res); if (w) return w;
  const all = res.data.requests;
  const lab = (r) => (REQ_STATUS[r.status] || [r.status])[0];
  const n = (l) => all.filter((r) => lab(r) === l).length;
  const rows = all.filter((r) => (chip === "all" || lab(r) === chip) && match(q, shortId(r.id), r.student.name, tradeLabel(r.artisanProfile.trade), r.artisanProfile.user.name));
  return (
    <>
      <Head title="Service requests" sub="Monitor every request from first message to completion" right={<SearchBox value={q} onChange={setQ} placeholder="Search request ID, customer or service" />} />
      <Chips value={chip} onChange={setChip} items={[["all", "All", all.length], ...["Pending", "Accepted", "In Progress", "Completed", "Cancelled"].map((l) => [l, l, n(l)])]} />
      <div className="tbl-wrap"><table>
        <thead><tr><th>Request</th><th>Customer</th><th>Service</th><th>Location</th><th>Selected artisan</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>{rows.map((r) => (
          <tr key={r.id}><td><b className="good">{shortId(r.id)}</b></td><td>{r.student.name}</td><td>{tradeLabel(r.artisanProfile.trade)}</td><td>{r.student.area || "—"}</td><td><b>{r.artisanProfile.user.name}</b></td><td><ReqPill status={r.status} /></td><td>{relDay(r.createdAt)}</td></tr>))}</tbody>
      </table>{!rows.length && <div className="empty">No requests here.</div>}</div>
      <p className="soft" style={{ marginTop: 10 }}>Showing {rows.length} of {all.length} · most recently updated first</p>
    </>
  );
}

function health(r) {
  const h = (Date.now() - new Date(r.updatedAt).getTime()) / 36e5;
  if ((r.status === "ACCEPTED" && h > 24) || (r.status === "CONFIRMED" && h > 72)) return ["Needs attention", "p-amber"];
  return ["On track", "p-green"];
}
function ActiveJobs({ token }) {
  const res = useFetch(token, "/api/admin/requests");
  const [q, setQ] = useState("");
  const w = wait(res); if (w) return w;
  const jobs = res.data.requests.filter((r) => r.status === "ACCEPTED" || r.status === "CONFIRMED");
  const prog = jobs.filter((r) => r.status === "CONFIRMED").length;
  const attn = jobs.filter((r) => health(r)[0] === "Needs attention").length;
  const rows = jobs.filter((r) => match(q, shortId(r.id), r.student.name, r.artisanProfile.user.name, tradeLabel(r.artisanProfile.trade)));
  const Card = ({ l, n, s, tone }) => <div className={"stat" + (tone ? " " + tone : "")}><div className="stat-l">{l}</div><div className="stat-n">{n}</div><div className="stat-s">{s}</div></div>;
  return (
    <>
      <Head title="Active jobs" sub="Jobs accepted or in progress right now" right={<SearchBox value={q} onChange={setQ} placeholder="Search job, artisan or customer" />} />
      <div className="stats">
        <Card l="Active jobs" n={jobs.length} s="Accepted or in progress" />
        <Card l="In progress" n={prog} s="Booking confirmed" />
        <Card l="Accepted, not started" n={jobs.length - prog} s="Waiting for the customer" />
        <Card l="Needs attention" n={attn} s="No movement for too long" tone="amber" />
      </div>
      <div className="tbl-wrap"><table>
        <thead><tr><th>Job</th><th>Service</th><th>Artisan</th><th>Customer</th><th>Progress</th><th>Last update</th><th>Health</th></tr></thead>
        <tbody>{rows.map((r) => { const step = r.status === "CONFIRMED" ? 3 : 2; const [ht, hc] = health(r); return (
          <tr key={r.id}><td><b className="good">{shortId(r.id)}</b></td><td>{tradeLabel(r.artisanProfile.trade)}</td><td>{r.artisanProfile.user.name}</td><td>{r.student.name}</td>
            <td><div className="prog"><small><span>{step === 3 ? "In progress" : "Accepted"}</span><span>{step} of 4</span></small><i><b style={{ width: (step / 4) * 100 + "%" }} /></i></div></td>
            <td>{ago(r.updatedAt)}</td><td><span className={"pill " + hc}>{ht}</span></td></tr>); })}</tbody>
      </table>{!rows.length && <div className="empty">No active jobs right now.</div>}</div>
      <div className="callout"><b>Health:</b> "Needs attention" means a job was accepted but not booked for over 24 hours, or has been in progress for over 3 days without an update.</div>
    </>
  );
}

function Completed({ token, statsRes }) {
  const res = useFetch(token, "/api/admin/requests?status=COMPLETED");
  const reps = useFetch(token, "/api/admin/reports");
  const [q, setQ] = useState("");
  const w = wait(res); if (w) return w;
  const done = res.data.requests;
  const s = statsRes.data ? statsRes.data.stats : null;
  const now = Date.now(), wk = 7 * 864e5;
  const thisWk = done.filter((r) => now - new Date(r.updatedAt).getTime() < wk).length;
  const lastWk = done.filter((r) => { const d = now - new Date(r.updatedAt).getTime(); return d >= wk && d < 2 * wk; }).length;
  const rated = done.filter((r) => r.rating);
  const avg = rated.length ? (rated.reduce((a, r) => a + r.rating, 0) / rated.length).toFixed(1) : "—";
  const rate = s && s.completedJobs + s.cancelledJobs ? Math.round((s.completedJobs / (s.completedJobs + s.cancelledJobs)) * 100) + "%" : "—";
  const disputed = new Set(reps.data ? reps.data.reports.filter((r) => r.status === "NEW" || r.status === "INVESTIGATING").map((r) => r.requestId) : []);
  const rows = done.filter((r) => match(q, shortId(r.id), r.student.name, r.artisanProfile.user.name, tradeLabel(r.artisanProfile.trade)));
  const Card = ({ l, n, sub }) => <div className="stat"><div className="stat-l">{l}</div><div className="stat-n">{n}</div><div className="stat-s">{sub}</div></div>;
  return (
    <>
      <Head title="Completed jobs" sub="Jobs confirmed by the customer. These feed every artisan's track record."
        right={<button className="btn" onClick={() => downloadCsv([["Job", "Service", "Artisan", "Customer", "Completed", "Rating"], ...rows.map((r) => [shortId(r.id), tradeLabel(r.artisanProfile.trade), r.artisanProfile.user.name, r.student.name, fmtDateLong(r.updatedAt), r.rating || ""])], "completed-jobs.csv")}>Export CSV</button>} />
      <div className="stats">
        <Card l="Completed (latest 300)" n={done.length} sub={s ? `${s.completedJobs} all time` : ""} />
        <Card l="This week" n={thisWk} sub={`${lastWk} last week`} />
        <Card l="Average rating" n={avg} sub={`From ${plural(rated.length, "review")}`} />
        <Card l="Completion rate" n={rate} sub="Completed vs cancelled" />
      </div>
      <div style={{ marginBottom: 16 }}><SearchBox value={q} onChange={setQ} placeholder="Search job, artisan or customer" /></div>
      <div className="tbl-wrap"><table>
        <thead><tr><th>Job</th><th>Service</th><th>Artisan</th><th>Customer</th><th>Completed</th><th>Rating</th><th>Track record</th></tr></thead>
        <tbody>{rows.map((r) => (
          <tr key={r.id}><td><b className="good">{shortId(r.id)}</b></td><td>{tradeLabel(r.artisanProfile.trade)}</td><td>{r.artisanProfile.user.name}</td><td>{r.student.name}</td><td>{fmtDate(r.updatedAt)}</td><td><b>{r.rating ? Number(r.rating).toFixed(1) : "Not rated"}</b></td>
            <td><span className={"pill " + (disputed.has(r.id) ? "p-red" : r.rating ? "p-green" : "p-amber")}>{disputed.has(r.id) ? "Disputed" : r.rating ? "Counted" : "Awaiting review"}</span></td></tr>))}</tbody>
      </table>{!rows.length && <div className="empty">No completed jobs yet.</div>}</div>
    </>
  );
}

/* ============ reviews ============ */
function Reviews({ token, flash, refreshStats }) {
  const res = useFetch(token, "/api/admin/reviews");
  const [chip, setChip] = useState("all");
  const w = wait(res); if (w) return w;
  const all = res.data.reviews;
  const n = (s) => all.filter((r) => r.reviewStatus === s).length;
  const rows = all.filter((r) => chip === "all" ? r.reviewStatus !== "REMOVED" : r.reviewStatus === chip);
  async function set(r, status) {
    let reason; if (status === "FLAGGED") { reason = window.prompt("Why flag this review?"); if (reason === null) return; }
    try { await api(`/api/admin/reviews/${r.id}`, { method: "PATCH", token, body: { status, reason } }); flash("Review updated"); res.reload(); refreshStats(); } catch (e) { flash(e.message); }
  }
  const tone = { PUBLISHED: ["Published", "p-green"], FLAGGED: ["Flagged", "p-amber"], REMOVED: ["Removed", "p-red"] };
  return (
    <>
      <Head title="Reviews" sub="Reviews exist only for completed jobs. Admins moderate, they never edit." />
      <Chips value={chip} onChange={setChip} items={[["all", "All", all.length - n("REMOVED")], ["FLAGGED", "Flagged", n("FLAGGED")], ["REMOVED", "Removed", n("REMOVED")]]} />
      {rows.map((r) => { const [t, c] = tone[r.reviewStatus]; return (
        <div className="revcard" key={r.id}>
          <div className="revhead">
            <div className="who"><Avatar name={r.student.name} /><div><b>{firstLast(r.student.name)} reviewed {r.artisanProfile.user.name}</b><small className="soft">{tradeLabel(r.artisanProfile.trade)} · {shortId(r.id)} · {fmtDate(r.updatedAt)}</small></div></div>
            <div><b style={{ color: "#8A5A12" }}>{r.rating}.0 ★</b> <span className={"pill " + c}>{t}</span></div>
          </div>
          <div className="revtext">{r.reviewText || <span className="soft">No written review.</span>}</div>
          <div className="revact">
            {r.reviewFlagReason && <span className="revwhy">{r.reviewFlagReason}. Hidden from customers until you decide.</span>}
            {r.reviewStatus === "PUBLISHED" && <><button className="btn btn-sm" onClick={() => set(r, "FLAGGED")}>Flag</button><button className="btn btn-sm btn-danger" onClick={() => set(r, "REMOVED")}>Remove review</button></>}
            {r.reviewStatus === "FLAGGED" && <><button className="btn btn-sm" onClick={() => set(r, "PUBLISHED")}>Keep published</button><button className="btn btn-sm btn-danger" onClick={() => set(r, "REMOVED")}>Remove review</button></>}
            {r.reviewStatus === "REMOVED" && <button className="btn btn-sm" onClick={() => set(r, "PUBLISHED")}>Restore</button>}
          </div>
        </div>); })}
      {!rows.length && <div className="empty">Nothing here.</div>}
    </>
  );
}

/* ============ reports ============ */
const reasonTone = (r) => /fraud|show up/i.test(r) ? "p-red" : /unavailable/i.test(r) ? "p-blue" : /poor/i.test(r) ? "p-amber" : "p-grey";
const REP_WORD = { NEW: "New", INVESTIGATING: "Investigating", RESOLVED: "Resolved", DISMISSED: "Dismissed" };

function Reports({ token, flash, refreshStats }) {
  const list = useFetch(token, "/api/admin/reports");
  const [sel, setSel] = useState(null); const [chip, setChip] = useState("open");
  const reports = list.data ? list.data.reports : [];
  const open = reports.filter((r) => r.status === "NEW" || r.status === "INVESTIGATING");
  const rows = chip === "open" ? open : reports;
  useEffect(() => { if (!sel && rows.length) setSel(rows[0].id); }, [list.data]);
  const w = wait(list); if (w) return w;
  const changed = () => { list.reload(); refreshStats(); };
  return (
    <>
      <Head title="Reports and complaints" sub={`${open.length} open · customers and artisans can both report`} />
      <Chips value={chip} onChange={setChip} items={[["open", "Open", open.length], ["all", "All", reports.length]]} />
      <div className="split rep">
        <div className="rep-list">
          {rows.map((r) => (
            <button key={r.id} className={"rep-item" + (sel === r.id ? " on" : "")} onClick={() => setSel(r.id)}>
              <div className="rep-top"><span className={"pill " + reasonTone(r.reason)}>{r.reason}</span><span className="soft">{ago(r.createdAt)}</span></div>
              <div className="rep-t">{r.reportedName}, {r.reportedRole === "artisan" ? tradeLabel(r.trade) : "Customer"} · {shortId(r.requestId)}</div>
              <div className="rep-b"><span className="soft">Reported by {r.reporterRole} {r.reporterName}</span><span className={"s-" + r.status.toLowerCase()}>{REP_WORD[r.status]}</span></div>
            </button>))}
          {!rows.length && <div className="card empty">No reports here.</div>}
        </div>
        {sel ? <ReportDetail key={sel} token={token} id={sel} flash={flash} onChanged={changed} /> : <div className="card empty">Select a report.</div>}
      </div>
    </>
  );
}

function ReportDetail({ token, id, flash, onChanged }) {
  const res = useFetch(token, `/api/admin/reports/${id}`);
  if (!res.data) return <div className="card empty">{res.error || "Loading…"}</div>;
  const { report: r, artisan, messages, priorReports, recentReports } = res.data;
  const closed = r.status === "RESOLVED" || r.status === "DISMISSED";
  async function act(status, ask) {
    let note = ""; if (ask) { const v = window.prompt(ask); if (v === null) return; note = v; }
    try { await api(`/api/admin/reports/${id}`, { method: "PATCH", token, body: { status, note } }); flash("Report updated"); res.reload(); onChanged(); } catch (e) { flash(e.message); }
  }
  async function suspend() {
    const reason = window.prompt("Reason for suspending (admins only)", `Report: ${r.reason}`); if (reason === null) return;
    try { await api(`/api/admin/artisans/${artisan.id}`, { method: "PATCH", token, body: { suspended: true, reason: reason.trim() } }); flash(`${artisan.name} suspended`); res.reload(); onChanged(); } catch (e) { flash(e.message); }
  }
  return (
    <div className="card" style={{ border: "2px solid var(--green)" }}>
      <div className="rep-top"><span className={"pill " + reasonTone(r.reason)}>{r.reason}</span><span className={"pill " + (closed ? "p-green" : r.status === "NEW" ? "p-red" : "p-amber")}>{REP_WORD[r.status]}</span></div>
      <h2 style={{ marginTop: 12 }}>Report {shortId(r.id, "RP")} · Request {shortId(r.requestId)}</h2>
      <div className="kv" style={{ marginTop: 14 }}>
        <div><label>Reported by</label><b>{r.reporterName} ({r.reporterRole})</b></div>
        <div><label>Reported</label><b>{r.reportedName} ({r.reportedRole})</b></div>
        <div><label>Request</label><b>{r.job}</b></div>
      </div>
      {r.reportedRole === "artisan" && <div style={{ marginTop: 14 }}><label className="lbl">Artisan record</label><b>{artisan.jobsCompleted} jobs · {Number(artisan.rating).toFixed(1)} ★ · {plural(priorReports, "prior report")}</b></div>}
      <div className="stmt"><b>{r.reporterRole === "artisan" ? "Artisan" : "Customer"} statement:</b> {r.note ? `"${r.note}"` : <span className="soft">No details were added.</span>}</div>
      <div className="h4">Timeline from the request log</div>
      <ul className="tl">
        {messages.map((m) => <li key={m.id}><time>{fmtTime(m.createdAt)}</time><span>{m.senderType === "SYSTEM" ? m.text : `${m.senderType === "CUSTOMER" ? "Customer" : "Artisan"}: "${m.text}"`}</span></li>)}
        <li><time>{fmtTime(r.createdAt)}</time><span><b>Report filed: {r.reason}</b></span></li>
      </ul>
      {r.reportedRole === "artisan" && recentReports > 0 && <div className="callout"><b>Pattern:</b> {artisan.name} has {plural(recentReports, "other report")} in the last 30 days.</div>}
      {r.resolutionNote && <p className="soft" style={{ marginTop: 14 }}>Resolution note: {r.resolutionNote}</p>}
      <div className="acts">
        {!closed && r.status === "NEW" && <button className="btn" onClick={() => act("INVESTIGATING")}>Start investigating</button>}
        {!closed && <button className="btn btn-primary" onClick={() => act("RESOLVED", "Resolution note (optional)")}>Resolve report</button>}
        {!closed && r.reportedRole === "artisan" && !artisan.suspended && <button className="btn btn-danger" onClick={suspend}>Suspend artisan</button>}
        {!closed && <button className="btn" onClick={() => act("DISMISSED", "Why are you dismissing this? (optional)")}>Dismiss</button>}
        {closed && <span className="soft">This report is closed.</span>}
      </div>
    </div>
  );
}

/* ============ verification ============ */
function Verification({ token, flash, go, refreshStats }) {
  const res = useFetch(token, "/api/admin/verification");
  const w = wait(res); if (w) return w;
  const d = res.data;
  const queue = [
    ...d.applications.map((a) => ({ key: "a" + a.id, name: a.user.name, sub: `${tradeLabel(a.trade)} · ${a.user.area || "—"}`, check: "Identity", ev: docsLabel(a), at: a.createdAt, open: () => go("applications", a.id) })),
    ...d.skillQueue.map((a) => ({ key: "s" + a.id, name: a.user.name, sub: `${tradeLabel(a.trade)} · ${a.area}`, check: "Skill", ev: `${plural(a._count.photos, "portfolio photo")}`, at: a.createdAt, open: () => go("artisans", a.id) })),
  ];
  async function recompute() { try { const r = await api("/api/admin/badges/recompute", { method: "POST", token }); flash(r.changed ? `Top Rated updated for ${plural(r.changed, "artisan")}` : "Everyone is already correct"); res.reload(); refreshStats(); } catch (e) { flash(e.message); } }
  const Card = ({ pill, cls, n, text }) => <div className="card"><span className={"pill " + cls}>{pill}</span><div className="stat-n" style={{ marginTop: 10 }}>{n} <small style={{ fontSize: 14, fontWeight: 500 }} className="soft">artisans</small></div><p className="soft" style={{ margin: 0 }}>{text}</p></div>;
  return (
    <>
      <Head title="Verification" sub="Three badges, three different standards. Vetted and Skill Verified are granted by people. Top Rated is earned from the record." />
      <div className="grid2" style={{ gridTemplateColumns: "repeat(3,minmax(0,1fr))", marginBottom: 16 }}>
        <Card pill="Vetted" cls="p-green" n={d.counts.vetted} text="Identity and contact verified at approval. Needed to appear to customers." />
        <Card pill="Skill Verified" cls="p-blue" n={d.counts.skill} text="Trade confirmed through certificates, references or a reviewed portfolio." />
        <Card pill="Top Rated" cls="p-amber" n={d.counts.top} text="Earned from the track record. Never granted by hand." />
      </div>
      <div className="two">
        <div className="tbl-wrap"><table>
          <thead><tr><th>Artisan</th><th>Check</th><th>Evidence</th><th>Waiting</th><th></th></tr></thead>
          <tbody>{queue.map((i) => (
            <tr key={i.key}><td><div className="who"><Avatar name={i.name} /><div><b>{i.name}</b><small>{i.sub}</small></div></div></td><td><span className={"pill " + (i.check === "Identity" ? "p-green" : "p-blue")}>{i.check}</span></td><td>{i.ev}</td><td>{waitLabel(i.at)}</td><td><button className="btn btn-primary btn-sm" onClick={i.open}>Check</button></td></tr>))}</tbody>
        </table>{!queue.length && <div className="empty">Verification queue is clear.</div>}</div>
        <div className="stack">
          <div className="card" style={{ background: "#FCF3DC" }}>
            <h3>Top Rated rules</h3>
            <p className="soft">Calculated by the system. Admins cannot grant the badge by hand.</p>
            <div className="vrow"><span>Completed jobs</span><b>{d.rules.minJobs} or more</b></div>
            <div className="vrow"><span>Average rating</span><b>{d.rules.minRating} or higher</b></div>
            <button className="btn wide" style={{ marginTop: 12 }} onClick={recompute}>Recalculate Top Rated now</button>
          </div>
          <div className="card">
            <h3>Currently suspended</h3>
            {d.suspended.map((s) => <div className="mini" key={s.id}><span className="t"><b>{s.user.name}</b> · {s.suspendedReason || "No reason recorded"}</span><span className="soft">{s.suspendedAt ? fmtDate(s.suspendedAt) : ""}</span></div>)}
            {!d.suspended.length && <p className="soft">Nobody is suspended.</p>}
          </div>
        </div>
      </div>
    </>
  );
}

/* ============ settings (read only) ============ */
function Settings({ statsRes, user }) {
  const rules = statsRes.data ? statsRes.data.rules : null;
  const order = ["Trade match", "Availability", "Distance", "Verification", "Rating", "Jobs completed"];
  return (
    <>
      <Head title="Settings" sub="Rules that shape matching and trust. Read-only for now." />
      <div className="grid2">
        <div className="card"><h3>Matching priority</h3><p className="soft">Order is fixed. Applied when the new request flow ships.</p>{order.map((o, i) => <div className="vrow" key={o}><span>{i + 1}. {o}</span></div>)}<p className="soft" style={{ marginTop: 12 }}>Unavailable and suspended artisans are never matched.</p></div>
        <div className="card"><h3>Top Rated thresholds</h3><p className="soft">An artisan must meet every line. One strong job is never enough.</p>
          <div className="vrow"><span>Completed jobs</span><b>{rules ? rules.minJobs : "—"}</b></div><div className="vrow"><span>Average rating</span><b>{rules ? rules.minRating : "—"}</b></div>
          <p className="soft" style={{ marginTop: 12 }}>Edit these in <code>config/badgeRules.js</code> on the backend.</p></div>
        <div className="card"><h3>Service categories</h3><div className="badges" style={{ marginTop: 10 }}>{["ELECTRICIAN", "PLUMBER", "TAILOR", "PHONE_REPAIR"].map((t) => <span key={t} className="pill p-grey">{tradeLabel(t)}</span>)}</div><p className="soft" style={{ marginTop: 12 }}>Service area: Ado-Ekiti and environs.</p></div>
        <div className="card"><h3>Product scope</h3><div className="vrow"><span>Payments</span><b className="soft">Out of scope for the MVP</b></div><div className="vrow"><span>Voice notes</span><b className="soft">Not yet</b></div><div className="vrow"><span>Signed in as</span><b>{user.email}</b></div></div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

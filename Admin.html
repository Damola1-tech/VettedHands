<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VettedHands Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const API_BASE = "https://vettedhands-backend.onrender.com";

async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}

/* ============ ICONS ============ */
const ICON_PATHS = {
  shieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></>,
  checkCircle2: <><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>,
  xCircle: <><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>,
  clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
  activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>,
  star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
  mapPin: <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>,
  alertTriangle: <><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
  arrowLeft: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
  logOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
};
function Icon({ name, size = 18, color, strokeWidth = 2, fill = "none", stroke = "currentColor", style, ...rest }) {
  const shape = ICON_PATHS[name];
  if (!shape) return null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill={fill} stroke={color || stroke} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }} {...rest}>{shape}</svg>
  );
}
const ShieldCheck = (p) => <Icon name="shieldCheck" {...p} />;
const CheckCircle2 = (p) => <Icon name="checkCircle2" {...p} />;
const XCircle = (p) => <Icon name="xCircle" {...p} />;
const Clock = (p) => <Icon name="clock" {...p} />;
const Activity = (p) => <Icon name="activity" {...p} />;
const Star = (p) => <Icon name="star" {...p} />;
const MapPin = (p) => <Icon name="mapPin" {...p} />;
const AlertTriangle = (p) => <Icon name="alertTriangle" {...p} />;
const ArrowLeft = (p) => <Icon name="arrowLeft" {...p} />;
const LogOut = (p) => <Icon name="logOut" {...p} />;

function initials(name = "") { return name.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase(); }
function tradeLabel(t) { return { ELECTRICIAN: "Electrician", PLUMBER: "Plumber", TAILOR: "Tailor", PHONE_REPAIR: "Phone Repair" }[t] || t; }

/* ============ LOGIN ============ */
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setErr(null); setBusy(true);
    try { await onLogin(email.trim(), password); }
    catch (ex) { setErr(ex.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="phone">
      <div className="content" style={{ alignItems: "center", justifyContent: "center", display: "flex", padding: 24 }}>
        <form onSubmit={submit} style={{ width: "100%", maxWidth: 300, display: "flex", flexDirection: "column", gap: 14 }}>
          <div className="brand" style={{ justifyContent: "center", marginBottom: 6 }}>
            <span className="brand-mark"><ShieldCheck size={16} /></span><span className="brand-name">VettedHands</span><span className="brand-sub">Admin</span>
          </div>
          <label style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-soft)" }}>Admin email
            <input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="badge-select" style={{ width: "100%", marginTop: 6 }} />
          </label>
          <label style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-soft)" }}>Password
            <input required type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="badge-select" style={{ width: "100%", marginTop: 6 }} />
          </label>
          {err && <div className="modal-note" style={{ color: "var(--danger)" }}>{err}</div>}
          <button className="approve-btn" disabled={busy} style={{ justifyContent: "center" }}>{busy ? "Please wait…" : "Log in"}</button>
        </form>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [token, setToken] = useState(() => localStorage.getItem("vh_admin_token") || null);
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(!!token);

  useEffect(() => {
    if (!token) { setChecking(false); return; }
    api("/api/auth/me", { token })
      .then((d) => {
        if (d.user.role !== "ADMIN") throw new Error("Not an admin account");
        setUser(d.user);
      })
      .catch(() => { localStorage.removeItem("vh_admin_token"); setToken(null); })
      .finally(() => setChecking(false));
  }, [token]);

  async function login(email, password) {
    const d = await api("/api/auth/login", { method: "POST", body: { email, password } });
    if (d.user.role !== "ADMIN") throw new Error("This account isn't an admin");
    localStorage.setItem("vh_admin_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  function logout() { localStorage.removeItem("vh_admin_token"); setToken(null); setUser(null); }

  return (
    <div className="app">
      <Style />
      {checking ? (
        <div className="phone"><div className="content" style={{ alignItems: "center", justifyContent: "center", display: "flex" }}>Loading…</div></div>
      ) : !token || !user ? (
        <LoginScreen onLogin={login} />
      ) : (
        <Dashboard token={token} user={user} onLogout={logout} />
      )}
    </div>
  );
}

function Dashboard({ token, user, onLogout }) {
  const [tab, setTab] = useState("pending");
  const [pending, setPending] = useState([]);
  const [active, setActive] = useState([]);
  const [activity, setActivity] = useState([]);
  const [selectedApp, setSelectedApp] = useState(null);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);

  function flash(msg) { setToast(msg); setTimeout(() => setToast(null), 2200); }
  function fail(e) { flash(e.message || "Something went wrong"); }

  async function loadAll() {
    setLoading(true);
    try {
      const [pendingRes, artisansRes, activityRes] = await Promise.all([
        api("/api/admin/applications?status=pending", { token }),
        api("/api/artisans", {}),
        api("/api/admin/activity", { token }),
      ]);
      setPending(pendingRes.applications);
      setActive(artisansRes.artisans);
      setActivity(activityRes.activity);
    } catch (e) { fail(e); }
    finally { setLoading(false); }
  }
  useEffect(() => { loadAll(); }, []);

  async function approve(app) {
    try {
      await api(`/api/admin/applications/${app.id}`, { method: "PATCH", token, body: { status: "APPROVED" } });
      setPending((p) => p.filter((x) => x.id !== app.id));
      setSelectedApp(null);
      flash(`${app.user.name} approved and now live`);
      loadAll();
    } catch (e) { fail(e); }
  }
  async function reject(app) {
    try {
      await api(`/api/admin/applications/${app.id}`, { method: "PATCH", token, body: { status: "REJECTED" } });
      setPending((p) => p.filter((x) => x.id !== app.id));
      setSelectedApp(null);
      flash(`${app.user.name}'s application rejected`);
    } catch (e) { fail(e); }
  }
  async function setBadge(id, badge) {
    try {
      await api(`/api/admin/artisans/${id}`, { method: "PATCH", token, body: { badge } });
      setActive((a) => a.map((x) => (x.id === id ? { ...x, badge } : x)));
      flash("Badge updated");
    } catch (e) { fail(e); }
  }
  async function delist(id) {
    try {
      const target = active.find((x) => x.id === id);
      await api(`/api/admin/artisans/${id}`, { method: "DELETE", token });
      setActive((a) => a.filter((x) => x.id !== id));
      flash(`${target.user.name} delisted`);
    } catch (e) { fail(e); }
  }

  const flaggedCount = active.filter((a) => a.flagged).length;

  return (
    <div className="phone">
      <div className="content">
        <div className="topbar">
          <div className="brand"><span className="brand-mark"><ShieldCheck size={16} /></span><span className="brand-name">VettedHands</span><span className="brand-sub">Admin</span></div>
          <button className="iconbtn" onClick={onLogout} title="Log out"><LogOut size={16} /></button>
        </div>

        {loading ? (
          <div className="empty"><div className="empty-title">Loading…</div></div>
        ) : (
          <>
            <div className="stats-grid">
              <div className="stat-box"><div className="stat-num">{pending.length}</div><div className="stat-label">Pending</div></div>
              <div className="stat-box"><div className="stat-num">{active.length}</div><div className="stat-label">Active</div></div>
              <div className="stat-box"><div className="stat-num">{activity.length}</div><div className="stat-label">Events</div></div>
              <div className="stat-box stat-box--warn"><div className="stat-num">{flaggedCount}</div><div className="stat-label">Flagged</div></div>
            </div>

            <div className="tabs">
              <button className={"tab" + (tab === "pending" ? " tab--active" : "")} onClick={() => setTab("pending")}>Pending {pending.length > 0 && <span className="tab-count">{pending.length}</span>}</button>
              <button className={"tab" + (tab === "active" ? " tab--active" : "")} onClick={() => setTab("active")}>Active</button>
              <button className={"tab" + (tab === "activity" ? " tab--active" : "")} onClick={() => setTab("activity")}>Activity</button>
            </div>

            {tab === "pending" && (
              <div className="feed feed--scroll">
                {pending.length === 0 && <div className="empty"><div className="empty-title">Nothing waiting</div><div className="empty-sub">All applications have been reviewed.</div></div>}
                {pending.map((app) => (
                  <button key={app.id} className="app-card" onClick={() => setSelectedApp(app)}>
                    <div className="app-top">
                      <div className="avatar">{initials(app.user.name)}</div>
                      <div className="app-top-text">
                        <div className="app-name">{app.user.name}</div>
                        <div className="app-trade"><MapPin size={11} /> {tradeLabel(app.trade)} · {app.user.area || "—"}</div>
                      </div>
                    </div>
                    <div className="app-bio">{app.bio}</div>
                  </button>
                ))}
              </div>
            )}

            {tab === "active" && (
              <div className="feed feed--scroll">
                {active.map((a) => (
                  <div key={a.id} className={"artisan-row" + (a.flagged ? " artisan-row--flagged" : "")}>
                    <div className="app-top">
                      <div className="avatar">{initials(a.user.name)}</div>
                      <div className="app-top-text">
                        <div className="app-name">{a.user.name} {a.flagged && <AlertTriangle size={12} className="flag-icon" />}</div>
                        <div className="app-trade"><MapPin size={11} /> {tradeLabel(a.trade)} · {a.area}</div>
                      </div>
                    </div>
                    <div className="artisan-meta">
                      <span><Star size={12} fill="#B5651D" stroke="none" /> {Number(a.rating).toFixed(1)}</span>
                      <span className="dot-sep">·</span>
                      <span>{a.jobsCompleted} jobs</span>
                    </div>
                    <div className="artisan-actions">
                      <select value={a.badge} onChange={(e) => setBadge(a.id, e.target.value)} className="badge-select">
                        <option value="VETTED">Vetted</option>
                        <option value="TOP_RATED">Top Rated</option>
                      </select>
                      <button className="delist-btn" onClick={() => delist(a.id)}>Delist</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {tab === "activity" && (
              <div className="feed feed--scroll">
                {activity.map((f) => (
                  <div key={f.id} className="activity-wrap">
                    <div className="activity-row"><Activity size={13} /><span>{f.text}</span></div>
                    <span className="activity-time">{new Date(f.time).toLocaleString()}</span>
                  </div>
                ))}
                {activity.length === 0 && <div className="empty"><div className="empty-title">No activity yet</div></div>}
              </div>
            )}
          </>
        )}
      </div>

      {selectedApp && (
        <div className="modal-backdrop" onClick={() => setSelectedApp(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-back" onClick={() => setSelectedApp(null)}><ArrowLeft size={16} /> Back</button>
            <div className="modal-top">
              <div className="avatar avatar--lg">{initials(selectedApp.user.name)}</div>
              <div>
                <div className="modal-name">{selectedApp.user.name}</div>
                <div className="app-trade"><MapPin size={12} /> {tradeLabel(selectedApp.trade)} · {selectedApp.user.area || "—"}</div>
              </div>
            </div>
            <p className="modal-bio">{selectedApp.bio}</p>
            <div className="modal-note"><AlertTriangle size={13} /> Vetting checklist (manual, off-app for now): confirm identity, call a listed reference, review sample work in person before approving.</div>
            <div className="modal-actions">
              <button className="reject-btn" onClick={() => reject(selectedApp)}><XCircle size={15} /> Reject</button>
              <button className="approve-btn" onClick={() => approve(selectedApp)}><CheckCircle2 size={15} /> Approve &amp; list</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function Style() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
      :root { --bg:#F4F1EA; --surface:#FFFFFF; --ink:#1E1B16; --ink-soft:#6B6357; --line:#E1DACB; --primary:#1F3A34; --accent:#B5651D; --accent-bg:#F0DFC8; --success:#2E7D4F; --danger:#A8402D; }
      * { box-sizing:border-box; }
      body { margin:0; }
      .app { min-height:100vh; background:#EDE7D8; display:flex; justify-content:center; padding:24px 12px; font-family:'Inter',sans-serif; color:var(--ink); }
      .phone { width:100%; max-width:420px; min-height:760px; background:var(--bg); border-radius:22px; box-shadow:0 1px 0 rgba(30,27,22,0.06),0 20px 40px -24px rgba(30,27,22,0.4); overflow:hidden; border:1px solid var(--line); display:flex; flex-direction:column; position:relative; }
      .content { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
      .topbar { padding:18px 16px 4px; display:flex; align-items:center; justify-content:space-between; }
      .brand { display:flex; align-items:center; gap:7px; }
      .brand-mark { width:24px; height:24px; border-radius:7px; background:var(--primary); color:var(--accent-bg); display:flex; align-items:center; justify-content:center; }
      .brand-name { font-family:'Fraunces',serif; font-weight:700; font-size:16.5px; color:var(--primary); }
      .brand-sub { font-size:11px; font-weight:600; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); padding:2px 8px; border-radius:8px; margin-left:2px; }
      .iconbtn { width:32px; height:32px; border-radius:9px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); }
      .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px 16px 0; }
      .stat-box { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; }
      .stat-box--warn { border-color:#E7C9BE; }
      .stat-num { font-family:'Fraunces',serif; font-weight:700; font-size:18px; color:var(--primary); }
      .stat-label { font-size:9.5px; color:var(--ink-soft); margin-top:1px; }
      .tabs { display:flex; gap:6px; margin:14px 16px 0; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px; }
      .tab { flex:1; border:none; background:transparent; padding:9px 4px; border-radius:8px; font-weight:700; font-size:12px; color:var(--ink-soft); cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:5px; }
      .tab--active { background:var(--primary); color:#fff; }
      .tab-count { background:var(--accent); color:#fff; font-size:9px; font-weight:700; padding:1px 6px; border-radius:8px; }
      .feed--scroll { padding:14px 16px 24px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px; }
      .empty { padding:40px 20px; text-align:center; }
      .empty-title { font-weight:700; font-size:14px; margin-bottom:4px; }
      .empty-sub { font-size:12.5px; color:var(--ink-soft); }
      .app-card { text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; font-family:inherit; }
      .app-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
      .app-top-text { flex:1; min-width:0; }
      .avatar { width:38px; height:38px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Fraunces',serif; flex-shrink:0; }
      .avatar--lg { width:54px; height:54px; font-size:18px; }
      .app-name { font-weight:700; font-size:14px; display:flex; align-items:center; gap:5px; }
      .app-trade { font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; margin-top:2px; }
      .app-bio { font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:8px; }
      .artisan-row { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; }
      .artisan-row--flagged { border-color:#E7C9BE; background:#FBF3EF; }
      .flag-icon { color:var(--danger); }
      .artisan-meta { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); margin-top:4px; margin-left:48px; }
      .dot-sep { color:var(--line); }
      .artisan-actions { display:flex; gap:8px; margin-top:10px; }
      .badge-select { flex:1; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12.5px; font-family:inherit; background:var(--bg); }
      .delist-btn { background:none; border:1px solid #E7C9BE; color:var(--danger); border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
      .activity-wrap { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:11px 4px; border-bottom:1px solid var(--line); }
      .activity-row { display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--ink); flex:1; }
      .activity-row svg { color:var(--accent); flex-shrink:0; margin-top:2px; }
      .activity-time { font-size:11px; color:var(--ink-soft); flex-shrink:0; white-space:nowrap; }
      .modal-backdrop { position:absolute; inset:0; background:rgba(30,27,22,0.45); display:flex; align-items:flex-end; z-index:20; }
      .modal { background:var(--surface); border-radius:20px 20px 0 0; padding:20px; width:100%; max-height:85%; overflow-y:auto; }
      .modal-back { background:none; border:none; display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:inherit; padding:0; margin-bottom:12px; }
      .modal-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
      .modal-name { font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
      .modal-bio { font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 14px; }
      .modal-note { font-size:11.5px; color:var(--ink-soft); background:var(--bg); border-radius:10px; padding:10px 12px; display:flex; gap:7px; line-height:1.5; margin-bottom:16px; }
      .modal-actions { display:flex; gap:10px; }
      .reject-btn, .approve-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; padding:12px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; border:none; }
      .reject-btn { background:#F3E1DC; color:var(--danger); }
      .approve-btn { background:var(--primary); color:#fff; }
      .toast { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#F6F1E4; padding:10px 18px; border-radius:20px; font-size:12.5px; font-weight:600; box-shadow:0 10px 24px -10px rgba(0,0,0,0.5); z-index:30; }

      @media (min-width: 760px) {
        .app { padding: 40px 24px; align-items: flex-start; }
        .phone { max-width: 900px; min-height: 680px; border-radius: 20px; }
        .topbar, .stats-grid, .tabs, .feed--scroll { max-width: 760px; margin-left: auto; margin-right: auto; width: 100%; }
        .tabs { max-width: 380px; }
        .feed--scroll { display: block; column-count: 2; column-gap: 14px; padding-bottom: 24px; }
        .feed--scroll > * { break-inside: avoid; margin-bottom: 10px; }
        .modal-backdrop { align-items: center; justify-content: center; }
        .modal { border-radius: 20px; max-width: 480px; max-height: 80vh; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.35); }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

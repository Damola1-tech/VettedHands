const API_BASE = "https://vettedhands-backend.onrender.com";

/* ============ API HELPER ============ */
// Talks to the real backend. Throws an Error with a readable message on failure.
async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    throw new Error((data && data.error) || `Request failed (${res.status})`);
  }
  return data;
}

function Icon({ name, size = 18, color, strokeWidth = 2, fill = "none", stroke = "currentColor", style, ...rest }) {
  const shape = ICON_PATHS[name];
  if (!shape) return null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill={fill} stroke={color || stroke} strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }} {...rest}>
      {shape}
    </svg>
  );
}

const trades = [
  { id: "ELECTRICIAN", label: "Electrician", icon: Zap },
  { id: "PLUMBER", label: "Plumber", icon: Droplet },
  { id: "TAILOR", label: "Tailor", icon: Scissors },
  { id: "PHONE_REPAIR", label: "Phone Repair", icon: Smartphone },
];
const areas = ["All areas", "Main Gate", "Fanuyi", "Odo-Ado", "Ureju"];
const reportReasons = ["Didn't show up", "Poor quality of work", "Overcharged", "Unprofessional conduct", "Other"];

function initials(name = "") { return name.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase(); }
function colorFor(id = "") { const palette = ["#1F3A34", "#B5651D", "#2E534B"]; let h = 0; for (const c of id) h += c.charCodeAt(0); return palette[h % palette.length]; }
function tradeLabel(t) { const found = trades.find((x) => x.id === t); return found ? found.label : t; }
function fmtStars(n) { return Number(n || 0).toFixed(1); }

/* ============ AUTH ============ */
function useAuth() {
  const [token, setToken] = useState(() => localStorage.getItem("vh_token") || null);
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(!!token);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!token) { setLoading(false); return; }
    api("/api/auth/me", { token })
      .then((d) => setUser(d.user))
      .catch(() => { localStorage.removeItem("vh_token"); setToken(null); })
      .finally(() => setLoading(false));
  }, [token]);

  async function login(email, password) {
    setError(null);
    const d = await api("/api/auth/login", { method: "POST", body: { email, password } });
    localStorage.setItem("vh_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  async function register(name, email, password, area) {
    setError(null);
    const d = await api("/api/auth/register", { method: "POST", body: { name, email, password, area } });
    localStorage.setItem("vh_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  function logout() {
    localStorage.removeItem("vh_token");
    setToken(null);
    setUser(null);
  }
  return { token, user, setUser, loading, error, login, register, logout };
}

function AuthScreen({ onLogin, onRegister }) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [area, setArea] = useState(areas[1]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setErr(null); setBusy(true);
    try {
      if (mode === "login") await onLogin(email.trim(), password);
      else await onRegister(name.trim(), email.trim(), password, area);
    } catch (ex) {
      setErr(ex.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="screen screen--center">
      <Style />
      <div className="brand-mark" style={{ width: 44, height: 44, borderRadius: 12, marginBottom: 14 }}><CheckCircle2 size={22} /></div>
      <div className="sent-title">{mode === "login" ? "Log in to VettedHands" : "Create your account"}</div>
      <form className="form" style={{ width: "100%", maxWidth: 320 }} onSubmit={submit}>
        {mode === "register" && (
          <label>Full name<input required value={name} onChange={(e) => setName(e.target.value)} className="text-input" placeholder="Your name" /></label>
        )}
        <label>Email<input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="text-input" placeholder="you@example.com" /></label>
        <label>Password<input required type="password" minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} className="text-input" placeholder="At least 6 characters" /></label>
        {mode === "register" && (
          <label>Area<select value={area} onChange={(e) => setArea(e.target.value)}>{areas.filter((a) => a !== "All areas").map((a) => <option key={a}>{a}</option>)}</select></label>
        )}
        {err && <div className="info-note" style={{ background: "#F3E1DC", color: "#A8402D" }}>{err}</div>}
        <button className="primary-btn" style={{ margin: 0 }} disabled={busy}>{busy ? "Please wait…" : mode === "login" ? "Log in" : "Create account"}</button>
      </form>
      <button className="browse-link" onClick={() => setMode(mode === "login" ? "register" : "login")}>
        {mode === "login" ? "New here? Create an account" : "Already have an account? Log in"}
      </button>
      <div className="form-note" style={{ marginTop: 14, fontSize: 11, color: "var(--ink-soft)", textAlign: "center" }}>
        New accounts start as customers. To offer services, log in and apply as an artisan from your Profile tab.
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const auth = useAuth();

  if (auth.loading) return <div className="app"><Style /><div className="phone"><div className="screen screen--center">Loading…</div></div></div>;
  if (!auth.token || !auth.user) return <div className="app"><AuthScreen onLogin={auth.login} onRegister={auth.register} /></div>;

  return (
    <div className="app">
      <Style />
      <div className="phone">
        <MainApp auth={auth} />
      </div>
    </div>
  );
}

function MainApp({ auth }) {
  const { user, token, logout, setUser } = auth;
  const isArtisan = user.role === "ARTISAN";
  const isAdmin = user.role === "ADMIN";

  const [view, setView] = useState("home");
  const [navTab, setNavTab] = useState("home");
  const [selectedArtisan, setSelectedArtisan] = useState(null);
  const [area, setArea] = useState("All areas");
  const [query, setQuery] = useState("");
  const [tradeFilter, setTradeFilter] = useState(null);
  const [activeRequestId, setActiveRequestId] = useState(null);
  const [toast, setToast] = useState(null);

  const [artisans, setArtisans] = useState([]);
  const [requests, setRequests] = useState([]); // student: "mine" / artisan: "incoming"
  const [openGroups, setOpenGroups] = useState([]);
  const [messages, setMessages] = useState([]);
  const [application, setApplication] = useState(null);

  function flash(msg) { setToast(msg); setTimeout(() => setToast(null), 2400); }
  function fail(err) { flash(err.message || "Something went wrong"); }

  async function loadArtisans() {
    try {
      const qs = new URLSearchParams();
      if (tradeFilter) qs.set("trade", tradeFilter);
      if (area !== "All areas") qs.set("area", area);
      if (query.trim()) qs.set("q", query.trim());
      const d = await api(`/api/artisans?${qs.toString()}`);
      setArtisans(d.artisans);
    } catch (e) { fail(e); }
  }
  async function loadRequests() {
    try {
      if (isArtisan) {
        const [incomingRes, mineRes] = await Promise.all([
          api("/api/requests/incoming", { token }),
          api("/api/requests/mine", { token }),
        ]);
        const merged = [...incomingRes.requests, ...mineRes.requests]
          .filter((r, i, arr) => arr.findIndex((x) => x.id === r.id) === i)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        setRequests(merged);
      } else {
        const d = await api("/api/requests/mine", { token });
        setRequests(d.requests);
      }
    } catch (e) { fail(e); }
  }
  async function loadOpenGroups() {
    try { const d = await api("/api/requests/open-groups", { token }); setOpenGroups(d.groups); } catch (e) { /* ignore */ }
  }
  async function loadApplication() {
    if (isArtisan || isAdmin) return;
    try { const d = await api("/api/applications/me", { token }); setApplication(d.application); }
    catch (e) { setApplication(null); }
  }

  useEffect(() => { loadArtisans(); }, [tradeFilter, area, query]);
  useEffect(() => { loadRequests(); loadOpenGroups(); loadApplication(); }, []);

  const onlineNow = artisans.filter((a) => a.online);
  const activeRequest = requests.find((r) => r.id === activeRequestId);

  function openArtisanProfile(a) { setSelectedArtisan(a); setView("artisanProfile"); }
  function goNav(tab) {
    setNavTab(tab);
    if (tab === "home") setView("home");
    else if (tab === "browse") { setTradeFilter(null); setView("browse"); }
    else if (tab === "requests") { loadRequests(); setView("requestsList"); }
    else if (tab === "messages") { loadRequests(); setView("messagesList"); }
    else setView("userProfile");
  }

  async function sendRequest(artisanProfileId, job, when, jobGroupId) {
    try {
      const d = await api("/api/requests", { method: "POST", token, body: { artisanProfileId, job, when, jobGroupId: jobGroupId || undefined } });
      setRequests((prev) => [d.request, ...prev]);
      setActiveRequestId(d.request.id);
      setView("requestSent");
    } catch (e) { fail(e); }
  }
  async function openConversation(requestId) {
    setActiveRequestId(requestId);
    setView("conversation");
    try { const d = await api(`/api/requests/${requestId}/messages`, { token }); setMessages(d.messages); } catch (e) { fail(e); }
  }
  async function sendMessage(requestId, text) {
    try {
      const d = await api(`/api/requests/${requestId}/messages`, { method: "POST", token, body: { text } });
      setMessages((prev) => [...prev, d.message]);
    } catch (e) { fail(e); }
  }
  async function respondToRequest(requestId, status) {
    try {
      const d = await api(`/api/requests/${requestId}/status`, { method: "PATCH", token, body: { status } });
      setRequests((prev) => prev.map((r) => (r.id === requestId ? d.request : r)));
    } catch (e) { fail(e); }
  }
  async function confirmRequest(requestId) {
    try {
      const d = await api(`/api/requests/${requestId}/confirm`, { method: "PATCH", token });
      await loadRequests();
      setMessages((prev) => [...prev]);
      flash("Booking confirmed");
      return d;
    } catch (e) { fail(e); }
  }
  async function completeRequest(requestId, rating, reviewText) {
    try {
      const d = await api(`/api/requests/${requestId}/complete`, { method: "PATCH", token, body: { rating, reviewText } });
      setRequests((prev) => prev.map((r) => (r.id === requestId ? d.request : r)));
      flash("Job marked complete");
    } catch (e) { fail(e); }
  }
  async function reportRequest(requestId, reason, note) {
    try {
      await api(`/api/requests/${requestId}/report`, { method: "POST", token, body: { reason, note } });
      flash("Reported to VettedHands");
    } catch (e) { fail(e); }
  }
  async function toggleOnline(next) {
    try {
      const d = await api("/api/artisans/me/online", { method: "PATCH", token, body: { online: next } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, online: d.artisan.online } }));
      flash(next ? "You're online" : "You're offline");
      return d.artisan;
    } catch (e) { fail(e); }
  }
  async function setBadge(badge) {
    try {
      const d = await api("/api/artisans/me/badge", { method: "PATCH", token, body: { badge } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, badge: d.artisan.badge } }));
      flash(badge === "TOP_RATED" ? "You're now Top Rated!" : "Badge updated");
    } catch (e) { fail(e); }
  }
  async function applyAsArtisan(trade, bio, photos) {
    try {
      const d = await api("/api/applications", { method: "POST", token, body: { trade, bio, photos: photos || [] } });
      setApplication(d.application);
      flash("Application submitted for review");
    } catch (e) { fail(e); }
  }
  async function addArtisanPhoto(url) {
    try {
      const d = await api("/api/artisans/me/photos", { method: "POST", token, body: { url } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, photos: [...(u.artisanProfile.photos || []), d.photo] } }));
    } catch (e) { fail(e); }
  }
  async function removeArtisanPhoto(photoId) {
    try {
      await api(`/api/artisans/me/photos/${photoId}`, { method: "DELETE", token });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, photos: u.artisanProfile.photos.filter((p) => p.id !== photoId) } }));
    } catch (e) { fail(e); }
  }

  return (
    <>
      <div className="content">
        {view === "home" && (
          <HomeView user={user} isArtisan={isArtisan} area={area} setArea={setArea} query={query} setQuery={setQuery}
            requests={requests}
            onlineNow={onlineNow} filtered={artisans} onOpenProfile={openArtisanProfile}
            onPickTrade={(id) => { setTradeFilter(id); setView("browse"); setNavTab("browse"); }}
            onSeeAll={() => { setTradeFilter(null); setView("browse"); setNavTab("browse"); }}
            onLogout={logout} />
        )}
        {view === "browse" && (
          <BrowseView query={query} setQuery={setQuery} tradeFilter={tradeFilter} setTradeFilter={setTradeFilter}
            area={area} setArea={setArea} filtered={artisans}
            onBack={() => { setView("home"); setNavTab("home"); }} onOpenProfile={openArtisanProfile} />
        )}
        {view === "artisanProfile" && selectedArtisan && (
          <ArtisanProfileView artisan={selectedArtisan} canRequest={selectedArtisan.user.id !== user.id} onBack={() => setView(navTab === "browse" ? "browse" : "home")} onRequest={() => setView("request")} />
        )}
        {view === "request" && selectedArtisan && (
          <RequestView artisan={selectedArtisan} openJobGroups={openGroups} onBack={() => setView("artisanProfile")}
            onSend={(job, when, gId) => sendRequest(selectedArtisan.id, job, when, gId)} />
        )}
        {view === "requestSent" && activeRequest && (
          <RequestSentView artisan={activeRequest.artisanProfile} onDone={() => { setView("home"); setNavTab("home"); }} onMessage={() => openConversation(activeRequest.id)} />
        )}
        {view === "requestsList" && (
          <RequestsListView requests={requests} user={user} onOpen={openConversation}
            onRespond={respondToRequest} />
        )}
        {view === "messagesList" && <MessagesListView requests={requests} user={user} onOpen={openConversation} />}
        {view === "conversation" && activeRequest && (
          <ConversationView request={activeRequest} messages={messages} user={user}
            onBack={() => setView(navTab === "messages" ? "messagesList" : navTab === "requests" ? "requestsList" : "home")}
            onSend={(text) => sendMessage(activeRequest.id, text)}
            onConfirm={() => confirmRequest(activeRequest.id)}
            onComplete={(rating, review) => completeRequest(activeRequest.id, rating, review)}
            onReport={(reason, note) => reportRequest(activeRequest.id, reason, note)}
            onRespond={(status) => respondToRequest(activeRequest.id, status)} />
        )}
        {view === "userProfile" && (
          <UserProfileView user={user} isArtisan={isArtisan} application={application}
            incomingCount={requests.filter((r) => r.status === "PENDING").length}
            onApply={applyAsArtisan} onToggleOnline={toggleOnline} onSetBadge={setBadge}
            onAddPhoto={addArtisanPhoto} onRemovePhoto={removeArtisanPhoto}
            onLogout={logout} onBrowse={() => goNav("browse")} onViewRequests={() => goNav("requests")} />
        )}
      </div>
      <BottomNav active={navTab} onChange={goNav} isArtisan={isArtisan}
        requestCount={requests.filter((r) => r.status === "PENDING" || r.status === "ACCEPTED").length} />
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

/* ---------------- Home ---------------- */
function HomeView({ user, isArtisan, requests, area, setArea, query, setQuery, onlineNow, filtered, onOpenProfile, onPickTrade, onSeeAll, onLogout }) {
  return (
    <div className="screen">

function statusMeta(status) {
  const map = {
    PENDING: { label: "Pending", cls: "badge--pending" },
    ACCEPTED: { label: "Accepted", cls: "badge--accepted" },
    CONFIRMED: { label: "Confirmed", cls: "badge--confirmed" },
    COMPLETED: { label: "Completed", cls: "badge--completed" },
    CLOSED: { label: "Closed", cls: "badge--closed" },
    DECLINED: { label: "Declined", cls: "badge--declined" },
  };
  return map[status] || { label: status, cls: "" };
}

/* ---------------- Conversation ---------------- */
function ConversationView({ request, messages, user, onBack, onSend, onConfirm, onComplete, onReport, onRespond }) {
  const [text, setText] = useState("");
  const [confirming, setConfirming] = useState(false);
  const [showComplete, setShowComplete] = useState(false);
  const [showReport, setShowReport] = useState(false);
  const bottomRef = useRef(null);
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages.length]);
  const meta = statusMeta(request.status);
  const iAmArtisanSide = request.artisanProfile.user.id === user.id;
  const other = iAmArtisanSide ? request.student : request.artisanProfile.user;
  const canAct = !["COMPLETED", "DECLINED", "CLOSED"].includes(request.status);

  return (
    <div className="screen">
      <div className="topbar">
        <button className="iconbtn" onClick={onBack}><ArrowLeft size={18} /></button>
        <div className="topbar-title">{other.name}</div>
        <div className="avatar avatar--sm" style={{ background: colorFor(request.id) }}>{initials(other.name)}</div>
      </div>
      <div className="convo-status"><span className={"status-badge " + meta.cls}>{meta.label}</span><span className="convo-job">{request.job}</span></div>

      <div className="convo-messages">
        {messages.map((m) => (
          <div key={m.id} className={"bubble-row " + (m.senderType === "SYSTEM" ? "bubble-row--sys" : m.senderId === user.id ? "bubble-row--me" : "bubble-row--them")}>
            {m.senderType === "SYSTEM"
              ? <div className="bubble-sys">{m.text}</div>
              : <div className={"bubble " + (m.senderId === user.id ? "bubble--me" : "bubble--them")}>{m.text}</div>}
          </div>
        ))}
        {request.status === "COMPLETED" && request.rating && (
          <div className="review-recap"><Star size={13} fill="#B5651D" stroke="none" /> Rated {request.rating}★ {request.reviewText && `— "${request.reviewText}"`}</div>
        )}
        <div ref={bottomRef} />
      </div>

      {iAmArtisanSide && canAct && request.status === "PENDING" && (
        <div className="settle-actions" style={{ margin: "10px 16px 0" }}>
          <button className="ghost-btn" onClick={() => onRespond("DECLINED")}>Decline</button>
          <button className="settle-btn" onClick={() => onRespond("ACCEPTED")}>Accept</button>
        </div>
      )}

      {!iAmArtisanSide && canAct && request.status === "ACCEPTED" && !confirming && (
        <button className="action-btn" onClick={() => setConfirming(true)}>Confirm booking with {other.name.split(" ")[0]}</button>
      )}
      {confirming && (
        <div className="inline-confirm">
          <div className="inline-confirm-text">This closes any other pending requests for this same job. Confirm?</div>
          <div className="settle-actions">
            <button className="ghost-btn" onClick={() => setConfirming(false)}>Cancel</button>
            <button className="settle-btn" onClick={() => { onConfirm(); setConfirming(false); }}>Yes, confirm</button>
          </div>
        </div>
      )}

      {!iAmArtisanSide && canAct && request.status === "CONFIRMED" && !showComplete && (
        <button className="action-btn" onClick={() => setShowComplete(true)}>Mark job complete & rate</button>
      )}
      {showComplete && <CompletionForm onCancel={() => setShowComplete(false)} onSubmit={(r, t) => { onComplete(r, t); setShowComplete(false); }} />}

      {!iAmArtisanSide && canAct && !showReport && (
        <button className="report-link" onClick={() => setShowReport(true)}><Flag size={13} /> Report a problem</button>
      )}
      {showReport && <ReportForm onCancel={() => setShowReport(false)} onSubmit={(reason, note) => { onReport(reason, note); setShowReport(false); }} />}

      <form className="convo-input" onSubmit={(e) => { e.preventDefault(); if (text.trim()) { onSend(text.trim()); setText(""); } }}>
        <input placeholder="Type a message…" value={text} onChange={(e) => setText(e.target.value)} />
        <button type="submit" className="send-btn"><Send size={16} /></button>
      </form>
    </div>
  );
}

// Converts a picked image file into a base64 data URL so it can be sent straight to the
// backend as a plain string — no separate image hosting service needed for now.
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

      {!isArtisan && (
        <div className="section">
          <div className="section-head"><span>Offer your services</span></div>
          {!application && !showForm && <button className="artisan-cta" onClick={() => setShowForm(true)}><Hammer size={17} /> Become a vetted artisan on VettedHands</button>}
          {!application && showForm && (
            <div className="form form--card">
              <label>Trade<select value={trade} onChange={(e) => setTrade(e.target.value)}>{trades.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></label>
              <label>Tell customers about your work<textarea rows={3} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="At least 10 characters…" /></label>
              <label>Photos of past work
                <div className="photo-picker">
                  {photos.map((p, i) => <img key={i} src={p} className="photo-thumb" style={{ objectFit: "cover" }} />)}
                  {photos.length < 4 && (
                    <label className="photo-add" style={{ cursor: uploading ? "wait" : "pointer" }}>
                      <input type="file" accept="image/*" multiple onChange={handlePhotoPick} style={{ display: "none" }} disabled={uploading} />
                      <Camera size={16} /> {uploading ? "…" : "Add"}
                    </label>
                  )}
                </div>
              </label>
              <div className="settle-actions">
                <button className="ghost-btn" onClick={() => setShowForm(false)}><X size={14} /> Cancel</button>
                <button className="settle-btn" disabled={bio.trim().length < 10} onClick={() => { onApply(trade, bio.trim(), photos); setShowForm(false); }}>Submit for review</button>
              </div>
            </div>
          )}
          {application && application.status === "PENDING" && (
            <div className="pending-card">
              <div className="pending-title">Application under review</div>
              <div className="pending-sub">We're checking your details. You'll become an artisan once approved by an admin.</div>
            </div>
          )}
          {application && application.status === "REJECTED" && (
            <div className="pending-card"><div className="pending-title" style={{ color: "var(--danger)" }}>Application not approved</div></div>
          )}
        </div>
      )}

      <div className="section">
        <div className="settings-list">
          <div className="settings-row settings-row--danger" onClick={onLogout} style={{ cursor: "pointer" }}><LogOut size={17} /> Log out</div>
        </div>
      </div>
      {!isArtisan && <button className="browse-link" onClick={onBrowse}>Browse artisans <ChevronRight size={14} /></button>}
    </div>
  );
}

/* ---------------- Bottom nav ---------------- */
function BottomNav({ active, onChange, isArtisan, requestCount }) {
  const items = [
    { id: "home", label: "Home", icon: Home },
    { id: "browse", label: "Browse", icon: Compass },
    { id: "requests", label: "Requests", icon: ClipboardList, badge: requestCount },
    { id: "messages", label: "Messages", icon: MessageCircle },
    { id: "profile", label: "Profile", icon: UserIcon },
  ];
  return (
    <div className="bottomnav">
      {items.map((it) => { const I = it.icon; const isActive = active === it.id; return (
        <button key={it.id} className={"nav-item" + (isActive ? " nav-item--active" : "")} onClick={() => onChange(it.id)}>
          <span className="nav-icon-wrap"><I size={19} strokeWidth={isActive ? 2.4 : 2} />{it.badge > 0 && <span className="nav-badge">{it.badge}</span>}</span>
          <span>{it.label}</span>
        </button>
      ); })}
    </div>
  );
}

        .bottomnav { order: 2; flex-direction: column; width: 220px; flex-shrink: 0; border-top: none; border-left: 1px solid var(--line); padding: 22px 12px; gap: 4px; justify-content: flex-start; }
        .nav-item { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 11px 12px; border-radius: 10px; font-size: 13px; }
        .nav-item--active { background: var(--accent-bg); }
        .feed--scroll { display: block; column-count: 2; column-gap: 14px; padding-bottom: 24px; }
        .feed--scroll > * { break-inside: avoid; margin-bottom: 10px; }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

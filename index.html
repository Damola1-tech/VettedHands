/* ============ API HELPER ============ */
// Talks to the real backend. Throws an Error with a readable message on failure.
async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    throw new Error((data && data.error) || `Request failed (${res.status})`);
  }
  return data;
}

/* ============ AUTH ============ */
function useAuth() {
  const [token, setToken] = useState(() => localStorage.getItem("vh_token") || null);
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(!!token);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!token) { setLoading(false); return; }
    api("/api/auth/me", { token })
      .then((d) => setUser(d.user))
      .catch(() => { localStorage.removeItem("vh_token"); setToken(null); })
      .finally(() => setLoading(false));
  }, [token]);

  async function login(email, password) {
    setError(null);
    const d = await api("/api/auth/login", { method: "POST", body: { email, password } });
    localStorage.setItem("vh_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  async function register(name, email, password, area) {
    setError(null);
    const d = await api("/api/auth/register", { method: "POST", body: { name, email, password, area } });
    localStorage.setItem("vh_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  function logout() {
    localStorage.removeItem("vh_token");
    setToken(null);
    setUser(null);
  }
  return { token, user, setUser, loading, error, login, register, logout };
}

function AuthScreen({ initialMode, onBack, onLogin, onRegister }) {
  const [mode, setMode] = useState(initialMode || "login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [area, setArea] = useState(areas[1]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setErr(null); setBusy(true);
    try {
      if (mode === "login") await onLogin(email.trim(), password);
      else await onRegister(name.trim(), email.trim(), password, area);
    } catch (ex) {
      setErr(ex.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="auth">
      <div className="auth-inner">
        <div className="auth-top">
          <button className="auth-back" onClick={onBack} aria-label="Back"><ArrowLeft size={20} /></button>
          <span className="landing-mark landing-mark--sm"><ShieldCheck size={16} /></span>
          <span className="auth-brand">VettedHands</span>
        </div>
        <h1 className="auth-h1">{mode === "register" ? <>Find skilled people.<br />Hire with confidence.</> : "Welcome back."}</h1>
        <p className="auth-sub">{mode === "register" ? "Create your account in under a minute. No payment needed." : "Sign in to track your requests and jobs."}</p>
        <div className="seg">
          <button type="button" className={"seg-btn" + (mode === "register" ? " seg-btn--on" : "")} onClick={() => setMode("register")}>Create account</button>
          <button type="button" className={"seg-btn" + (mode === "login" ? " seg-btn--on" : "")} onClick={() => setMode("login")}>Sign in</button>
        </div>
        <form className="auth-form" onSubmit={submit}>
          {mode === "register" && (
            <label>Full name<input required value={name} onChange={(e) => setName(e.target.value)} placeholder="Your name" /></label>
          )}
          <label>Email<input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" /></label>
          <label>Password<input required type="password" minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="At least 6 characters" /></label>

  );
}

function App() {
  const auth = useAuth();
  const [screen, setScreen] = useState("landing"); // landing | auth
  const [authMode, setAuthMode] = useState("register");
  const [intent, setIntent] = useState(null); // "request" | "artisan" | null

  useEffect(() => { if (!auth.token) setScreen("landing"); }, [auth.token]);

  let body;
  if (auth.loading) {
    body = <div className="screen screen--center">Loading…</div>;
  } else if (!auth.token || !auth.user) {
    body = screen === "auth"
      ? <AuthScreen initialMode={authMode} onBack={() => setScreen("landing")} onLogin={auth.login} onRegister={auth.register} />
      : <Landing
          onSignIn={() => { setIntent(null); setAuthMode("login"); setScreen("auth"); }}
          onStart={(i) => { setIntent(i); setAuthMode("register"); setScreen("auth"); }} />;
  } else {
    body = <MainApp auth={auth} intent={intent} />;
  }

  return (
    <div className="app">
      <Style />
      <div className="phone">{body}</div>
    </div>
  );
}

  const [messages, setMessages] = useState([]);

  const [myReviews, setMyReviews] = useState([]);
  const [profileOrigin, setProfileOrigin] = useState("home"); // where artisanProfile's back button returns to
  const blankWiz = { step: 1, trade: null, problem: "", area: user.area && areas.includes(user.area) ? user.area : areas[1], when: "asap", whenDate: "", image: null, results: [], loading: false, searched: false, sort: "best" };
  const [wiz, setWiz] = useState(blankWiz);

  function flash(msg) { setToast(msg); setTimeout(() => setToast(null), 2400); }
  function fail(err) { flash(err.message || "Something went wrong"); }

  async function loadArtisans() {
    try {
      const qs = new URLSearchParams();
      if (tradeFilter) qs.set("trade", tradeFilter);
      if (area !== "All areas") qs.set("area", area);
      if (query.trim()) qs.set("q", query.trim());
      const d = await api(`/api/artisans?${qs.toString()}`);
      setArtisans(d.artisans);
    } catch (e) { fail(e); }
  }
  async function loadRequests() {
    try {
      if (isArtisan) {
        const [incomingRes, mineRes] = await Promise.all([
          api("/api/requests/incoming", { token }),
          api("/api/requests/mine", { token }),
        ]);
        const merged = [...incomingRes.requests, ...mineRes.requests]
          .filter((r, i, arr) => arr.findIndex((x) => x.id === r.id) === i)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        setRequests(merged);
      } else {
        const d = await api("/api/requests/mine", { token });
        setRequests(d.requests);
      }
    } catch (e) { fail(e); }
  }
  async function loadOpenGroups() {
    try { const d = await api("/api/requests/open-groups", { token }); setOpenGroups(d.groups); } catch (e) { /* ignore */ }
  }
  async function loadApplication() {
    if (isArtisan || isAdmin) return;
    try { const d = await api("/api/applications/me", { token }); setApplication(d.application); }
    catch (e) { setApplication(null); }
  }

  useEffect(() => { loadArtisans(); }, [tradeFilter, area, query]);
  useEffect(() => { loadRequests(); loadOpenGroups(); loadApplication(); }, []);
  useEffect(() => {
    if (!isArtisan) return;
    api("/api/artisans/me/reviews", { token }).then((d) => setMyReviews(d.reviews)).catch(() => {});
  }, [isArtisan]);
  // Background refresh of requests every 8s so the nav badge count and requests/messages
  // lists stay roughly current even when the user isn't actively viewing a conversation.
  useEffect(() => {
    const id = setInterval(() => { loadRequests(); }, 8000);
    return () => clearInterval(id);
  }, []);

  const onlineNow = artisans.filter((a) => a.online);
  const activeRequest = requests.find((r) => r.id === activeRequestId);
  const notifications = useMemo(() => buildNotifications(requests, user), [requests, user.id]);
  const unreadNotifs = notifications.filter((n) => notifUnread(n, readIds)).length;
  const unreadMessages = requests.reduce((n, r) => n + (r.unreadCount || 0), 0);
  function markRead(ids) {
    setReadIds((prev) => {
      const next = [...new Set([...prev, ...ids])].slice(-300);
      try { localStorage.setItem("vh_notif_read_" + user.id, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }

  async function openArtisanProfile(a, origin = "home") {
    setProfileOrigin(origin);
    setSelectedArtisan(a);
    setView("artisanProfile");
    // Reviews load first — small and fast. Photos load after, since base64 data
    // URLs are large; this keeps the profile feeling instant instead of blocking
    // on the heaviest part of the payload.
    try { const d = await api(`/api/artisans/${a.id}`); setSelectedArtisan(d.artisan); } catch (e) { /* keep list version */ }
    try {
      const p = await api(`/api/artisans/${a.id}/photos`);
      setSelectedArtisan((prev) => (prev && prev.id === a.id ? { ...prev, photos: p.photos } : prev));
    } catch (e) { /* photos just won't show */ }
  }
  function goNav(tab) {
    setNavTab(tab === "browse" ? "home" : tab);
    if (tab === "home") setView("home");
    else if (tab === "browse") { setTradeFilter(null); setView("browse"); }
    else if (tab === "requests") { loadRequests(); setView("requestsList"); }
    else if (tab === "messages") { loadRequests(); setView("messagesList"); }
    else setView("userProfile");
  }

  async function sendRequest(artisanProfileId, job, when, jobGroupId, image, reqArea) {
    try {
      const d = await api("/api/requests", { method: "POST", token, body: { artisanProfileId, job, when, jobGroupId: jobGroupId || undefined, image: image || undefined, area: reqArea || undefined } });
      setRequests((prev) => [d.request, ...prev]);
      setActiveRequestId(d.request.id);
      setWiz({ ...blankWiz });
      setView("requestSent");
    } catch (e) { fail(e); }
  }
  async function requestFromProfile() {
    if (profileOrigin === "wizard" && wiz.problem.trim().length >= 10) {
      await sendRequest(selectedArtisan.id, wiz.problem.trim(), whenText(wiz), null, wiz.image, wiz.area);
    } else {
      setView("request");
    }
  }
  async function openConversation(requestId, from = null) {
    setConvoFrom(from);
    setActiveRequestId(requestId);
    setView("conversation");
    setOtherReadAt(null);
    setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, unreadCount: 0 } : r)));
    try { const d = await api(`/api/requests/${requestId}/messages`, { token }); setMessages(d.messages); setOtherReadAt(d.otherReadAt || null); } catch (e) { fail(e); }
    const req = requests.find((r) => r.id === requestId);
    if (req && req.hasImage) {
      setRequestImage("loading");
      try { const img = await api(`/api/requests/${requestId}/image`, { token }); setRequestImage(img.imageUrl); } catch (e) { setRequestImage(null); }
    } else {
      setRequestImage(null);
    }
  }
  // Silent background refresh — no toast/flash on failure, since this fires every
  // few seconds and a transient network blip shouldn't spam the user.
  async function pollConversation(requestId) {
    try {
      const msgRes = await api(`/api/requests/${requestId}/messages`, { token });
      setMessages(msgRes.messages);
      setOtherReadAt(msgRes.otherReadAt || null);
      const reqRes = await api("/api/requests/mine", { token });
      let list = reqRes.requests;
      if (isArtisan) {
        const incomingRes = await api("/api/requests/incoming", { token });
        list = [...incomingRes.requests, ...reqRes.requests].filter((r, i, arr) => arr.findIndex((x) => x.id === r.id) === i);
      }
      setRequests(list.map((r) => (r.id === requestId ? { ...r, unreadCount: 0 } : r)));
    } catch (e) { /* silent — next poll will retry */ }
  }
  async function sendMessage(requestId, text) {
    try {
      const d = await api(`/api/requests/${requestId}/messages`, { method: "POST", token, body: { text } });
      setMessages((prev) => [...prev, d.message]);
      setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, lastMessage: d.message } : r)));
    } catch (e) { fail(e); }
  }
  async function respondToRequest(requestId, status) {
    try {
      const d = await api(`/api/requests/${requestId}/status`, { method: "PATCH", token, body: { status } });
      setRequests((prev) => prev.map((r) => (r.id === requestId ? d.request : r)));
    } catch (e) { fail(e); }
  }
  async function confirmRequest(requestId) {
    try {
      const d = await api(`/api/requests/${requestId}/confirm`, { method: "PATCH", token });
      await loadRequests();
      setMessages((prev) => [...prev]);
      flash("Booking confirmed");
      return d;
    } catch (e) { fail(e); }
  }
  async function completeRequest(requestId, rating, reviewText) {
    try {
      const d = await api(`/api/requests/${requestId}/complete`, { method: "PATCH", token, body: { rating, reviewText } });
      setRequests((prev) => prev.map((r) => (r.id === requestId ? d.request : r)));
      flash("Job marked complete");
    } catch (e) { fail(e); }
  }
  async function reportRequest(requestId, reason, note) {
    try {
      await api(`/api/requests/${requestId}/report`, { method: "POST", token, body: { reason, note } });
      flash("Reported to VettedHands");
    } catch (e) { fail(e); }
  }
  async function toggleOnline(next) {
    try {
      const d = await api("/api/artisans/me/online", { method: "PATCH", token, body: { online: next } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, online: d.artisan.online } }));
      flash(next ? "You're online" : "You're offline");
      return d.artisan;
    } catch (e) { fail(e); }
  }
  async function setBadge(badge) {
    try {
      const d = await api("/api/artisans/me/badge", { method: "PATCH", token, body: { badge } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, badge: d.artisan.badge } }));
      flash(badge === "TOP_RATED" ? "You're now Top Rated!" : "Badge updated");
    } catch (e) { fail(e); }
  }
  async function applyAsArtisan(trade, bio, photos, phone, socialHandle, idDocument) {
    try {
      const d = await api("/api/applications", { method: "POST", token, body: { trade, bio, photos: photos || [], phone, socialHandle: socialHandle || undefined, idDocument } });
      setApplication(d.application);
      flash("Application submitted for review");
    } catch (e) { fail(e); }
  }
  async function addArtisanPhoto(url) {
    try {
      const d = await api("/api/artisans/me/photos", { method: "POST", token, body: { url } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, photos: [...(u.artisanProfile.photos || []), d.photo] } }));
    } catch (e) { fail(e); }
  }
  async function removeArtisanPhoto(photoId) {
    try {
      await api(`/api/artisans/me/photos/${photoId}`, { method: "DELETE", token });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, photos: u.artisanProfile.photos.filter((p) => p.id !== photoId) } }));
    } catch (e) { fail(e); }
  }

  return (
    <>
      <div className="content">
        {view === "home" && (
          <HomeView user={user} isArtisan={isArtisan} area={area} setArea={setArea} query={query} setQuery={setQuery}
            requests={requests} myReviews={myReviews}
            onlineNow={onlineNow} filtered={artisans} onOpenProfile={(a) => openArtisanProfile(a, "home")}
            onPickTrade={(id) => { setWiz({ ...blankWiz, trade: id }); setView("wizard"); }}
            onSeeAll={() => { setTradeFilter(null); setView("browse"); setNavTab("home"); }}
            onOpenWizard={() => { setWiz({ ...blankWiz }); setView("wizard"); }}
            onOpenRequests={() => setView("notifications")}
            onOpenMe={() => goNav("profile")}
            hasAlerts={unreadNotifs > 0}
            flash={flash}
            onLogout={logout} />
        )}
        {view === "wizard" && (
          <RequestFlow wiz={wiz} setWiz={setWiz} meId={user.id}
            onBack={() => { setView("home"); setNavTab("home"); setWiz({ ...blankWiz }); }}
            onSelectArtisan={(a) => openArtisanProfile(a, "wizard")} />
        )}
        {view === "browse" && (
          <BrowseView query={query} setQuery={setQuery} tradeFilter={tradeFilter} setTradeFilter={setTradeFilter}
            area={area} setArea={setArea} filtered={artisans}
            onBack={() => { setTradeFilter(null); setView("home"); setNavTab("home"); }} onOpenProfile={(a) => openArtisanProfile(a, "browse")} />
        )}
        {view === "artisanProfile" && selectedArtisan && (
          <ArtisanProfileView artisan={selectedArtisan} canRequest={selectedArtisan.user.id !== user.id}
            summary={profileOrigin === "wizard" && wiz.problem.trim().length >= 10 ? `${tradeLabel(wiz.trade)} · ${whenText(wiz)} · ${wiz.area}` : null}
            onBack={() => {
              if (profileOrigin === "wizard") setView("wizard");
              else if (profileOrigin === "browse") setView("browse");
              else setView("home");
            }}
            onRequest={requestFromProfile} />
        )}
        {view === "request" && selectedArtisan && (
          <RequestView artisan={selectedArtisan} openJobGroups={openGroups} initialJob={prefillJob} onBack={() => setView("artisanProfile")}
            onSend={(job, when, gId, image) => { sendRequest(selectedArtisan.id, job, when, gId, image); setPrefillJob(""); }} />
        )}
        {view === "requestSent" && activeRequest && (
          <RequestSentView artisan={activeRequest.artisanProfile} onDone={() => { setView("home"); setNavTab("home"); }} onMessage={() => openConversation(activeRequest.id)} />
        )}
        {view === "requestsList" && (
          <RequestsListView requests={requests} user={user} onOpen={openConversation}
            onRespond={respondToRequest} />
        )}
        {view === "messagesList" && <MessagesListView requests={requests} user={user} onOpen={(id) => openConversation(id)} />}
        {view === "notifications" && (
          <NotificationsView items={notifications} readIds={readIds}
            onBack={() => setView("home")}
            onMarkAll={() => markRead(notifications.map((n) => n.id))}
            onOpen={(n) => { markRead([n.id]); openConversation(n.requestId, "notifications"); }} />
        )}
        {view === "conversation" && activeRequest && (
          <ConversationView request={activeRequest} messages={messages} requestImage={requestImage} user={user} otherReadAt={otherReadAt}
            onBack={() => setView(convoFrom === "notifications" ? "notifications" : navTab === "messages" ? "messagesList" : navTab === "requests" ? "requestsList" : "home")}
            onSend={(text) => sendMessage(activeRequest.id, text)}
            onConfirm={() => confirmRequest(activeRequest.id)}
            onComplete={(rating, review) => completeRequest(activeRequest.id, rating, review)}
            onReport={(reason, note) => reportRequest(activeRequest.id, reason, note)}
            onRespond={(status) => respondToRequest(activeRequest.id, status)}
            onPoll={pollConversation} />
        )}
        {view === "userProfile" && (
          <UserProfileView startWithForm={intent === "artisan"} user={user} isArtisan={isArtisan} application={application}
            incomingCount={requests.filter((r) => r.status === "PENDING").length} myReviews={myReviews}
            onApply={applyAsArtisan} onToggleOnline={toggleOnline} onSetBadge={setBadge}
            onAddPhoto={addArtisanPhoto} onRemovePhoto={removeArtisanPhoto}
            onLogout={logout} onBrowse={() => goNav("browse")} onViewRequests={() => goNav("requests")} />
        )}
      </div>
      <BottomNav active={navTab} onChange={goNav} isArtisan={isArtisan}
        requestCount={requests.filter((r) => r.status === "PENDING" || r.status === "ACCEPTED").length} messageCount={unreadMessages} />
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

];

const HOME_TINTS = [["#E3EFE9", "#0F4D3A"], ["#FBEBC8", "#8A5A12"], ["#DDE9F4", "#1F5A8A"], ["#F6E1DA", "#9A3B26"], ["#ECE7D8", "#4A4636"]];
function tintFor(id = "") { let h = 0; for (const c of id) h += c.charCodeAt(0); return HOME_TINTS[h % HOME_TINTS.length]; }
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }

      {false && (
        <div className="section">
          <div className="dash-card">
            <div className="dash-header">
              <div className="avatar avatar--lg" style={{ background: colorFor(user.id) }}>{initials(user.name)}</div>
              <div className="dash-header-text">
                <div className="dash-name">{user.name}</div>
                <div className="app-trade">{tradeLabel(user.artisanProfile.trade)} · {user.artisanProfile.area}</div>
                <span className="badge" style={{ marginTop: 6 }}>{user.artisanProfile.badge === "TOP_RATED" ? <><Award size={11} /> Top Rated</> : <><CheckCircle2 size={11} /> Vetted</>}</span>
              </div>
            </div>
            <div className="dash-stats">
              <div className="dash-stat"><div className="dash-stat-num">{fmtStars(user.artisanProfile.rating)}</div><div className="dash-stat-label"><Star size={11} fill="#E0A458" stroke="none" /> Rating</div></div>
              <div className="dash-stat"><div className="dash-stat-num">{user.artisanProfile.jobsCompleted}</div><div className="dash-stat-label">Jobs done</div></div>
              <div className="dash-stat"><div className="dash-stat-num">{requests.filter((r) => r.status === "PENDING").length}</div><div className="dash-stat-label">New requests</div></div>
            </div>
          </div>
          {myReviews.length > 0 && (
            <div className="review-list" style={{ marginTop: 12 }}>
              {myReviews.slice(0, 1).map((r) => (
                <div key={r.id} className="review-item">
                  <div className="review-stars">{Array.from({ length: 5 }).map((_, i) => <Star key={i} size={12} fill={i < r.rating ? "#B5651D" : "none"} stroke={i < r.rating ? "#B5651D" : "#C9BFAB"} />)}</div>
                  <div className="review-text">"{r.reviewText}"</div>
                  <div className="review-author">— {r.student.name.split(" ")[0]}</div>
                </div>
              ))}
            </div>
          )}

      )}

      <h3 className="hm-h">Popular services</h3>
      <div className="hm-grid">
        {homeTrades.map((t) => { const I = t.icon; const ok = live.includes(t.id); return (
          <button key={t.id} className={"hm-tile" + (ok ? "" : " hm-tile--soon")}
            onClick={() => (ok ? onPickTrade(t.id) : flash(`${t.label} is coming soon to Ado-Ekiti`))}>
            <I size={24} />
            <span>{t.label}</span>
          </button>
        ); })}
      </div>

      <div className="hm-sec-head"><h3 className="hm-h">Available near you</h3><span>Ready today</span></div>
      <div className="hm-list">
        {onlineNow.slice(0, 3).map((a) => { const [bg, fg] = tintFor(a.id); return (
          <button key={a.id} className="hm-ac" onClick={() => onOpenProfile(a)}>
            <div className="hm-ac-top">
              <span className="hm-ac-av" style={{ background: bg, color: fg }}>{initials(a.user.name)}</span>
              <div className="hm-ac-id">
                <div className="hm-ac-name">{a.user.name}<ShieldCheck size={15} fill="#0F4D3A" stroke="#fff" /></div>
                <div className="hm-ac-trade">{tradeLabel(a.trade)}</div>

              <span className="hm-on"><i />Available now</span>

            <div className="hm-ac-meta">
              <b><Star size={13} fill="#B5651D" stroke="none" /> {fmtStars(a.rating)}</b>
              <span>{a.jobsCompleted} jobs completed</span>
              <span><MapPin size={13} /> {a.area}</span>

/* ---------------- Artisan profile ---------------- */
function timeAgo(d) {
  const days = Math.floor((Date.now() - new Date(d).getTime()) / 864e5);
  if (days < 1) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 14) return `${days} days ago`;
  if (days < 60) return `${Math.floor(days / 7)} weeks ago`;
  return `${Math.floor(days / 30)} months ago`;
}

function ArtisanProfileView({ artisan: a, canRequest, summary, onBack, onRequest }) {
  const [busy, setBusy] = useState(false);
  const st = a.stats || null;
  const first = a.user.name.split(" ")[0];
  const top = a.badge === "TOP_RATED";
  const minJobs = st ? st.minJobs : 15;
  const minRating = st ? st.minRating : 4.5;
  const approved = a.createdAt ? new Date(a.createdAt).toLocaleDateString("en-US", { month: "long", year: "numeric" }) : null;
  const rows = [
    { ok: true, t: "Identity verified", d: "ID and phone number checked by VettedHands." },
    { ok: !!a.skillVerified, t: a.skillVerified ? "Skill verified" : "Skill not yet verified", d: a.skillVerified ? "Trade and experience confirmed by our review team." : "Our review team has not confirmed this trade yet." },
    ...(approved ? [{ ok: true, t: "Approved by admin", d: `Application reviewed and approved in ${approved}.` }] : []),
    { ok: top, t: top ? "Top Rated" : "Top Rated not yet earned", d: top ? `Earned: ${minJobs}+ completed jobs with a ${minRating}+ average rating.` : `Needs ${minJobs} completed jobs and a ${minRating}+ average rating. ${a.jobsCompleted} so far.` },
  ];
  async function go() {
    if (busy) return;
    setBusy(true);
    try { await onRequest(); } finally { setBusy(false); }
  }
  return (
    <div className="screen ap">
      <div className="ap-hero">
        <button className="ap-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button>
        <div className="ap-id">
          <span className="ap-av">{initials(a.user.name)}</span>
          <div>
            <div className="ap-name">{a.user.name}</div>
            <div className="ap-trade">{tradeLabel(a.trade)} · {a.area}, Ado-Ekiti</div>
          </div>
        </div>
        <div className="ap-pills">
          <span className="ap-pill"><ShieldCheck size={15} /> Vetted Artisan</span>
          {a.skillVerified && <span className="ap-pill ap-pill--b">Skill Verified</span>}
          {top && <span className="ap-pill ap-pill--a">Top Rated</span>}
        </div>
      </div>

      <div className="ap-stats">
        <div className="ap-stat"><b>{fmtStars(a.rating)}</b><span>Rating</span></div>
        <div className="ap-stat"><b>{a.jobsCompleted}</b><span>Jobs completed</span></div>
        <div className="ap-stat"><b>{st ? st.repeatCustomers : "–"}</b><span>Repeat customers</span></div>
      </div>
      <div className={"ap-avail" + (a.online ? "" : " ap-avail--off")}><i />{a.online ? `Available now · ${a.area}` : `Currently unavailable · ${a.area}`}</div>

      <div className="ap-sec">
        <h2 className="ap-h">Verification</h2>
        <div className="ap-card">
          {rows.map((r) => (
            <div key={r.t} className={"ap-vrow" + (r.ok ? "" : " ap-vrow--no")}>
              <span className="ap-vic">{r.ok ? <Check size={16} /> : <Clock size={16} />}</span>

        {(!a.reviews || a.reviews.length === 0) && (

/* ---------------- Request flow ---------------- */
const WHEN_OPTIONS = [
  { id: "asap", label: "As soon as possible", sub: "Next available artisan", short: "ASAP" },
  { id: "today", label: "Today", sub: "Afternoon", short: "Today" },
  { id: "tomorrow", label: "Tomorrow", sub: "Morning", short: "Tomorrow" },
  { id: "date", label: "Pick a date", sub: "Choose day and time", short: "Scheduled" },
];
const SORTS = [["best", "Best match"], ["area", "Same area"], ["rating", "Rating"], ["jobs", "Jobs completed"]];

function whenText(w) {
  if (w.when === "today") return "Today afternoon";
  if (w.when === "tomorrow") return "Tomorrow morning";
  if (w.when === "date" && w.whenDate) {
    const d = new Date(w.whenDate);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }
  return "As soon as possible";
}

// Trade match is the search itself. Then: available, same area, verification,
// rating (weighted by jobs so one 5-star job cannot outrank a proven record), jobs completed.
function matchScore(a, area) {
  let s = 0;
  if (a.online) s += 1000;
  if (a.area === area) s += 400;
  if (a.skillVerified) s += 120;
  if (a.badge === "TOP_RATED") s += 120;
  s += Number(a.rating || 0) * 20 * Math.min(1, (a.jobsCompleted || 0) / 5);
  s += Math.min(a.jobsCompleted || 0, 50);
  return s;
}

function RequestFlow({ wiz, setWiz, meId, onBack, onSelectArtisan }) {
  const set = (patch) => setWiz((w) => ({ ...w, ...patch }));
  const [photoBusy, setPhotoBusy] = useState(false);
  const formOk = wiz.trade && wiz.problem.trim().length >= 10 && (wiz.when !== "date" || !!wiz.whenDate);

  async function pickPhoto(e) {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setPhotoBusy(true);
    try { set({ image: await fileToDataUrl(f) }); } finally { setPhotoBusy(false); }
  }
  async function search() {
    set({ step: 2, loading: true, searched: false, sort: "best" });
    try {
      const d = await api(`/api/artisans?trade=${wiz.trade}`);
      set({ results: d.artisans.filter((a) => a.user.id !== meId), loading: false, searched: true });
    } catch (e) { set({ results: [], loading: false, searched: true }); }
  }

  const list = useMemo(() => {
    const arr = [...wiz.results];
    const sc = (a) => matchScore(a, wiz.area);
    if (wiz.sort === "area") arr.sort((a, b) => (b.area === wiz.area) - (a.area === wiz.area) || sc(b) - sc(a));
    else if (wiz.sort === "rating") arr.sort((a, b) => (b.rating - a.rating) || (b.jobsCompleted - a.jobsCompleted));
    else if (wiz.sort === "jobs") arr.sort((a, b) => (b.jobsCompleted - a.jobsCompleted) || (b.rating - a.rating));
    else arr.sort((a, b) => sc(b) - sc(a));
    return arr;
  }, [wiz.results, wiz.sort, wiz.area]);

  const whenShort = (WHEN_OPTIONS.find((o) => o.id === wiz.when) || WHEN_OPTIONS[0]).short;

  return (
    <div className="screen rf">
      <div className="rf-top">
        <button className="rf-back" onClick={() => (wiz.step === 2 ? set({ step: 1 }) : onBack())} aria-label="Back"><ArrowLeft size={22} /></button>
        <span>New request · Step {wiz.step} of 2</span>
      </div>

      {wiz.step === 1 ? (
        <>
          <h1 className="rf-h">What do you need help with?</h1>
          <p className="rf-sub">The clearer the job, the better the match.</p>

          <div className="rf-label">Service category</div>
          <div className="rf-chips">
            {trades.map((t) => <button key={t.id} type="button" className={"rf-chip" + (wiz.trade === t.id ? " on" : "")} onClick={() => set({ trade: t.id })}>{t.label}</button>)}
          </div>

          <div className="rf-label">Describe the job</div>
          <textarea className="rf-text" rows={4} maxLength={500} value={wiz.problem} onChange={(e) => set({ problem: e.target.value })} placeholder="e.g. The socket in my kitchen sparks when I plug anything in." />
          <div className="rf-count"><span>Mention what you see, hear or smell.</span><span>{wiz.problem.length} / 500</span></div>

          <div className="rf-label">Your location</div>
          <label className="rf-field">
            <MapPin size={18} />
            <select value={wiz.area} onChange={(e) => set({ area: e.target.value })}>
              {areas.filter((a) => a !== "All areas").map((a) => <option key={a} value={a}>{a}, Ado-Ekiti</option>)}
            </select>
            <ChevronDown size={16} />
          </label>

          <div className="rf-label">Preferred time</div>
          <div className="rf-times">
            {WHEN_OPTIONS.map((o) => (
              <button key={o.id} type="button" className={"rf-time" + (wiz.when === o.id ? " on" : "")} onClick={() => set({ when: o.id })}>
                <b>{o.label}</b><span>{o.sub}</span>
              </button>
            ))}
          </div>
          {wiz.when === "date" && <input className="rf-date" type="datetime-local" value={wiz.whenDate} onChange={(e) => set({ whenDate: e.target.value })} />}

          <div className="rf-label">Photo <small>(optional)</small></div>
          <div className="rf-photo">
            <label className="rf-add">
              <input type="file" accept="image/*" style={{ display: "none" }} onChange={pickPhoto} />
              <span>{photoBusy ? "…" : "+"}</span>Add
            </label>
            {wiz.image && (
              <div className="rf-thumb">
                <img src={wiz.image} alt="" />
                <button type="button" onClick={() => set({ image: null })} aria-label="Remove photo"><X size={12} /></button>
              </div>
            )}
            <p>A clear photo helps artisans quote and prepare tools.</p>
          </div>

          <div className="rf-bar">
            <div className="rf-note"><ShieldCheck size={16} /> Only vetted artisans are matched. No payment needed to request.</div>
            <button className="rf-go" disabled={!formOk || photoBusy} onClick={search}>Find trusted artisans</button>
          </div>
        </>
      ) : (
        <>
          <h1 className="rf-h">
            {wiz.loading ? "Finding trusted artisans…" : list.length ? `We found ${list.length} trusted ${list.length === 1 ? "artisan" : "artisans"} near you` : "No artisans available for this service right now"}
          </h1>
          <div className="rf-tags"><span>{tradeLabel(wiz.trade)}</span><span>{wiz.area}</span><span>{whenShort}</span></div>

          {!wiz.loading && wiz.searched && list.length === 0 && (
            <div className="rf-empty">
              <div className="rf-empty-ic"><MapPin size={26} /></div>
              <b>No artisans available for this service right now.</b>
              <p>Nobody vetted for {tradeLabel(wiz.trade)} is listed in Ado-Ekiti yet. Try another service, or check back soon.</p>
              <button className="rf-ghost" onClick={() => set({ step: 1 })}>Try another service</button>
            </div>
          )}

          {list.length > 0 && (
            <>
              <div className="rf-info"><ShieldCheck size={18} /><span>Ranked by trade match, availability, area, verification, rating and jobs completed.</span></div>
              <div className="rf-sorts">
                {SORTS.map(([k, l]) => <button key={k} className={"rf-sort" + (wiz.sort === k ? " on" : "")} onClick={() => set({ sort: k })}>{l}</button>)}
              </div>
              <div className="rf-list">
                {list.map((a) => { const [bg, fg] = tintFor(a.id); return (
                  <div key={a.id} className="rf-card">
                    <div className="rf-card-top">
                      <span className="rf-av" style={{ background: bg, color: fg }}>{initials(a.user.name)}</span>
                      <div className="rf-id"><b>{a.user.name}</b><span>{tradeLabel(a.trade)}{a.area === wiz.area ? " · Same area" : ""}</span></div>
                      <span className="rf-rate"><Star size={14} fill="#B5651D" stroke="none" /><b>{fmtStars(a.rating)}</b></span>
                    </div>
                    <div className="rf-badges">
                      <span className="rf-b rf-b--g"><ShieldCheck size={13} /> Vetted</span>
                      {a.skillVerified && <span className="rf-b rf-b--b">Skill Verified</span>}
                      {a.badge === "TOP_RATED" && <span className="rf-b rf-b--a">Top Rated</span>}
                    </div>
                    <div className="rf-meta">
                      <span><b>{a.jobsCompleted}</b> jobs completed</span>
                      <span><MapPin size={13} /> {a.area}</span>
                      <span className={a.online ? "rf-on" : "rf-off"}><i />{a.online ? "Available now" : "Offline"}</span>
                    </div>
                    <button className="rf-view" onClick={() => onSelectArtisan(a)}>View profile</button>
                  </div>
                ); })}
              </div>
            </>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------- Request ---------------- */
function RequestView({ artisan, openJobGroups, initialJob, onBack, onSend }) {
  const [mode, setMode] = useState("new");
  const [job, setJob] = useState(initialJob || "");
  const [when, setWhen] = useState("");
  const [image, setImage] = useState(null);
  const [sending, setSending] = useState(false);

  const valid = attaching ? true : job.trim() && when;

  return (
    <div className="screen">
      <div className="topbar"><button className="iconbtn" onClick={onBack}><ArrowLeft size={18} /></button><div className="topbar-title">Request · {artisan.user.name.split(" ")[0]}</div><div style={{ width: 34 }} /></div>
      <div className="form">
        {openJobGroups.length > 0 && (
          <label>Is this for a job you're already comparing quotes on?
            <select value={mode} onChange={(e) => setMode(e.target.value)}>
              <option value="new">No, this is a new job</option>
              {openJobGroups.map((g) => <option key={g.jobGroupId} value={g.jobGroupId}>Same as: "{g.job.slice(0, 34)}{g.job.length > 34 ? "…" : ""}"</option>)}
            </select>
          </label>
        )}
        {attaching ? (
          <div className="info-note">Comparing {artisan.user.name.split(" ")[0]} against your other request for: <strong>"{attachedGroup.job}"</strong> ({attachedGroup.when}). Confirming one closes the others automatically.</div>
        ) : (
          <>
            <label>What do you need done?<textarea rows={3} value={job} onChange={(e) => setJob(e.target.value)} placeholder="e.g. Fan not turning on, socket in room sparking" /></label>
            <label>When<select value={when} onChange={(e) => setWhen(e.target.value)}><option value="">Select a time</option><option>As soon as possible</option><option>Later today</option><option>Tomorrow</option><option>This week</option></select></label>
            <label>Photo of the problem (optional)
              {image ? (
                <div className="id-preview">
                  <img src={image} className="id-preview-img" />
                  <button type="button" className="id-remove-btn" onClick={() => setImage(null)}><X size={12} /> Remove</button>
                </div>
              ) : (
                <label className="id-upload-btn">
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={async (e) => { const f = e.target.files[0]; if (f) setImage(await fileToDataUrl(f)); e.target.value = ""; }} />

        }}>
        {sending ? "Sending…" : "Send request"}

    </div>
  );
}

function statusMeta(status) {

    CLOSED: { label: "Closed", cls: "badge--closed" },
    DECLINED: { label: "Declined", cls: "badge--declined" },

  return map[status] || { label: status, cls: "" };
}

/* ---------------- Chat helpers ---------------- */
const reqCode = (id) => "VH-" + String(id).slice(0, 4).toUpperCase();
function shortName(name = "") { const p = name.trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : p[0]; }
function clockTime(d) { return new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
function listTime(d) {
  const x = new Date(d), t = new Date();
  if (x.toDateString() === t.toDateString()) return clockTime(d);
  if (x.toDateString() === new Date(t.getTime() - 864e5).toDateString()) return "Yesterday";
  return x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function dayLabel(d) {
  const x = new Date(d), t = new Date();
  if (x.toDateString() === t.toDateString()) return "Today";
  if (x.toDateString() === new Date(t.getTime() - 864e5).toDateString()) return "Yesterday";
  return x.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
// One tick = sent, two ticks = the other person has opened the chat since.
function Ticks({ read, lead }) {
  return (
    <svg width="17" height="11" viewBox="0 0 17 11" fill="none" stroke={read ? "#1B7F5A" : "#A39B88"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"
      style={{ marginLeft: lead ? 0 : 5, marginRight: lead ? 6 : 0, flexShrink: 0 }}>
      <polyline points="1 6 4 9 10 2" />
      {read && <polyline points="6 6 9 9 15 2" />}
    </svg>
  );
}

/* ---------------- Notifications ---------------- */
// Built from the requests and messages the app already loads. Nothing new on the backend.
function buildNotifications(requests, me) {
  const out = [];
  for (const r of requests) {
    if (!r.artisanProfile || !r.student) continue;
    const artisanSide = r.artisanProfile.user.id === me.id;
    const other = artisanSide ? r.student : r.artisanProfile.user;
    const first = other.name.split(" ")[0];
    const base = { requestId: r.id, time: r.updatedAt || r.createdAt };
    const add = (status, extra) => out.push({ ...base, id: r.id + ":" + status, ...extra });
    if (!artisanSide) {
      if (r.status === "ACCEPTED") add("ACCEPTED", { kind: "ok", title: `${first} accepted your request`, text: "You can message them and confirm the booking." });
      if (r.status === "CONFIRMED") add("CONFIRMED", { kind: "job", title: "Your booking is confirmed", text: `${other.name} is booked for ${reqCode(r.id)}.` });
      if (r.status === "COMPLETED") add("COMPLETED", r.rating
        ? { kind: "ok", title: "Job completed", text: `Thanks for reviewing ${first}.` }
        : { kind: "review", title: `Time to review ${first}`, text: `Your ${r.job.slice(0, 40)} job is complete. Share how it went.` });
      if (r.status === "DECLINED") add("DECLINED", { kind: "flag", title: `${first} declined your request`, text: "Try another artisan near you." });
      if (r.status === "CLOSED") add("CLOSED", { kind: "flag", title: "Request closed", text: "You booked another artisan for this job." });
    } else {
      if (r.status === "PENDING") add("PENDING", { kind: "job", title: `New request from ${first}`, text: r.job });
      if (r.status === "CONFIRMED") add("CONFIRMED", { kind: "ok", title: `${first} confirmed the booking`, text: r.job });
      if (r.status === "COMPLETED") add("COMPLETED", { kind: "review", title: `Job completed for ${first}`, text: r.rating ? `They rated you ${r.rating} out of 5.` : "Waiting for their review." });
    }
    const m = r.lastMessage;
    if (m && m.senderType !== "SYSTEM" && m.senderId !== me.id) {
      out.push({ ...base, id: `m:${r.id}:${m.id}`, time: m.createdAt, kind: "msg", autoRead: r.unreadCount === 0, title: `${first} sent a message`, text: m.text });
    }
  }
  return out.sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 40);
}
const notifUnread = (n, readIds) => !n.autoRead && !readIds.includes(n.id);

const NOTIF_STYLE = {
  msg: { icon: MessageCircle, bg: "#DDE9F4", fg: "#1F5A8A" },
  job: { icon: Zap, bg: "#E3EFE9", fg: "#0F4D3A" },
  ok: { icon: Check, bg: "#E3EFE9", fg: "#0F4D3A" },
  review: { icon: Star, bg: "#FBEBC8", fg: "#8A5A12" },
  flag: { icon: Flag, bg: "#F8E1DB", fg: "#A8402D" },
};

function NotificationsView({ items, readIds, onBack, onMarkAll, onOpen }) {
  const today = new Date().toDateString();
  const groups = [
    ["Today", items.filter((n) => new Date(n.time).toDateString() === today)],
    ["Earlier", items.filter((n) => new Date(n.time).toDateString() !== today)],
  ].filter(([, list]) => list.length);
  const anyUnread = items.some((n) => notifUnread(n, readIds));
  return (
    <div className="screen nf">
      <div className="nf-top">
        <button className="nf-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button>
        {anyUnread && <button className="nf-all" onClick={onMarkAll}>Mark all as read</button>}
      </div>
      <h1 className="nf-h">Notifications</h1>
      {items.length === 0 && <div className="nf-empty"><b>You're all caught up.</b>Updates about your requests and messages show up here.</div>}
      {groups.map(([label, list]) => (
        <div key={label}>
          <div className="nf-label">{label.toUpperCase()}</div>
          <div className="nf-card">
            {list.map((n) => { const s = NOTIF_STYLE[n.kind]; const I = s.icon; const unread = notifUnread(n, readIds); return (
              <button key={n.id} className={"nf-item" + (unread ? " nf-item--new" : "")} onClick={() => onOpen(n)}>
                <span className="nf-ic" style={{ background: s.bg, color: s.fg }}><I size={20} /></span>

function MessagesListView({ requests, user, onOpen }) {

    .filter((x) => !q.trim() || `${x.other.name} ${x.r.job} ${reqCode(x.r.id)}`.toLowerCase().includes(q.trim().toLowerCase()))
    .sort((a, b) => new Date(b.at) - new Date(a.at));

          const mine = !!m && m.senderId === user.id;
          const [bg, fg] = tintFor(other.id || r.id);
          const preview = m ? (m.senderType === "SYSTEM" ? m.text : (mine ? "You: " : "") + m.text) : r.job;

  const meta = statusMeta(request.status);

    <div className="screen cv">
      <div className="cv-head">
        <button className="cv-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button>
        <span className="cv-av" style={{ background: bg, color: fg }}>{initials(other.name)}</span>

      {requestImage === "loading" && <div className="convo-job-loading">Loading photo…</div>}

          return (
            <React.Fragment key={m.id}>
              {showDay && <div className="cv-day"><span>{dayLabel(m.createdAt)}</span></div>}

        {request.status === "COMPLETED" && request.rating && (
          <div className="review-recap"><Star size={13} fill="#B5651D" stroke="none" /> Rated {request.rating}★ {request.reviewText && `— "${request.reviewText}"`}</div>

        <div className="settle-actions" style={{ margin: "10px 16px 0" }}>
          <button className="ghost-btn" onClick={() => onRespond("DECLINED")}>Decline</button>
          <button className="settle-btn" onClick={() => onRespond("ACCEPTED")}>Accept</button>

      {showComplete && <CompletionForm onCancel={() => setShowComplete(false)} onSubmit={(r, t) => { onComplete(r, t); setShowComplete(false); }} />}

      {showReport && <ReportForm reasons={iAmArtisanSide ? reportReasonsArtisan : reportReasonsCustomer} onCancel={() => setShowReport(false)} onSubmit={(reason, note) => { onReport(reason, note); setShowReport(false); }} />}

        <input placeholder="Type a message" value={text} onChange={(e) => setText(e.target.value)} />
        <button type="submit" className="cv-send" disabled={!text.trim()} aria-label="Send"><Send size={18} /></button>
      </form>

    </div>
  );

// Converts a picked image file into a base64 data URL so it can be sent straight to the
// backend as a plain string — no separate image hosting service needed for now.
// Resizes and compresses an image before converting to a data URL — cuts a
// typical 2-5MB phone photo down to ~50-150KB, which is the main thing making
// uploads, sends, and later loads feel slow. Same function signature as before,
// so every existing call site (work photos, ID doc, request image) speeds up
// automatically with no other changes needed.
function fileToDataUrl(file, maxDim = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

      .landing-cta { width:100%; padding:16px; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; border:1.5px solid var(--primary); }
      .landing-cta--primary { background:var(--primary); color:#fff; margin-bottom:12px; }
      .landing-cta--secondary { background:transparent; color:var(--primary); }
      .trust-card { margin-top:28px; background:var(--primary); color:#fff; border-radius:22px; padding:26px 22px; }
      .trust-card-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:25px; line-height:1.15; margin-bottom:22px; }
      .trust-item { display:flex; gap:14px; margin-bottom:20px; }

      .trust-check { width:34px; height:34px; border-radius:50%; background:#E3EFE9; color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }

      .trust-item-d { font-size:14.5px; line-height:1.45; color:rgba(255,255,255,.78); margin-top:2px; }
      .how-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:26px; margin:34px 0 16px; }
      .how-step { display:flex; gap:14px; align-items:flex-start; margin-bottom:18px; }
      .how-num { width:40px; height:40px; border-radius:50%; border:1.5px solid var(--primary); color:var(--primary); font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .how-t { font-weight:700; font-size:16.5px; }
      .how-d { font-size:14.5px; color:var(--ink-soft); margin-top:2px; line-height:1.45; }
      .auth-inner { max-width:440px; margin:0 auto; }
      .auth-top { display:flex; align-items:center; gap:10px; margin-bottom:26px; }
      .auth-back { width:36px; height:36px; border:none; background:none; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; margin-left:-8px; }
      .auth-brand { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:19px; }
      .auth-h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(32px,9vw,42px); line-height:1.05; letter-spacing:-0.02em; margin:0 0 12px; }
      .auth-sub { font-size:16px; line-height:1.5; color:var(--ink-soft); margin:0 0 22px; }
      .seg { display:flex; background:#E9E2D0; border-radius:14px; padding:5px; margin-bottom:22px; }
      .seg-btn { flex:1; border:none; background:transparent; padding:13px 8px; border-radius:10px; font-family:inherit; font-size:15px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
      .seg-btn--on { background:var(--surface); color:var(--primary); box-shadow:0 1px 3px rgba(20,32,27,.12); }
      .auth-form { display:flex; flex-direction:column; gap:16px; }

      .auth-form input, .auth-form select { border:1.5px solid var(--line); border-radius:12px; padding:14px; font-size:16px; font-family:inherit; background:var(--surface); color:var(--ink); }

      .auth-err { background:#F8E3DD; color:var(--danger); border-radius:10px; padding:11px 13px; font-size:13.5px; }
      .auth-submit { background:var(--primary); color:#fff; border:none; border-radius:14px; padding:16px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; margin-top:4px; }

      .auth-note { display:flex; gap:12px; align-items:flex-start; margin-top:22px; background:#E3EFE9; color:var(--primary); border-radius:14px; padding:16px; font-size:14px; line-height:1.5; }

            /* ===== Request flow ===== */
      .rf { padding:calc(14px + env(safe-area-inset-top)) 20px 0; min-height:0; }
      .rf-top { display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:15px; font-weight:600; margin-bottom:6px; }
      .rf-back { background:none; border:none; color:var(--ink); width:40px; height:40px; margin-left:-10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
      .rf-h { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:31px; line-height:1.08; letter-spacing:-0.02em; margin:6px 0 8px; }
      .rf-sub { color:var(--ink-soft); font-size:16px; margin:0 0 20px; }
      .rf-label { font-weight:700; font-size:15px; margin:22px 0 10px; }
      .rf-label small { font-weight:500; color:var(--ink-soft); font-size:15px; }
      .rf-chips { display:flex; flex-wrap:wrap; gap:10px; }
      .rf-chip { background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:12px 18px; font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer; }
      .rf-chip.on { background:var(--primary); border-color:var(--primary); color:#fff; }
      .rf-text { width:100%; border:1.5px solid var(--line); border-radius:14px; padding:14px; font-family:inherit; font-size:16px; line-height:1.45; resize:none; background:var(--surface); color:var(--ink); }
      .rf-text:focus, .rf-date:focus { outline:none; border-color:var(--primary); }
      .rf-count { display:flex; justify-content:space-between; gap:12px; color:var(--ink-soft); font-size:13.5px; margin-top:8px; }
      .rf-field { display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:0 14px; color:var(--primary); }
      .rf-field select { flex:1; border:none; background:transparent; font-family:inherit; font-size:16px; padding:15px 0; color:var(--ink); appearance:none; -webkit-appearance:none; outline:none; }
      .rf-times { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .rf-time { text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; font-family:inherit; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
      .rf-time b { font-size:15px; color:var(--ink); }
      .rf-time span { font-size:13px; color:var(--ink-soft); }
      .rf-time.on { background:#E3EFE9; border-color:var(--primary); }
      .rf-date { width:100%; margin-top:10px; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; font-family:inherit; font-size:16px; background:var(--surface); }
      .rf-photo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
      .rf-add { width:84px; height:84px; border:1.5px dashed #BFB69F; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; }
      .rf-add span { font-size:24px; line-height:1; }
      .rf-thumb { position:relative; width:84px; height:84px; }
      .rf-thumb img { width:100%; height:100%; object-fit:cover; border-radius:16px; }
      .rf-thumb button { position:absolute; top:-6px; right:-6px; width:24px; height:24px; border-radius:50%; background:var(--danger); color:#fff; border:2px solid var(--bg); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
      .rf-photo p { flex-basis:100%; margin:0; color:var(--ink-soft); font-size:13.5px; }
      .rf-bar { position:sticky; bottom:0; margin:26px -20px 0; padding:12px 20px calc(14px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
      .rf-note { display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:13.5px; margin-bottom:10px; }
      .rf-go { width:100%; background:var(--primary); color:#fff; border:none; border-radius:14px; padding:17px; font-family:inherit; font-size:16.5px; font-weight:700; cursor:pointer; }
      .rf-go:disabled { opacity:.4; cursor:not-allowed; }
      .rf-tags { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 16px; }
      .rf-tags span { background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:14px; font-weight:600; }
      .rf-info { display:flex; gap:10px; align-items:flex-start; background:#E3EFE9; color:var(--primary); border-radius:14px; padding:14px; font-size:14px; line-height:1.45; margin-bottom:16px; }
      .rf-info svg { margin-top:2px; }
      .rf-sorts { display:flex; gap:10px; overflow-x:auto; margin:0 -20px 16px; padding:0 20px 2px; }
      .rf-sort { flex-shrink:0; background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:11px 18px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; color:var(--ink); }
      .rf-sort.on { background:var(--primary); border-color:var(--primary); color:#fff; }
      .rf-list { display:flex; flex-direction:column; gap:14px; padding-bottom:24px; }
      .rf-card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 8px 18px -16px rgba(30,27,22,.35); }
      .rf-card-top { display:flex; align-items:center; gap:14px; }
      .rf-av { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:18px; flex-shrink:0; }
      .rf-id { flex:1; min-width:0; display:flex; flex-direction:column; }
      .rf-id b { font-family:'Bricolage Grotesque',sans-serif; font-size:19px; line-height:1.15; }
      .rf-id span { color:var(--ink-soft); font-size:14.5px; margin-top:2px; }
      .rf-rate { display:inline-flex; align-items:center; gap:5px; font-size:16px; flex-shrink:0; }
      .rf-badges { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 12px; }
      .rf-b { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:6px 12px; font-size:13px; font-weight:700; }
      .rf-b--g { background:#E3EFE9; color:var(--primary); }
      .rf-b--b { background:#DDE9F4; color:#1F5A8A; }
      .rf-b--a { background:#FBEBC8; color:#8A5A12; }

      .rf-on { color:var(--success); font-weight:700; }
      .rf-on i, .rf-off i { width:8px; height:8px; border-radius:50%; background:var(--success); display:inline-block; }
      .rf-off i { background:#B9B2A2; }
      .rf-view { width:100%; background:var(--surface); border:1.5px solid var(--primary); color:var(--primary); border-radius:14px; padding:14px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; }
      .rf-empty { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:32px 22px; text-align:center; margin-top:10px; }
      .rf-empty-ic { width:54px; height:54px; border-radius:50%; background:#E3EFE9; color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
      .rf-empty b { font-family:'Bricolage Grotesque',sans-serif; font-size:21px; display:block; margin-bottom:8px; }
      .rf-empty p { color:var(--ink-soft); line-height:1.5; margin:0 0 18px; }
      .rf-ghost { background:var(--surface); border:1.5px solid var(--primary); color:var(--primary); border-radius:14px; padding:13px 22px; font-family:inherit; font-size:15.5px; font-weight:700; cursor:pointer; }

      /* ===== Artisan profile (customer view) ===== */
      .ap { padding-bottom:0; }
      .ap-hero { background:linear-gradient(135deg,#0F4D3A 0%,#0A3A2B 100%); color:#F4EFE0; padding:calc(14px + env(safe-area-inset-top)) 20px 62px; }
      .ap-back { background:none; border:none; color:#F4EFE0; width:40px; height:40px; margin-left:-10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
      .ap-id { display:flex; align-items:center; gap:16px; margin-top:8px; }
      .ap-av { width:84px; height:84px; border-radius:50%; background:#E3EFE9; color:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:28px; flex-shrink:0; }
      .ap-name { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:27px; line-height:1.08; letter-spacing:-0.01em; }
      .ap-trade { color:rgba(244,239,224,.78); font-size:15px; margin-top:5px; }
      .ap-pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
      .ap-pill { display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--primary); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; }
      .ap-pill--b { background:#DDE9F4; color:#1F5A8A; }
      .ap-pill--a { background:#FBEBC8; color:#8A5A12; }
      .ap-stats { display:flex; background:var(--surface); border:1px solid var(--line); border-radius:18px; margin:-40px 16px 0; padding:18px 0; box-shadow:0 10px 24px -18px rgba(30,27,22,.35); position:relative; }
      .ap-stat { flex:1; text-align:center; display:flex; flex-direction:column; gap:3px; }
      .ap-stat:not(:last-child) { border-right:1px solid var(--line); }
      .ap-stat b { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:28px; color:var(--ink); }
      .ap-stat span { font-size:13px; color:var(--ink-soft); }
      .ap-avail { margin:14px 16px 0; background:#E3EFE9; color:var(--primary); border-radius:14px; padding:14px 16px; font-weight:700; font-size:15px; display:flex; align-items:center; gap:10px; }
      .ap-avail i { width:10px; height:10px; border-radius:50%; background:var(--success); flex-shrink:0; }
      .ap-avail--off { background:#ECE7D8; color:var(--ink-soft); }
      .ap-avail--off i { background:#B9B2A2; }
      .ap-sec { padding:0 20px; margin-top:26px; }
      .ap-h { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:24px; margin:0 0 14px; }
      .ap-h small { font-family:'Figtree',sans-serif; font-size:13.5px; font-weight:500; color:var(--ink-soft); float:right; margin-top:8px; }
      .ap-card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:6px 16px; }
      .ap-vrow { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
      .ap-vrow:last-child { border-bottom:none; }
      .ap-vic { width:32px; height:32px; border-radius:50%; background:#E3EFE9; color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .ap-vrow--no .ap-vic { background:#ECE7D8; color:#A39B88; }
      .ap-vrow b { display:block; font-size:16px; }
      .ap-vrow span { display:block; color:var(--ink-soft); font-size:14px; line-height:1.4; margin-top:2px; }
      .ap-about { font-size:16.5px; line-height:1.55; margin:0; }
      .ap-work { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .ap-work img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:16px; border:1px solid var(--line); }
      .ap-rev { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
      .ap-rev-top { display:flex; align-items:center; gap:12px; }
      .ap-rev-av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
      .ap-rev-id { flex:1; min-width:0; }
      .ap-rev-id b { display:block; font-size:16px; }
      .ap-rev-id span { font-size:13px; color:var(--ink-soft); }
      .ap-rev-r { font-weight:700; color:#8A5A12; display:inline-flex; align-items:center; gap:4px; }
      .ap-rev p { margin:12px 0 0; font-size:15.5px; line-height:1.5; }
      .ap-track { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; }
      .ap-bar { margin-bottom:16px; }
      .ap-bar:last-child { margin-bottom:0; }
      .ap-bar-top { display:flex; justify-content:space-between; font-size:14.5px; margin-bottom:8px; }
      .ap-bar-t { height:10px; background:#EEE7D5; border-radius:999px; overflow:hidden; }
      .ap-bar-t i { display:block; height:100%; background:var(--primary); border-radius:999px; }
      .ap-cta { position:sticky; bottom:0; margin-top:26px; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--bg) 70%,rgba(245,240,228,0)); }
      .ap-cta button { width:100%; background:var(--primary); color:#fff; border:none; border-radius:14px; padding:17px; font-family:inherit; font-size:16.5px; font-weight:700; cursor:pointer; }
      .ap-cta button:disabled { opacity:.5; }
      .ap-note { text-align:center; color:var(--ink-soft); font-size:13px; margin-top:8px; }

      @media (max-width: 480px) {
        .app { padding: 0; }
        .phone { max-width: 100%; min-height: 100dvh; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
        .bottomnav { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
        .topbar { padding-top: calc(16px + env(safe-area-inset-top)); }
      }

      @media (min-width: 760px) {
        .app { padding: 40px 24px; align-items: flex-start; }
        .phone { max-width: 880px; min-height: 680px; border-radius: 20px; flex-direction: row; }
        .content { order: 1; min-width: 0; }
        .bottomnav { order: 2; flex-direction: column; width: 220px; flex-shrink: 0; border-top: none; border-left: 1px solid var(--line); padding: 22px 12px; gap: 4px; justify-content: flex-start; }
        .nav-item { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 11px 12px; border-radius: 10px; font-size: 13px; }
        .nav-item--active { background: var(--accent-bg); }
        .feed--scroll { display: block; column-count: 2; column-gap: 14px; padding-bottom: 24px; }
        .feed--scroll > * { break-inside: avoid; margin-bottom: 10px; }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

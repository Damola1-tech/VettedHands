<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ============ SVG ICON SYSTEM (replaces lucide-react) ============ */
const ICON_PATHS = {
  search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
  bell: <><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>,
  mapPin: <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>,
  star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
  checkCircle2: <><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>,
  arrowLeft: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
  zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
  droplet: <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>,
  scissors: <><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></>,
  smartphone: <><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></>,
  clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
  chevronRight: <polyline points="9 18 15 12 9 6"/>,
  send: <polygon points="22 2 15 22 11 13 2 9 22 2"/>,
  flag: <><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></>,
  home: <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
  compass: <><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></>,
  clipboardList: <><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-5"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></>,
  messageCircle: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>,
  user: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
  logOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
  shieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></>,
  helpCircle: <><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
  hammer: <><path d="M15 12l-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/><path d="M17.64 15L22 10.64"/><path d="M20.91 11.7l-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.44 2.44"/></>,
  camera: <><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>,
  x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
  award: <><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>,
  pencil: <><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></>,
  trash2: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
};

function Icon({ name, size = 18, color, strokeWidth = 2, fill = "none", stroke = "currentColor", style, ...rest }) {
  const shape = ICON_PATHS[name];
  if (!shape) return null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill={fill} stroke={color || stroke} strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }} {...rest}>
      {shape}
    </svg>
  );
}

/* Named wrappers so the rest of the app code below is unchanged from the original lucide-react imports */
const Search = (p) => <Icon name="search" {...p} />;
const Bell = (p) => <Icon name="bell" {...p} />;
const MapPin = (p) => <Icon name="mapPin" {...p} />;
const Star = (p) => <Icon name="star" {...p} />;
const CheckCircle2 = (p) => <Icon name="checkCircle2" {...p} />;
const ArrowLeft = (p) => <Icon name="arrowLeft" {...p} />;
const Zap = (p) => <Icon name="zap" {...p} />;
const Droplet = (p) => <Icon name="droplet" {...p} />;
const Scissors = (p) => <Icon name="scissors" {...p} />;
const Smartphone = (p) => <Icon name="smartphone" {...p} />;
const Clock = (p) => <Icon name="clock" {...p} />;
const ChevronRight = (p) => <Icon name="chevronRight" {...p} />;
const Send = (p) => <Icon name="send" {...p} />;
const Flag = (p) => <Icon name="flag" {...p} />;
const Home = (p) => <Icon name="home" {...p} />;
const Compass = (p) => <Icon name="compass" {...p} />;
const ClipboardList = (p) => <Icon name="clipboardList" {...p} />;
const MessageCircle = (p) => <Icon name="messageCircle" {...p} />;
const UserIcon = (p) => <Icon name="user" {...p} />;
const LogOut = (p) => <Icon name="logOut" {...p} />;
const ShieldCheck = (p) => <Icon name="shieldCheck" {...p} />;
const HelpCircle = (p) => <Icon name="helpCircle" {...p} />;
const Hammer = (p) => <Icon name="hammer" {...p} />;
const Camera = (p) => <Icon name="camera" {...p} />;
const X = (p) => <Icon name="x" {...p} />;
const Award = (p) => <Icon name="award" {...p} />;
const Pencil = (p) => <Icon name="pencil" {...p} />;
const Trash2 = (p) => <Icon name="trash2" {...p} />;

/* ============ ORIGINAL APP CODE (unchanged below) ============ */

const trades = [
  { id: "electrician", label: "Electrician", icon: Zap },
  { id: "plumber", label: "Plumber", icon: Droplet },
  { id: "tailor", label: "Tailor", icon: Scissors },
  { id: "phone-repair", label: "Phone Repair", icon: Smartphone },
];
const areas = ["All areas", "Main Gate", "Fanuyi", "Odo-Ado", "Ureju"];

const artisans = [
  { id: "a1", name: "Tunde Bakare", trade: "electrician", tradeLabel: "Electrician", area: "Fanuyi", online: true, rating: 4.9, jobs: 34, responseTime: "~12 min", bio: "Wiring, sockets, fan and inverter installs. 5 years fixing lodges around campus.", initials: "TB", color: "#1F3A34" },
  { id: "a2", name: "Blessing Uche", trade: "tailor", tradeLabel: "Tailor", area: "Main Gate", online: true, rating: 5.0, jobs: 51, responseTime: "~30 min", bio: "Asoebi, corper wear, alterations. Keeps your measurements on file so you never repeat yourself.", initials: "BU", color: "#B5651D" },
  { id: "a3", name: "Emeka Obi", trade: "plumber", tradeLabel: "Plumber", area: "Odo-Ado", online: false, rating: 4.7, jobs: 21, responseTime: "~1 hr", bio: "Leaking pipes, blocked drains, tank installs. Comes with his own tools, no delays.", initials: "EO", color: "#2E534B" },
  { id: "a4", name: "Kabiru Sani", trade: "phone-repair", tradeLabel: "Phone Repair", area: "Fanuyi", online: true, rating: 4.8, jobs: 67, responseTime: "~10 min", bio: "Screen, battery, charging port. Fixes while you wait if it's a quick job.", initials: "KS", color: "#1F3A34" },
  { id: "a5", name: "Chidinma Eze", trade: "tailor", tradeLabel: "Tailor", area: "Ureju", online: false, rating: 4.6, jobs: 18, responseTime: "~2 hrs", bio: "Native wears and quick fixes. Affordable rates for students.", initials: "CE", color: "#B5651D" },
  { id: "a6", name: "Ibrahim Musa", trade: "electrician", tradeLabel: "Electrician", area: "Main Gate", online: true, rating: 4.9, jobs: 40, responseTime: "~15 min", bio: "Generator servicing and rewiring. Vetted after three checked jobs on campus.", initials: "IM", color: "#2E534B" },
];

const artisanReplies = ["Sure, I can be there. Let's get it sorted!", "Noted — I'll head over shortly.", "Okay, on it. Will update you once I'm close.", "Got it, thanks for the details."];
const reportReasons = ["Didn't show up", "Poor quality of work", "Overcharged", "Unprofessional conduct", "Other"];

function fmtStars(n) { return n.toFixed(1); }
function timeNow() { return new Date().toLocaleTimeString("en-NG", { hour: "2-digit", minute: "2-digit" }); }
function findArtisan(id) { return artisans.find((a) => a.id === id); }
function sysMsg(text) { return { id: "m" + Date.now() + Math.random(), from: "system", text, time: timeNow() }; }

function App() {
  const [view, setView] = useState("home");
  const [navTab, setNavTab] = useState("home");
  const [selectedId, setSelectedId] = useState(null);
  const [area, setArea] = useState("All areas");
  const [query, setQuery] = useState("");
  const [tradeFilter, setTradeFilter] = useState(null);
  const [activeRequestId, setActiveRequestId] = useState(null);

  const [profile, setProfile] = useState({ name: "Damola", area: "Main Gate" });
  const [artisanApp, setArtisanApp] = useState(null); // {trade,bio,photos,status,online,verified}
  const [incomingJobs, setIncomingJobs] = useState([
    { id: "ij1", studentName: "Bisola A.", job: "Bathroom light not working, need it fixed today", when: "Today", status: "new" },
    { id: "ij2", studentName: "Wale O.", job: "Extension socket sparking near my desk", when: "Tomorrow", status: "new" },
  ]);

  const [requests, setRequests] = useState([]); // {id, artisanId, job, when, status, jobGroupId, createdAt, messages, rating, reviewText}
  const [reports, setReports] = useState([]);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const selected = findArtisan(selectedId);
  const activeRequest = requests.find((r) => r.id === activeRequestId);

  const filtered = useMemo(() => {
    let list = artisans;
    if (area !== "All areas") list = list.filter((a) => a.area === area);
    if (tradeFilter) list = list.filter((a) => a.trade === tradeFilter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter((a) => a.name.toLowerCase().includes(q) || a.tradeLabel.toLowerCase().includes(q));
    }
    return [...list].sort((a, b) => (b.online === a.online ? b.rating - a.rating : b.online - a.online));
  }, [area, tradeFilter, query]);

  const onlineNow = artisans.filter((a) => a.online);

  // open job groups a student can attach a new inquiry to (still comparing)
  const openJobGroups = useMemo(() => {
    const map = new Map();
    requests.forEach((r) => {
      if (["pending", "accepted"].includes(r.status) && !map.has(r.jobGroupId)) {
        map.set(r.jobGroupId, { jobGroupId: r.jobGroupId, job: r.job, when: r.when });
      }
    });
    return [...map.values()];
  }, [requests]);

  function openArtisanProfile(id) { setSelectedId(id); setView("artisanProfile"); }

  function goNav(tab) {
    setNavTab(tab);
    if (tab === "home") setView("home");
    else if (tab === "browse") { setTradeFilter(null); setView("browse"); }
    else if (tab === "requests") setView("requestsList");
    else if (tab === "messages") setView("messagesList");
    else setView("userProfile");
  }

  function sendRequest(artisanId, job, when, jobGroupId) {
    const id = "r" + Date.now();
    const gId = jobGroupId || "g" + Date.now();
    const newReq = { id, artisanId, job, when, status: "pending", jobGroupId: gId, createdAt: timeNow(),
      messages: [{ id: "m" + Date.now(), from: "me", text: job, time: timeNow() }] };
    setRequests((prev) => [newReq, ...prev]);
    setActiveRequestId(id);

    const t = setTimeout(() => {
      setRequests((prev) => prev.map((r) => r.id !== id ? r : {
        ...r, status: "accepted",
        messages: [...r.messages, sysMsg(`${findArtisan(artisanId).name.split(" ")[0]} accepted your request.`),
          { id: "m" + Date.now() + 2, from: "artisan", text: artisanReplies[Math.floor(Math.random() * artisanReplies.length)], time: timeNow() }],
      }));
    }, 2600);
    timers.current.push(t);
    setView("requestSent");
  }

  function sendMessage(requestId, text) {
    setRequests((prev) => prev.map((r) => r.id !== requestId ? r : { ...r, messages: [...r.messages, { id: "m" + Date.now(), from: "me", text, time: timeNow() }] }));
    const t = setTimeout(() => {
      setRequests((prev) => prev.map((r) => r.id !== requestId ? r : { ...r, messages: [...r.messages, { id: "m" + Date.now() + 1, from: "artisan", text: artisanReplies[Math.floor(Math.random() * artisanReplies.length)], time: timeNow() }] }));
    }, 1300);
    timers.current.push(t);
  }

  function confirmRequest(requestId) {
    setRequests((prev) => {
      const target = prev.find((r) => r.id === requestId);
      const gId = target.jobGroupId;
      return prev.map((r) => {
        if (r.id === requestId) return { ...r, status: "confirmed", messages: [...r.messages, sysMsg("Booking confirmed.")] };
        if (r.jobGroupId === gId && r.id !== requestId && !["completed", "declined", "closed"].includes(r.status)) {
          return { ...r, status: "closed", messages: [...r.messages, sysMsg("The student confirmed with another artisan for this job.")] };
        }
        return r;
      });
    });
  }

  function completeRequest(requestId, rating, reviewText, hasPhotos) {
    setRequests((prev) => prev.map((r) => r.id !== requestId ? r : {
      ...r, status: "completed", rating, reviewText, hasPhotos,
      messages: [...r.messages, sysMsg(`Job marked complete · rated ${rating}★`)],
    }));
  }

  function reportRequest(requestId, reason, note) {
    const r = requests.find((x) => x.id === requestId);
    setReports((prev) => [...prev, { id: "rep" + Date.now(), requestId, artisanId: r.artisanId, reason, note, time: timeNow() }]);
    setRequests((prev) => prev.map((x) => x.id !== requestId ? x : { ...x, messages: [...x.messages, sysMsg(`Reported to VettedHands: ${reason}. Our team will review.`)] }));
  }

  function openConversation(requestId) { setActiveRequestId(requestId); setView("conversation"); }

  return (
    <div className="app">
      <Style />
      <div className="phone">
        <div className="content">
          {view === "home" && (
            <HomeView area={area} setArea={setArea} query={query} setQuery={setQuery}
              onlineNow={onlineNow} filtered={filtered} onOpenProfile={openArtisanProfile}
              onPickTrade={(id) => { setTradeFilter(id); setView("browse"); setNavTab("browse"); }}
              onSeeAll={() => { setTradeFilter(null); setView("browse"); setNavTab("browse"); }} />
          )}
          {view === "browse" && (
            <BrowseView query={query} setQuery={setQuery} tradeFilter={tradeFilter} setTradeFilter={setTradeFilter}
              area={area} setArea={setArea} filtered={filtered}
              onBack={() => { setView("home"); setNavTab("home"); }} onOpenProfile={openArtisanProfile} />
          )}
          {view === "artisanProfile" && selected && (
            <ArtisanProfileView artisan={selected} onBack={() => setView(navTab === "browse" ? "browse" : "home")} onRequest={() => setView("request")} />
          )}
          {view === "request" && selected && (
            <RequestView artisan={selected} openJobGroups={openJobGroups} onBack={() => setView("artisanProfile")}
              onSend={(job, when, gId) => sendRequest(selected.id, job, when, gId)} />
          )}
          {view === "requestSent" && activeRequest && (
            <RequestSentView artisan={findArtisan(activeRequest.artisanId)} onDone={() => { setView("home"); setNavTab("home"); }} onMessage={() => setView("conversation")} />
          )}
          {view === "requestsList" && <RequestsListView requests={requests} onOpen={openConversation} />}
          {view === "messagesList" && <MessagesListView requests={requests} onOpen={openConversation} />}
          {view === "conversation" && activeRequest && (
            <ConversationView request={activeRequest} artisan={findArtisan(activeRequest.artisanId)}
              onBack={() => setView(navTab === "messages" ? "messagesList" : navTab === "requests" ? "requestsList" : "home")}
              onSend={(text) => sendMessage(activeRequest.id, text)}
              onConfirm={() => confirmRequest(activeRequest.id)}
              onComplete={(rating, review, photos) => completeRequest(activeRequest.id, rating, review, photos)}
              onReport={(reason, note) => reportRequest(activeRequest.id, reason, note)} />
          )}
          {view === "userProfile" && (
            <UserProfileView profile={profile} setProfile={setProfile} requests={requests}
              artisanApp={artisanApp} setArtisanApp={setArtisanApp} incomingJobs={incomingJobs}
              onViewJobs={() => setView("artisanJobs")} onBrowse={() => goNav("browse")} />
          )}
          {view === "artisanJobs" && (
            <ArtisanJobsView jobs={incomingJobs}
              onRespond={(id, status) => setIncomingJobs((prev) => prev.map((j) => j.id === id ? { ...j, status } : j))}
              onBack={() => setView("userProfile")} />
          )}
        </div>
        <BottomNav active={navTab} onChange={goNav} requestCount={requests.filter((r) => r.status === "pending" || r.status === "accepted").length} />
      </div>
    </div>
  );
}

/* ---------------- Home ---------------- */
function HomeView({ area, setArea, query, setQuery, onlineNow, filtered, onOpenProfile, onPickTrade, onSeeAll }) {
  return (
    <div className="screen">
      <div className="topbar">
        <div className="brand"><span className="brand-mark"><CheckCircle2 size={16} /></span><span className="brand-name">VettedHands</span></div>
        <div className="topbar-icons"><button className="iconbtn"><Bell size={18} /></button><div className="avatar avatar--sm">D</div></div>
      </div>
      <div className="searchbar"><Search size={16} /><input placeholder="Search a trade or name…" value={query} onChange={(e) => setQuery(e.target.value)} /></div>
      <div className="area-row"><MapPin size={13} /><select value={area} onChange={(e) => setArea(e.target.value)}>{areas.map((a) => <option key={a} value={a}>{a}</option>)}</select></div>
      <div className="section">
        <div className="section-head"><span>Online now</span></div>
        <div className="status-row">
          {onlineNow.map((a) => (
            <button key={a.id} className="status-item" onClick={() => onOpenProfile(a.id)}>
              <div className="status-ring"><div className="avatar avatar--md" style={{ background: a.color }}>{a.initials}</div></div>
              <div className="status-name">{a.name.split(" ")[0]}</div>
            </button>
          ))}
        </div>
      </div>
      <div className="section">
        <div className="section-head"><span>Browse a trade</span></div>
        <div className="trade-grid">
          {trades.map((t) => { const Icon2 = t.icon; return (
            <button key={t.id} className="trade-tile" onClick={() => onPickTrade(t.id)}><span className="trade-icon"><Icon2 size={18} /></span>{t.label}</button>
          ); })}
        </div>
      </div>
      <div className="section section--flush">
        <div className="section-head"><span>Top vetted near you</span><button className="see-all" onClick={onSeeAll}>See all <ChevronRight size={14} /></button></div>
        <div className="feed">{filtered.slice(0, 4).map((a) => <ArtisanCard key={a.id} artisan={a} onOpen={() => onOpenProfile(a.id)} />)}</div>
      </div>
    </div>
  );
}

/* ---------------- Browse ---------------- */
function BrowseView({ query, setQuery, tradeFilter, setTradeFilter, area, setArea, filtered, onBack, onOpenProfile }) {
  return (
    <div className="screen">
      <div className="topbar"><button className="iconbtn" onClick={onBack}><ArrowLeft size={18} /></button><div className="topbar-title">Browse artisans</div><div style={{ width: 34 }} /></div>
      <div className="searchbar"><Search size={16} /><input placeholder="Search a trade or name…" value={query} onChange={(e) => setQuery(e.target.value)} /></div>
      <div className="chip-row">
        <button className={"chip" + (!tradeFilter ? " chip--active" : "")} onClick={() => setTradeFilter(null)}>All trades</button>
        {trades.map((t) => <button key={t.id} className={"chip" + (tradeFilter === t.id ? " chip--active" : "")} onClick={() => setTradeFilter(t.id)}>{t.label}</button>)}
      </div>
      <div className="area-row area-row--pad"><MapPin size={13} /><select value={area} onChange={(e) => setArea(e.target.value)}>{areas.map((a) => <option key={a} value={a}>{a}</option>)}</select></div>
      <div className="feed feed--scroll">
        {filtered.length === 0 && <div className="empty"><div className="empty-title">No one matches yet</div><div className="empty-sub">Try a different area or trade.</div></div>}
        {filtered.map((a) => <ArtisanCard key={a.id} artisan={a} onOpen={() => onOpenProfile(a.id)} />)}
      </div>
    </div>
  );
}

function ArtisanCard({ artisan, onOpen }) {
  return (
    <button className="acard" onClick={onOpen}>
      <div className="acard-avatar-wrap"><div className="avatar avatar--md" style={{ background: artisan.color }}>{artisan.initials}</div><span className={"dot " + (artisan.online ? "dot--online" : "dot--offline")} /></div>

/* ---------------- Request (with job-group attach) ---------------- */
function RequestView({ artisan, openJobGroups, onBack, onSend }) {
  const [mode, setMode] = useState("new"); // "new" | jobGroupId
  const [job, setJob] = useState("");
  const [when, setWhen] = useState("");
  const attaching = mode !== "new";
  const attachedGroup = attaching ? openJobGroups.find((g) => g.jobGroupId === mode) : null;
  const valid = attaching ? true : job.trim() && when;

  return (
    <div className="screen">
      <div className="topbar"><button className="iconbtn" onClick={onBack}><ArrowLeft size={18} /></button><div className="topbar-title">Request · {artisan.name.split(" ")[0]}</div><div style={{ width: 34 }} /></div>
      <div className="form">
        {openJobGroups.length > 0 && (
          <label>Is this for a job you're already comparing quotes on?
            <select value={mode} onChange={(e) => setMode(e.target.value)}>
              <option value="new">No — this is a new job</option>
              {openJobGroups.map((g) => <option key={g.jobGroupId} value={g.jobGroupId}>Same as: "{g.job.slice(0, 34)}{g.job.length > 34 ? "…" : ""}"</option>)}
            </select>
          </label>
        )}

        {attaching ? (
          <div className="info-note">Comparing {artisan.name.split(" ")[0]} against your other request for: <strong>"{attachedGroup.job}"</strong> ({attachedGroup.when}). The moment you confirm one artisan, the others for this same job close automatically.</div>
        ) : (
          <>
            <label>What do you need done?<textarea rows={3} value={job} onChange={(e) => setJob(e.target.value)} placeholder="e.g. Fan not turning on, socket in room sparking" /></label>
            <label>When<select value={when} onChange={(e) => setWhen(e.target.value)}><option value="">Select a time</option><option value="As soon as possible">As soon as possible</option><option value="Later today">Later today</option><option value="Tomorrow">Tomorrow</option><option value="This week">This week</option></select></label>
          </>
        )}
        <div className="info-note">{artisan.name.split(" ")[0]} will accept or decline this request. Nothing is booked until you confirm — you're free to also check other online artisans in the meantime.</div>
      </div>
      <button className="primary-btn primary-btn--fixed" disabled={!valid}
        onClick={() => valid && onSend(attaching ? attachedGroup.job : job.trim(), attaching ? attachedGroup.when : when, attaching ? attachedGroup.jobGroupId : null)}>
        Send request
      </button>
    </div>
  );
}

function RequestSentView({ artisan, onDone, onMessage }) {

/* ---------------- Requests tab ---------------- */
function statusMeta(status) {
  if (status === "pending") return { label: "Pending", cls: "badge--pending" };
  if (status === "accepted") return { label: "Accepted", cls: "badge--accepted" };
  if (status === "confirmed") return { label: "Confirmed", cls: "badge--confirmed" };
  if (status === "completed") return { label: "Completed", cls: "badge--completed" };
  if (status === "closed") return { label: "Closed", cls: "badge--closed" };
  return { label: "Declined", cls: "badge--declined" };
}

function RequestsListView({ requests, onOpen }) {
  return (

        {requests.length === 0 && <div className="empty"><div className="empty-title">No requests yet</div><div className="empty-sub">When you request an artisan, it'll show up here.</div></div>}
        {requests.map((r) => {
          const a = findArtisan(r.artisanId);
          const meta = statusMeta(r.status);
          return (
            <button key={r.id} className="req-card" onClick={() => onOpen(r.id)}>
              <div className="avatar avatar--md" style={{ background: a.color }}>{a.initials}</div>
              <div className="req-main">
                <div className="req-top"><span className="req-name">{a.name}</span><span className={"status-badge " + meta.cls}>{meta.label}</span></div>
                <div className="req-job">{r.job}</div>
                <div className="req-when">{r.when} · {r.createdAt}</div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- Messages tab ---------------- */
function MessagesListView({ requests, onOpen }) {

/* ---------------- Conversation (confirm / complete / report) ---------------- */
function ConversationView({ request, artisan, onBack, onSend, onConfirm, onComplete, onReport }) {
  const [text, setText] = useState("");
  const [confirming, setConfirming] = useState(false);
  const [showComplete, setShowComplete] = useState(false);
  const [showReport, setShowReport] = useState(false);
  const bottomRef = useRef(null);
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [request.messages.length]);
  const meta = statusMeta(request.status);
  const canAct = !["completed", "declined", "closed"].includes(request.status);

  return (
    <div className="screen">
      <div className="topbar">
        <button className="iconbtn" onClick={onBack}><ArrowLeft size={18} /></button>
        <div className="topbar-title">{artisan.name}</div>
        <div className="avatar avatar--sm" style={{ background: artisan.color }}>{artisan.initials}</div>
      </div>
      <div className="convo-status"><span className={"status-badge " + meta.cls}>{meta.label}</span><span className="convo-job">{request.job}</span></div>

      <div className="convo-messages">
        {request.messages.map((m) => (
          <div key={m.id} className={"bubble-row " + (m.from === "me" ? "bubble-row--me" : m.from === "system" ? "bubble-row--sys" : "bubble-row--them")}>
            {m.from === "system" ? <div className="bubble-sys">{m.text}</div> : <div className={"bubble " + (m.from === "me" ? "bubble--me" : "bubble--them")}>{m.text}<span className="bubble-time">{m.time}</span></div>}
          </div>
        ))}
        {request.status === "completed" && request.rating && (
          <div className="review-recap"><Star size={13} fill="#B5651D" stroke="none" /> You rated this job {request.rating}★ {request.reviewText && `— "${request.reviewText}"`}</div>
        )}
        <div ref={bottomRef} />
      </div>

      {canAct && request.status === "accepted" && !confirming && (
        <button className="action-btn" onClick={() => setConfirming(true)}>Confirm booking with {artisan.name.split(" ")[0]}</button>
      )}
      {confirming && (
        <div className="inline-confirm">
          <div className="inline-confirm-text">This closes any other pending requests you sent for this same job. Confirm?</div>
          <div className="settle-actions">
            <button className="ghost-btn" onClick={() => setConfirming(false)}>Cancel</button>
            <button className="settle-btn" onClick={() => { onConfirm(); setConfirming(false); }}>Yes, confirm</button>
          </div>
        </div>
      )}

      {canAct && request.status === "confirmed" && !showComplete && (
        <button className="action-btn" onClick={() => setShowComplete(true)}>Mark job complete &amp; rate</button>
      )}
      {showComplete && <CompletionForm onCancel={() => setShowComplete(false)} onSubmit={(r, t, p) => { onComplete(r, t, p); setShowComplete(false); }} />}

      {canAct && !showReport && (
        <button className="report-link" onClick={() => setShowReport(true)}><Flag size={13} /> Report a problem</button>
      )}
      {showReport && <ReportForm onCancel={() => setShowReport(false)} onSubmit={(reason, note) => { onReport(reason, note); setShowReport(false); }} />}

      {request.status === "closed" && <div className="info-note" style={{ margin: "0 16px 10px" }}>This request closed because you confirmed a different artisan for this job.</div>}

      <form className="convo-input" onSubmit={(e) => { e.preventDefault(); if (text.trim()) { onSend(text.trim()); setText(""); } }}>
        <input placeholder="Type a message…" value={text} onChange={(e) => setText(e.target.value)} />
        <button type="submit" className="send-btn"><Send size={16} /></button>
      </form>
    </div>
  );
}

function CompletionForm({ onCancel, onSubmit }) {

          <div className="stat"><div className="stat-num">{completed}</div><div className="stat-label">Completed</div></div>

                  <button className="ghost-btn" onClick={() => setConfirmingVerify(false)}>Cancel</button>
                  <button className="settle-btn" onClick={() => { setArtisanApp((a) => ({ ...a, verified: true })); setConfirmingVerify(false); }}>Simulate: subscribe</button>

              </div>

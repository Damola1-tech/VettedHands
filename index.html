/* ============ API HELPER ============ */
// Talks to the real backend. Throws an Error with a readable message on failure.
async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  let res, data = null;
  const attempts = method === "GET" ? 3 : 1;
  for (let i = 0; i < attempts; i++) {
    try {
      res = await fetch(`${API_BASE}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
    } catch (e) {
      if (i === attempts - 1) throw new Error("No connection. Check your network and try again.");
      await new Promise((r) => setTimeout(r, 1500));
      continue;
    }
    data = null;
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok && res.status >= 500 && i < attempts - 1) { await new Promise((r) => setTimeout(r, 1500)); continue; }
    break;
  }
  if (!res.ok) {
    const raw = (data && data.error) || "";
    if (/prisma|database server|invocation/i.test(raw)) throw new Error("Waking up the server. Please try again in a few seconds.");
    throw new Error(raw || `Request failed (${res.status})`);
  }
  return data;
}

/* ============ AUTH ============ */
function useAuth() {
  const [token, setToken] = useState(() => localStorage.getItem("vh_token") || null);
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(!!token);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!token) { setLoading(false); return; }
    api("/api/auth/me", { token })
      .then((d) => setUser(d.user))
      .catch(() => { localStorage.removeItem("vh_token"); setToken(null); })
      .finally(() => setLoading(false));
  }, [token]);

  async function login(email, password) {
    setError(null);
    const d = await api("/api/auth/login", { method: "POST", body: { email, password } });
    localStorage.setItem("vh_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  async function register(name, email, password, area) {
    setError(null);
    const d = await api("/api/auth/register", { method: "POST", body: { name, email, password, area } });
    localStorage.setItem("vh_token", d.token);
    setToken(d.token);
    setUser(d.user);
  }
  function logout() {
    localStorage.removeItem("vh_token");
    setToken(null);
    setUser(null);
  }
  return { token, user, setUser, loading, error, login, register, logout };
}

function AuthScreen({ initialMode, onBack, onLogin, onRegister }) {
  const [mode, setMode] = useState(initialMode || "login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [area, setArea] = useState(areas[1]);
  const [agree, setAgree] = useState(true);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setErr(null); setBusy(true);
    try {
      if (mode === "login") await onLogin(email.trim(), password);
      else await onRegister(name.trim(), email.trim(), password, area);
    } catch (ex) {
      setErr(ex.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="auth">
      <div className="auth-inner">
        <div className="auth-top">
          <button className="auth-back" onClick={onBack} aria-label="Back"><ArrowLeft size={20} /></button>
          <span className="landing-mark landing-mark--sm"><ShieldCheck size={16} /></span>
          <span className="auth-brand">VettedHands</span>
        </div>
        <h1 className="auth-h1">{mode === "register" ? <>Find skilled people.<br />Hire with confidence.</> : "Welcome back."}</h1>
        <p className="auth-sub">{mode === "register" ? "Create your account in under a minute. No payment needed." : "Sign in to track your requests and jobs."}</p>
        <div className="seg">
          <button type="button" className={"seg-btn" + (mode === "register" ? " seg-btn--on" : "")} onClick={() => setMode("register")}>Create account</button>
          <button type="button" className={"seg-btn" + (mode === "login" ? " seg-btn--on" : "")} onClick={() => setMode("login")}>Sign in</button>
        </div>
        <form className="auth-form" onSubmit={submit}>
          {mode === "register" && (
            <label>Full name<input required value={name} onChange={(e) => setName(e.target.value)} placeholder="Your name" /></label>
          )}
          <label>Email<input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" /></label>
          <label>Password<input required type="password" minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="At least 6 characters" /></label>
          {mode === "register" && (
            <label>Where are you? <span style={{ fontWeight: 500, color: "var(--ink-soft)" }}>(optional)</span><select value={area} onChange={(e) => setArea(e.target.value)}>{areas.filter((a) => a !== "All areas").map((a) => <option key={a}>{a}</option>)}</select></label>
          )}

            <label className="auth-agree"><input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} /><span>I agree to the Terms of Use and Privacy Policy.</span></label>
          )}

          <button className="auth-submit" disabled={busy || (mode === "register" && !agree)}>{busy ? "Please wait…" : mode === "login" ? "Sign in" : "Create account"}</button>
        </form>
        {mode === "register" && (
          <div className="auth-note"><UserIcon size={20} /><span>Everyone starts as a customer. Have a trade? You can apply to become a vetted artisan from your profile.</span></div>
        )}
      </div>
    </div>
  );
}

function App() {
  const auth = useAuth();
  const [screen, setScreen] = useState("landing"); // landing | auth
  const [authMode, setAuthMode] = useState("register");
  const [intent, setIntent] = useState(null); // "request" | "artisan" | null

  useEffect(() => { if (!auth.token) setScreen("landing"); }, [auth.token]);

  let body;
  if (auth.loading) {
    body = <div className="screen screen--center">Loading…</div>;
  } else if (!auth.token || !auth.user) {
    body = screen === "auth"
      ? <AuthScreen initialMode={authMode} onBack={() => setScreen("landing")} onLogin={auth.login} onRegister={auth.register} />
      : <Landing
          onSignIn={() => { setIntent(null); setAuthMode("login"); setScreen("auth"); }}
          onStart={(i) => { setIntent(i); setAuthMode("register"); setScreen("auth"); }} />;
  } else {
    body = <MainApp auth={auth} intent={intent} />;
  }

  return (
    <div className="app">
      <Style />
      <div className="phone">{body}</div>
    </div>
  );
}

  const [openGroups, setOpenGroups] = useState([]);
  const [messages, setMessages] = useState([]);
  const [application, setApplication] = useState(null);
  const [requestImage, setRequestImage] = useState(null);
  const [myReviews, setMyReviews] = useState([]);
  const [profileOrigin, setProfileOrigin] = useState("home"); // where artisanProfile's back button returns to
  const blankWiz = { step: 1, trade: null, problem: "", area: user.area && areas.includes(user.area) ? user.area : areas[1], when: "asap", whenDate: "", image: null, results: [], loading: false, searched: false, sort: "best" };
  const [wiz, setWiz] = useState(blankWiz);

  function flash(msg) { setToast(msg); setTimeout(() => setToast(null), 2400); }
  const lastFail = useRef({ msg: "", at: 0 });
  function fail(err) {
    const msg = err.message || "Something went wrong";
    const now = Date.now();
    if (lastFail.current.msg === msg && now - lastFail.current.at < 30000) return;
    lastFail.current = { msg, at: now };
    flash(msg);
  }

  async function loadArtisans() {
    try {
      const qs = new URLSearchParams();
      if (tradeFilter) qs.set("trade", tradeFilter);
      if (area !== "All areas") qs.set("area", area);
      if (query.trim()) qs.set("q", query.trim());
      const d = await api(`/api/artisans?${qs.toString()}`);
      setArtisans(d.artisans);
    } catch (e) { fail(e); }
  }
  async function loadRequests() {
    try {
      if (isArtisan) {
        const [incomingRes, mineRes] = await Promise.all([
          api("/api/requests/incoming", { token }),
          api("/api/requests/mine", { token }),
        ]);
        const merged = [...incomingRes.requests, ...mineRes.requests]
          .filter((r, i, arr) => arr.findIndex((x) => x.id === r.id) === i)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        setRequests(merged);
      } else {
        const d = await api("/api/requests/mine", { token });
        setRequests(d.requests);
      }
    } catch (e) { fail(e); }
  }
  async function loadOpenGroups() {
    try { const d = await api("/api/requests/open-groups", { token }); setOpenGroups(d.groups); } catch (e) { /* ignore */ }
  }
  async function loadApplication() {
    if (isArtisan || isAdmin) return;
    try { const d = await api("/api/applications/me", { token }); setApplication(d.application); }
    catch (e) { setApplication(null); }
  }

  useEffect(() => { loadArtisans(); }, [tradeFilter, area, query]);
  useEffect(() => { loadRequests(); loadOpenGroups(); loadApplication(); }, []);
  useEffect(() => {
    if (!isArtisan) return;
    api("/api/artisans/me/reviews", { token }).then((d) => setMyReviews(d.reviews)).catch(() => {});
  }, [isArtisan]);
  // Background refresh of requests every 8s so the nav badge count and requests/messages
  // lists stay roughly current even when the user isn't actively viewing a conversation.
  useEffect(() => {
    const id = setInterval(() => { if (!document.hidden) loadRequests(); }, 15000);
    return () => clearInterval(id);
  }, []);

  // Applicants: check the application every 20s. When it is approved, reload the account so the artisan app appears without logging out.
  useEffect(() => {
    if (isArtisan || isAdmin) return;
    const id = setInterval(async () => {
      try {
        const d = await api("/api/applications/me", { token });
        setApplication(d.application);
        if (d.application && d.application.status === "APPROVED") {
          const me = await api("/api/auth/me", { token });
          if (me.user.role === "ARTISAN") setUser(me.user);
        }
      } catch (e) { /* silent */ }
    }, 20000);
    return () => clearInterval(id);
  }, [isArtisan]);
  // Artisans: one-time welcome, and reload the profile numbers whenever a job completes.
  const myDoneCount = requests.filter((r) => r.status === "COMPLETED" && r.artisanProfile && r.artisanProfile.user.id === user.id).length;
  useEffect(() => {
    if (!isArtisan) return;
    api("/api/auth/me", { token }).then((d) => setUser(d.user)).catch(() => {});
  }, [isArtisan, myDoneCount]);
  useEffect(() => {
    if (!isArtisan) return;
    const key = "vh_welcomed_" + user.id;
    if (!localStorage.getItem(key)) { localStorage.setItem(key, "1"); setView("welcome"); setNavTab("home"); }
  }, [isArtisan]);

  const onlineNow = artisans.filter((a) => a.online);
  const activeRequest = requests.find((r) => r.id === activeRequestId);
  const notifications = useMemo(() => buildNotifications(requests, user), [requests, user.id]);
  const unreadNotifs = notifications.filter((n) => notifUnread(n, readIds)).length;
  const unreadMessages = requests.reduce((n, r) => n + (r.unreadCount || 0), 0);
  function markRead(ids) {
    setReadIds((prev) => {
      const next = [...new Set([...prev, ...ids])].slice(-300);
      try { localStorage.setItem("vh_notif_read_" + user.id, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }

  async function openArtisanProfile(a, origin = "home") {
    setProfileOrigin(origin);
    setSelectedArtisan(a);
    setView("artisanProfile");
    // Reviews load first — small and fast. Photos load after, since base64 data
    // URLs are large; this keeps the profile feeling instant instead of blocking
    // on the heaviest part of the payload.
    try { const d = await api(`/api/artisans/${a.id}`); setSelectedArtisan(d.artisan); } catch (e) { /* keep list version */ }
    try {
      const p = await api(`/api/artisans/${a.id}/photos`);
      setSelectedArtisan((prev) => (prev && prev.id === a.id ? { ...prev, photos: p.photos } : prev));
    } catch (e) { /* photos just won't show */ }
  }
  function goNav(tab) {
    setApplyOpen(false);
    setNavTab(tab === "browse" ? "home" : tab);
    if (tab === "home") setView("home");
    else if (tab === "browse") { setTradeFilter(null); setView("browse"); }
    else if (tab === "requests") { loadRequests(); setView("requestsList"); }
    else if (tab === "messages") { loadRequests(); setView("messagesList"); }
    else setView("userProfile");
  }

  async function sendRequest(artisanProfileId, job, when, jobGroupId, image, reqArea) {
    try {
      const d = await api("/api/requests", { method: "POST", token, body: { artisanProfileId, job, when, jobGroupId: jobGroupId || undefined, image: image || undefined, area: reqArea || undefined } });
      setRequests((prev) => [d.request, ...prev]);
      setActiveRequestId(d.request.id);
      setWiz({ ...blankWiz });
      setTrackFrom("home");
      setView("track");
    } catch (e) { fail(e); }
  }
  async function requestFromProfile() {
    if (profileOrigin === "wizard" && wiz.problem.trim().length >= 10) {
      await sendRequest(selectedArtisan.id, wiz.problem.trim(), whenText(wiz), null, wiz.image, wiz.area);
    } else {
      setWiz({ ...blankWiz, trade: selectedArtisan.trade, direct: selectedArtisan });
      setView("wizard");
    }
  }
  function openTrack(requestId, from = null) {
    setTrackFrom(from);
    setActiveRequestId(requestId);
    setView("track");
  }
  async function openConversation(requestId, from = null) {
    setConvoFrom(from);
    setActiveRequestId(requestId);
    setView("conversation");
    setOtherReadAt(null);
    setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, unreadCount: 0 } : r)));
    try { const d = await api(`/api/requests/${requestId}/messages`, { token }); setMessages(d.messages); setOtherReadAt(d.otherReadAt || null); } catch (e) { fail(e); }
    const req = requests.find((r) => r.id === requestId);
    if (req && req.hasImage) {
      setRequestImage("loading");
      try { const img = await api(`/api/requests/${requestId}/image`, { token }); setRequestImage(img.imageUrl); } catch (e) { setRequestImage(null); }
    } else {
      setRequestImage(null);
    }
  }
  // Silent background refresh — no toast/flash on failure, since this fires every
  // few seconds and a transient network blip shouldn't spam the user.
    async function pollConversation(requestId) {
    if (document.hidden) return;
    try {
      const msgRes = await api(`/api/requests/${requestId}/messages`, { token });
      setMessages(msgRes.messages);
      setOtherReadAt(msgRes.otherReadAt || null);
      setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, unreadCount: 0 } : r)));
    } catch (e) { /* silent */ }
  }
  async function sendMessage(requestId, text) {
    try {
      const d = await api(`/api/requests/${requestId}/messages`, { method: "POST", token, body: { text } });
      setMessages((prev) => [...prev, d.message]);
      setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, lastMessage: d.message } : r)));
    } catch (e) { fail(e); }
  }
  async function sendVoiceMessage(requestId, audio, audioSecs) {
    try {
      const d = await api(`/api/requests/${requestId}/messages`, { method: "POST", token, body: { audio, audioSecs } });
      setMessages((prev) => [...prev, d.message]);
      setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, lastMessage: { ...d.message, audio: undefined } } : r)));
    } catch (e) { fail(e); }
  }
  async function respondToRequest(requestId, status) {
    try {
      const d = await api(`/api/requests/${requestId}/status`, { method: "PATCH", token, body: { status } });
      setRequests((prev) => prev.map((r) => (r.id === requestId ? d.request : r)));
    } catch (e) { fail(e); }
  }
  async function confirmRequest(requestId) {
    try {
      const d = await api(`/api/requests/${requestId}/confirm`, { method: "PATCH", token });
      await loadRequests();
      setMessages((prev) => [...prev]);
      flash("Booking confirmed");
      return d;
    } catch (e) { fail(e); }
  }
  async function completeRequest(requestId, rating, reviewText) {
    try {
      const d = await api(`/api/requests/${requestId}/complete`, { method: "PATCH", token, body: { rating, reviewText } });
      setRequests((prev) => prev.map((r) => (r.id === requestId ? d.request : r)));
      flash("Job marked complete");
      return true;
    } catch (e) { fail(e); }
  }
  async function jobAction(requestId, action) {
    try {
      const d = await api(`/api/requests/${requestId}/${action}`, { method: "PATCH", token });
      setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, ...d.request } : r)));
      flash(action === "start" ? "Job started" : "Marked done. Waiting for the customer to confirm");
      return true;
    } catch (e) { fail(e); }
  }
  async function reportRequest(requestId, reason, note) {
    try {
      await api(`/api/requests/${requestId}/report`, { method: "POST", token, body: { reason, note } });
      flash("Reported to VettedHands");
      return true;
    } catch (e) { fail(e); }
  }
  async function toggleOnline(next) {
    try {
      const d = await api("/api/artisans/me/online", { method: "PATCH", token, body: { online: next } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, online: d.artisan.online } }));
      flash(next ? "You're online" : "You're offline");
      return d.artisan;
    } catch (e) { fail(e); }
  }
  async function setBadge(badge) {
    try {
      const d = await api("/api/artisans/me/badge", { method: "PATCH", token, body: { badge } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, badge: d.artisan.badge } }));
      flash(badge === "TOP_RATED" ? "You're now Top Rated!" : "Badge updated");
    } catch (e) { fail(e); }
  }
  async function applyAsArtisan(trade, bio, photos, phone, socialHandle, idDocument) {
    try {
      const d = await api("/api/applications", { method: "POST", token, body: { trade, bio, photos: photos || [], phone, socialHandle: socialHandle || undefined, idDocument } });
      setApplication(d.application);
      flash("Application submitted for review");
      setApplyOpen(false);
    } catch (e) { fail(e); }
  }
  async function addArtisanPhoto(url) {
    try {
      const d = await api("/api/artisans/me/photos", { method: "POST", token, body: { url } });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, photos: [...(u.artisanProfile.photos || []), d.photo] } }));
    } catch (e) { fail(e); }
  }
  async function removeArtisanPhoto(photoId) {
    try {
      await api(`/api/artisans/me/photos/${photoId}`, { method: "DELETE", token });
      setUser((u) => ({ ...u, artisanProfile: { ...u.artisanProfile, photos: u.artisanProfile.photos.filter((p) => p.id !== photoId) } }));
    } catch (e) { fail(e); }
  }

  return (
    <>
      <div className="content">
        {view === "welcome" && isArtisan && user.artisanProfile && (
          <VettedWelcome user={user} onOpen={() => { setView("home"); setNavTab("home"); }} />
        )}
        {view === "help" && (
          <HelpView onBack={() => setView("userProfile")} onReport={() => goNav("requests")} />
        )}
        {view === "trackRecord" && isArtisan && user.artisanProfile && (
          <TrackRecordView user={user} requests={requests} myReviews={myReviews} onBack={() => setView("userProfile")} />
        )}
        {view === "home" && isArtisan && user.artisanProfile && (
          <ArtisanHome user={user} requests={requests} myReviews={myReviews}
            onToggleOnline={toggleOnline} onOpenNotifs={() => setView("notifications")} hasAlerts={unreadNotifs > 0}
            onOpenMe={() => goNav("profile")} onRespond={respondToRequest}
            onOpenTrack={(id) => openTrack(id)} onOpenRequests={() => goNav("requests")} />
        )}
        {view === "home" && !(isArtisan && user.artisanProfile) && (
          <HomeView user={user} isArtisan={isArtisan} area={area} setArea={setArea} query={query} setQuery={setQuery}
            requests={requests} myReviews={myReviews}
            onlineNow={onlineNow} filtered={artisans} onOpenProfile={(a) => openArtisanProfile(a, "home")}
            onPickTrade={(id) => { setWiz({ ...blankWiz, trade: id }); setView("wizard"); }}
            onSeeAll={() => { setTradeFilter(null); setView("browse"); setNavTab("home"); }}
            onOpenWizard={() => { setWiz({ ...blankWiz }); setView("wizard"); }}
            onOpenRequests={() => setView("notifications")}
            onOpenMe={() => goNav("profile")}
            hasAlerts={unreadNotifs > 0}
            flash={flash}
            onLogout={logout} />
        )}
        {view === "wizard" && (
          <RequestFlow wiz={wiz} setWiz={setWiz} meId={user.id}
            onBack={() => { if (wiz.direct) { setView("artisanProfile"); } else { setView("home"); setNavTab("home"); setWiz({ ...blankWiz }); } }}
            onSendDirect={() => sendRequest(wiz.direct.id, wiz.problem.trim(), whenText(wiz), null, wiz.image, wiz.area)}
            onSelectArtisan={(a) => openArtisanProfile(a, "wizard")} />
        )}
        {view === "browse" && (
          <BrowseView query={query} setQuery={setQuery} tradeFilter={tradeFilter} setTradeFilter={setTradeFilter}
            area={area} setArea={setArea} filtered={artisans}
            onBack={() => { setTradeFilter(null); setView("home"); setNavTab("home"); }} onOpenProfile={(a) => openArtisanProfile(a, "browse")} />
        )}
        {view === "artisanProfile" && selectedArtisan && (
          <ArtisanProfileView artisan={selectedArtisan} canRequest={selectedArtisan.user.id !== user.id}
            summary={profileOrigin === "wizard" && wiz.problem.trim().length >= 10 ? `${tradeLabel(wiz.trade)} · ${whenText(wiz)} · ${wiz.area}` : null}
            onBack={() => {
              if (profileOrigin === "wizard") setView("wizard");
              else if (profileOrigin === "browse") setView("browse");
              else setView("home");
            }}
            onRequest={requestFromProfile} />
        )}
        {view === "request" && selectedArtisan && (
          <RequestView artisan={selectedArtisan} openJobGroups={openGroups} initialJob={prefillJob} onBack={() => setView("artisanProfile")}
            onSend={(job, when, gId, image) => { sendRequest(selectedArtisan.id, job, when, gId, image); setPrefillJob(""); }} />
        )}
        {view === "requestSent" && activeRequest && (
          <RequestSentView artisan={activeRequest.artisanProfile} onDone={() => { setView("home"); setNavTab("home"); }} onMessage={() => openConversation(activeRequest.id)} />
        )}
        {view === "requestsList" && (
          <RequestsListView requests={requests} user={user} onOpen={(id) => openTrack(id)}
            onRequestService={() => { setWiz({ ...blankWiz }); setView("wizard"); }}
            onCheckAvailability={() => goNav("home")}
            onJob={jobAction}
            onRespond={respondToRequest} />
        )}
        {view === "track" && activeRequest && (
          <TrackView request={activeRequest} user={user}
            onBack={() => setView(trackFrom === "notifications" ? "notifications" : trackFrom === "home" ? "home" : "requestsList")}
            onMessage={() => openConversation(activeRequest.id, "track")}
            onConfirm={() => confirmRequest(activeRequest.id)}
            onRespond={(status) => respondToRequest(activeRequest.id, status)}
            onReview={() => setView("review")}
            onStart={() => jobAction(activeRequest.id, "start")}
            onDone={() => jobAction(activeRequest.id, "done")}
            onReport={() => setView("report")} />
        )}
        {view === "review" && activeRequest && (
          <ReviewView request={activeRequest}
            onClose={() => setView("track")}
            onSubmit={async (rating, text) => { const ok = await completeRequest(activeRequest.id, rating, text); if (ok) setView("track"); }} />
        )}
        {view === "report" && activeRequest && (
          <ReportView request={activeRequest} user={user}
            onClose={() => setView("track")}
            onSubmit={async (reason, note) => { const ok = await reportRequest(activeRequest.id, reason, note); if (ok) setView("track"); }} />
        )}
        {view === "messagesList" && <MessagesListView requests={requests} user={user} onOpen={(id) => openConversation(id)} />}
        {view === "notifications" && (
          <NotificationsView items={notifications} readIds={readIds}
            onBack={() => setView("home")}
            onMarkAll={() => markRead(notifications.map((n) => n.id))}
            onOpen={(n) => { markRead([n.id]); openConversation(n.requestId, "notifications"); }} />
        )}
        {view === "conversation" && activeRequest && (
          <ConversationView request={activeRequest} messages={messages} requestImage={requestImage} user={user} otherReadAt={otherReadAt}
            onBack={() => setView(convoFrom === "track" ? "track" : convoFrom === "notifications" ? "notifications" : navTab === "messages" ? "messagesList" : navTab === "requests" ? "requestsList" : "home")}
            onSend={(text) => sendMessage(activeRequest.id, text)}
            onConfirm={() => confirmRequest(activeRequest.id)}
            onComplete={(rating, review) => completeRequest(activeRequest.id, rating, review)}
            onReport={(reason, note) => reportRequest(activeRequest.id, reason, note)}
            onRespond={(status) => respondToRequest(activeRequest.id, status)}
            onPoll={pollConversation}
            onViewJob={() => openTrack(activeRequest.id)}
            onOpenReport={() => setView("report")}
            onSendVoice={(audio, secs) => sendVoiceMessage(activeRequest.id, audio, secs)} />
        )}
        {view === "userProfile" && !isArtisan && !applyOpen && (
          <CustomerProfileView user={user} requests={requests} application={application}
            onGoRequests={() => goNav("requests")}
            onBecomeArtisan={() => setApplyOpen(true)}
            onHelp={() => setView("help")}
            onLogout={logout} />
        )}
        {view === "userProfile" && isArtisan && user.artisanProfile && (
          <ArtisanOwnProfile user={user} requests={requests} myReviews={myReviews}
            onAddPhoto={addArtisanPhoto} onRemovePhoto={removeArtisanPhoto}
            onTrackRecord={() => setView("trackRecord")} onHelp={() => setView("help")} onLogout={logout} />
        )}
        {view === "userProfile" && !isArtisan && applyOpen && (
          <ApplyView user={user} onBack={() => setApplyOpen(false)} onApply={applyAsArtisan} />
        )}
        {false && (
          <UserProfileView startWithForm={applyOpen} user={user} isArtisan={isArtisan} application={application}
            incomingCount={requests.filter((r) => r.status === "PENDING").length} myReviews={myReviews}
            onApply={applyAsArtisan} onToggleOnline={toggleOnline} onSetBadge={setBadge}
            onAddPhoto={addArtisanPhoto} onRemovePhoto={removeArtisanPhoto}
            onLogout={logout} onBrowse={() => goNav("browse")} onViewRequests={() => goNav("requests")} />
        )}
      </div>
      <BottomNav active={navTab} onChange={goNav} isArtisan={isArtisan}
        requestCount={requests.filter((r) => r.status === "PENDING" || r.status === "ACCEPTED").length} messageCount={unreadMessages} hide={["wizard", "conversation", "artisanProfile", "request", "review", "report"].includes(view)} />
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

/* ---------------- Home ---------------- */
const homeExtraTrades = [
  { id: "LAPTOP_REPAIR", label: "Laptop Repair", icon: Laptop },
  { id: "PAINTER", label: "Painter", icon: PaintRoller },
  { id: "CARPENTER", label: "Carpenter", icon: Hammer },
  { id: "CLEANER", label: "Cleaner", icon: Sparkle },
];
const homeTrades = [...trades, ...homeExtraTrades.filter((e) => !trades.some((t) => t.id === e.id))];
const HOME_TINTS = [["#E3EFE9", "#0F4D3A"], ["#FBEBC8", "#8A5A12"], ["#DDE9F4", "#1F5A8A"], ["#F6E1DA", "#9A3B26"], ["#ECE7D8", "#4A4636"]];
function tintFor(id = "") { let h = 0; for (const c of id) h += c.charCodeAt(0); return HOME_TINTS[h % HOME_TINTS.length]; }
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }

function HomeView({ user, isArtisan, requests, myReviews, area, setArea, onlineNow, onOpenProfile, onPickTrade, onSeeAll, onOpenWizard, onOpenRequests, onOpenMe, hasAlerts, flash }) {
  const first = user.name.split(" ")[0];
  const live = trades.map((t) => t.id);
  const here = area === "All areas" ? "Ado-Ekiti" : `${area}, Ado-Ekiti`;
  return (
    <div className="screen hm">
      <div className="hm-top">
        <h1 className="hm-greet">{greeting()},<br />{first}</h1>
        <div className="hm-top-r">
          <button className="hm-bell" onClick={onOpenRequests} aria-label="Notifications"><Bell size={22} />{hasAlerts && <span className="hm-bell-dot" />}</button>
          <button className="hm-me" onClick={onOpenMe} aria-label="Profile">{initials(user.name)}</button>
        </div>
      </div>
      <label className="hm-loc">
        <MapPin size={17} /><span>{here}</span><ChevronDown size={16} />
        <select value={area} onChange={(e) => setArea(e.target.value)} aria-label="Area">{areas.map((a) => <option key={a} value={a}>{a}</option>)}</select>
      </label>

      <div className="hm-card">
        <h2>What do you need help with?</h2>
        <p>Describe the job once. We'll find vetted artisans who are free near you.</p>
        <button className="hm-card-btn" onClick={onOpenWizard}>Request a service <ArrowRight size={18} /></button>
      </div>

      {false && (
        <div className="section">
          <div className="dash-card">
            <div className="dash-header">
              <div className="avatar avatar--lg" style={{ background: colorFor(user.id) }}>{initials(user.name)}</div>
              <div className="dash-header-text">
                <div className="dash-name">{user.name}</div>
                <div className="app-trade">{tradeLabel(user.artisanProfile.trade)} · {user.artisanProfile.area}</div>
                <span className="badge" style={{ marginTop: 6 }}>{user.artisanProfile.badge === "TOP_RATED" ? <><Award size={11} /> Top Rated</> : <><CheckCircle2 size={11} /> Vetted</>}</span>
              </div>
            </div>
            <div className="dash-stats">
              <div className="dash-stat"><div className="dash-stat-num">{fmtStars(user.artisanProfile.rating)}</div><div className="dash-stat-label"><Star size={11} fill="#E0A458" stroke="none" /> Rating</div></div>
              <div className="dash-stat"><div className="dash-stat-num">{user.artisanProfile.jobsCompleted}</div><div className="dash-stat-label">Jobs done</div></div>
              <div className="dash-stat"><div className="dash-stat-num">{requests.filter((r) => r.status === "PENDING").length}</div><div className="dash-stat-label">New requests</div></div>
            </div>
          </div>

function timeAgo(d) {
  const days = Math.floor((Date.now() - new Date(d).getTime()) / 864e5);
  if (days < 1) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 14) return `${days} days ago`;
  if (days < 60) return `${Math.floor(days / 7)} weeks ago`;
  return `${Math.floor(days / 30)} months ago`; 
}

/* ---------------- Request flow ---------------- */
const WHEN_OPTIONS = [
  { id: "asap", label: "As soon as possible", sub: "Next available artisan", short: "ASAP" },
  { id: "today", label: "Today", sub: "Afternoon", short: "Today" },
  { id: "tomorrow", label: "Tomorrow", sub: "Morning", short: "Tomorrow" },
  { id: "date", label: "Pick a date", sub: "Choose day and time", short: "Scheduled" },
];
const SORTS = [["best", "Best match"], ["area", "Distance"], ["rating", "Rating"], ["jobs", "Jobs completed"]];

function whenText(w) {
  if (w.when === "today") return "Today afternoon";
  if (w.when === "tomorrow") return "Tomorrow morning";
  if (w.when === "date" && w.whenDate) {
    const d = new Date(w.whenDate);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }
  return "As soon as possible";
}

// Trade match is the search itself. Then: available, same area, verification,
// rating (weighted by jobs so one 5-star job cannot outrank a proven record), jobs completed.
function matchScore(a, area) {
  let s = 0;
  if (a.online) s += 1000;
  if (a.area === area) s += 400;
  if (a.skillVerified) s += 120;
  if (a.badge === "TOP_RATED") s += 120;
  s += Number(a.rating || 0) * 20 * Math.min(1, (a.jobsCompleted || 0) / 5);
  s += Math.min(a.jobsCompleted || 0, 50);
  return s;
}

function RequestFlow({ wiz, setWiz, meId, onBack, onSelectArtisan, onSendDirect }) {
  const set = (patch) => setWiz((w) => ({ ...w, ...patch }));
  const [photoBusy, setPhotoBusy] = useState(false);
  const [sending, setSending] = useState(false);
  async function sendDirect() {
    if (sending) return;
    setSending(true);
    try { await onSendDirect(); } finally { setSending(false); }
  }
  const formOk = wiz.trade && wiz.problem.trim().length >= 10 && (wiz.when !== "date" || !!wiz.whenDate);

  async function pickPhoto(e) {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setPhotoBusy(true);
    try { set({ image: await fileToDataUrl(f) }); } finally { setPhotoBusy(false); }
  }
  async function search() {
    set({ step: 2, loading: true, searched: false, sort: "best" });
    try {
      const d = await api(`/api/artisans?trade=${wiz.trade}`);
      set({ results: d.artisans.filter((a) => a.user.id !== meId), loading: false, searched: true });
    } catch (e) { set({ results: [], loading: false, searched: true }); }
  }

  const list = useMemo(() => {
    const arr = [...wiz.results];
    const sc = (a) => matchScore(a, wiz.area);
    if (wiz.sort === "area") arr.sort((a, b) => (b.area === wiz.area) - (a.area === wiz.area) || sc(b) - sc(a));
    else if (wiz.sort === "rating") arr.sort((a, b) => (b.rating - a.rating) || (b.jobsCompleted - a.jobsCompleted));
    else if (wiz.sort === "jobs") arr.sort((a, b) => (b.jobsCompleted - a.jobsCompleted) || (b.rating - a.rating));
    else arr.sort((a, b) => sc(b) - sc(a));
    return arr;
  }, [wiz.results, wiz.sort, wiz.area]);

  const whenShort = (WHEN_OPTIONS.find((o) => o.id === wiz.when) || WHEN_OPTIONS[0]).short;

  return (
    <div className="screen rf">
      <div className="rf-top">
        <button className="rf-back" onClick={() => (wiz.step === 2 ? set({ step: 1 }) : onBack())} aria-label="Back"><ArrowLeft size={22} /></button>
        <span>{wiz.direct ? "New request" : `New request · Step ${wiz.step} of 2`}</span>
      </div>

      {wiz.step === 1 ? (
        <>
          <h1 className="rf-h">{wiz.direct ? `Request ${wiz.direct.user.name.split(" ")[0]}` : "What do you need help with?"}</h1>
          <p className="rf-sub">{wiz.direct ? "Describe the job so they can quote and prepare." : "The clearer the job, the better the match."}</p>

          {!wiz.direct && <div className="rf-label">Service category</div>}
          <div className="rf-chips">
            {(wiz.direct ? [] : trades).map((t) => <button key={t.id} type="button" className={"rf-chip" + (wiz.trade === t.id ? " on" : "")} onClick={() => set({ trade: t.id })}>{t.label}</button>)}
          </div>

          <div className="rf-label">Describe the job</div>
          <textarea className="rf-text" rows={4} maxLength={500} value={wiz.problem} onChange={(e) => set({ problem: e.target.value })} placeholder="e.g. The socket in my kitchen sparks when I plug anything in." />
          <div className="rf-count"><span>Mention what you see, hear or smell.</span><span>{wiz.problem.length} / 500</span></div>

          <div className="rf-label">Your location</div>
          <label className="rf-field">
            <MapPin size={18} />
            <select value={wiz.area} onChange={(e) => set({ area: e.target.value })}>
              {areas.filter((a) => a !== "All areas").map((a) => <option key={a} value={a}>{a}, Ado-Ekiti</option>)}
            </select>
            <ChevronDown size={16} />
          </label>

          <div className="rf-label">Preferred time</div>
          <div className="rf-times">
            {WHEN_OPTIONS.map((o) => (
              <button key={o.id} type="button" className={"rf-time" + (wiz.when === o.id ? " on" : "")} onClick={() => set({ when: o.id })}>
                <b>{o.label}</b><span>{o.sub}</span>
              </button>
            ))}
          </div>
          {wiz.when === "date" && <input className="rf-date" type="datetime-local" value={wiz.whenDate} onChange={(e) => set({ whenDate: e.target.value })} />}

          <div className="rf-label">Photo <small>(optional)</small></div>
          <div className="rf-photo">
            <label className="rf-add">
              <input type="file" accept="image/*" style={{ display: "none" }} onChange={pickPhoto} />
              <span>{photoBusy ? "…" : "+"}</span>Add
            </label>
            {wiz.image && (
              <div className="rf-thumb">
                <img src={wiz.image} alt="" />
                <button type="button" onClick={() => set({ image: null })} aria-label="Remove photo"><X size={12} /></button>
              </div>
            )}
            <p>A clear photo helps artisans quote and prepare tools.</p>
          </div>

          <div className="rf-bar">
            <div className="rf-note"><ShieldCheck size={16} /> Only vetted artisans are matched. No payment needed to request.</div>
            <button className="rf-go" disabled={!formOk || photoBusy || sending} onClick={wiz.direct ? sendDirect : search}>{wiz.direct ? (sending ? "Sending…" : `Send request to ${wiz.direct.user.name.split(" ")[0]}`) : "Find trusted artisans"}</button>
          </div>
        </>
      ) : (
        <>
          <h1 className="rf-h">
            {wiz.loading ? "Finding trusted artisans…" : list.length ? `We found ${list.length} trusted ${list.length === 1 ? "artisan" : "artisans"} near you` : "No artisans available for this service right now"}
          </h1>
          <div className="rf-tags"><span>{tradeLabel(wiz.trade)}</span><span>{wiz.area}</span><span>{whenShort}</span></div>

          {!wiz.loading && wiz.searched && list.length === 0 && (
            <div className="rf-empty">
              <div className="rf-empty-ic"><MapPin size={26} /></div>
              <b>No artisans available for this service right now.</b>
              <p>Nobody vetted for {tradeLabel(wiz.trade)} is listed in Ado-Ekiti yet. Try another service, or check back soon.</p>
              <button className="rf-ghost" onClick={() => set({ step: 1 })}>Try another service</button>
            </div>
          )}

          {list.length > 0 && (
            <>
              <div className="rf-info"><ShieldCheck size={18} /><span>Ranked by trade match, availability, distance, verification, rating and jobs completed.</span></div>
              <div className="rf-sorts">
                {SORTS.map(([k, l]) => <button key={k} className={"rf-sort" + (wiz.sort === k ? " on" : "")} onClick={() => set({ sort: k })}>{l}</button>)}
              </div>
              <div className="rf-list">
                {list.map((a) => { const [bg, fg] = tintFor(a.id); return (
                  <div key={a.id} className="rf-card">
                    <div className="rf-card-top">
                      <span className="rf-av" style={{ background: bg, color: fg }}>{initials(a.user.name)}</span>
                      <div className="rf-id"><b>{a.user.name}</b><span>{tradeLabel(a.trade)}{a.area === wiz.area ? " · Same area" : ""}</span></div>
                      <span className="rf-rate"><Star size={14} fill="#B5651D" stroke="none" /><b>{fmtStars(a.rating)}</b></span>
                    </div>
                    <div className="rf-badges">
                      <span className="rf-b rf-b--g"><ShieldCheck size={13} /> Vetted</span>
                      {a.skillVerified && <span className="rf-b rf-b--b">Skill Verified</span>}
                      {a.badge === "TOP_RATED" && <span className="rf-b rf-b--a">Top Rated</span>}
                    </div>
                    <div className="rf-meta">
                      <span><b>{a.jobsCompleted}</b> jobs completed</span>
                      <span><MapPin size={13} /> {a.area}</span>
                      <span className={a.online ? "rf-on" : "rf-off"}><i />{a.online ? "Available now" : "Offline"}</span>
                    </div>
                    <button className="rf-view" onClick={() => onSelectArtisan(a)}>View profile</button>
                  </div>
                ); })}
              </div>
            </>
          )}
        </>
      )}
    </div>
  );
}

function RequestView({ artisan, openJobGroups, initialJob, onBack, onSend }) {
  const [mode, setMode] = useState("new");
  const [job, setJob] = useState(initialJob || "");
  const [when, setWhen] = useState("");
  const [image, setImage] = useState(null);
  const [sending, setSending] = useState(false);
  const attaching = mode !== "new";
  const attachedGroup = attaching ? openJobGroups.find((g) => g.jobGroupId === mode) : null;
  const valid = attaching ? true : job.trim() && when;

  return (
    <div className="screen">
      <div className="topbar"><button className="iconbtn" onClick={onBack}><ArrowLeft size={18} /></button><div className="topbar-title">Request · {artisan.user.name.split(" ")[0]}</div><div style={{ width: 34 }} /></div>
      <div className="form">
        {openJobGroups.length > 0 && (
          <label>Is this for a job you're already comparing quotes on?
            <select value={mode} onChange={(e) => setMode(e.target.value)}>
              <option value="new">No, this is a new job</option>
              {openJobGroups.map((g) => <option key={g.jobGroupId} value={g.jobGroupId}>Same as: "{g.job.slice(0, 34)}{g.job.length > 34 ? "…" : ""}"</option>)}
            </select>
          </label>
        )}
        {attaching ? (
          <div className="info-note">Comparing {artisan.user.name.split(" ")[0]} against your other request for: <strong>"{attachedGroup.job}"</strong> ({attachedGroup.when}). Confirming one closes the others automatically.</div>
        ) : (
          <>
            <label>What do you need done?<textarea rows={3} value={job} onChange={(e) => setJob(e.target.value)} placeholder="e.g. Fan not turning on, socket in room sparking" /></label>
            <label>When<select value={when} onChange={(e) => setWhen(e.target.value)}><option value="">Select a time</option><option>As soon as possible</option><option>Later today</option><option>Tomorrow</option><option>This week</option></select></label>
            <label>Photo of the problem (optional)
              {image ? (
                <div className="id-preview">
                  <img src={image} className="id-preview-img" />
                  <button type="button" className="id-remove-btn" onClick={() => setImage(null)}><X size={12} /> Remove</button>
                </div>
              ) : (
                <label className="id-upload-btn">
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={async (e) => { const f = e.target.files[0]; if (f) setImage(await fileToDataUrl(f)); e.target.value = ""; }} />
                  <Camera size={16} /> Add a photo
                </label>
              )}
            </label>
          </>
        )}
      </div>
      <button className="primary-btn primary-btn--fixed" disabled={!valid || sending}
        onClick={() => {
          if (!valid || sending) return;
          setSending(true);

/* ---------------- Requests tab ---------------- */
function statusMeta(status) {
  const map = {
    PENDING: { label: "Pending", cls: "badge--pending" },
    ACCEPTED: { label: "Accepted", cls: "badge--accepted" },
    CONFIRMED: { label: "Confirmed", cls: "badge--confirmed" },
    COMPLETED: { label: "Completed", cls: "badge--completed" },
    CLOSED: { label: "Closed", cls: "badge--closed" },
    DECLINED: { label: "Declined", cls: "badge--declined" },
  };
  return map[status] || { label: status, cls: "" };
}

/* ---------------- Requests tab (new design) ---------------- */
function pillFor(r, artisanSide) {
  const s = r.status;
  if (s === "PENDING") return artisanSide ? ["New request", "dark"] : ["Request sent", "amber"];
  if (s === "ACCEPTED") return ["Accepted", "blue"];
  if (s === "CONFIRMED") return r.artisanDoneAt ? (artisanSide ? ["Awaiting customer", "blue"] : ["Confirm job", "amber"]) : ["In progress", "green"];
  if (s === "COMPLETED") return ["Completed", "dark"];
  if (s === "DECLINED") return ["Declined", "red"];
  return ["Closed", "grey"];
}
function reqBucket(r, meId) {
  if (r.status === "COMPLETED") return "completed";
  if (r.status === "DECLINED" || r.status === "CLOSED") return "cancelled";
  if (r.status === "PENDING" && r.artisanProfile.user.id === meId) return "new";
  return "active";
}

/* ---------------- Request tracking ---------------- */
function TrackView({ request: r, user, onBack, onMessage, onRespond, onStart, onDone, onReview, onReport }) {
  const [busy, setBusy] = useState(false);
  const ap = r.artisanProfile;
  const artisanSide = ap.user.id === user.id;
  const other = artisanSide ? r.student : ap.user;
  const first = other.name.split(" ")[0];
  const s = r.status;
  const ended = s === "DECLINED" || s === "CLOSED";
  const working = s === "CONFIRMED" && !r.artisanDoneAt;
  const waitingConfirm = s === "CONFIRMED" && !!r.artisanDoneAt;
  const done = ended || s === "PENDING" ? 1 : s === "ACCEPTED" || working ? 2 : waitingConfirm ? 3 : 5;
  const current = ended ? -1 : s === "PENDING" ? 1 : s === "ACCEPTED" || working ? 2 : waitingConfirm ? 3 : -1;
  const [label, cls] = pillFor(r, artisanSide);
  const [bg, fg] = tintFor(other.id || r.id);
  async function run(fn) { if (busy) return; setBusy(true); try { await fn(); } finally { setBusy(false); } }
  let head;
  if (s === "DECLINED") head = artisanSide ? "You declined this request" : `${first} declined this request`;
  else if (s === "CLOSED") head = "This request was closed";
  else if (s === "PENDING") head = artisanSide ? `${first} is waiting for your reply` : `Waiting for ${first} to reply`;
  else if (s === "ACCEPTED") head = artisanSide ? `Start ${first}'s job when you're ready` : `${first} accepted your request`;
  else if (working) head = artisanSide ? `You're working on ${first}'s job` : `${first} is working on your job`;
  else if (waitingConfirm) head = artisanSide ? `Waiting for ${first} to confirm` : `${first} marked the job done`;
  else head = r.rating ? "Job completed and reviewed" : "Job completed";
  const sub = `${tradeLabel(ap.trade)}${r.area ? " · " + r.area : ""} · ${r.when}`;
  const startedTxt = r.startedAt ? `Started ${dayLabel(r.startedAt)}, ${clockTime(r.startedAt)}` : s === "COMPLETED" ? "Work finished" : "Work under way";
  const steps = [
    ["Request sent", `${dayLabel(r.createdAt)}, ${clockTime(r.createdAt)} · ${artisanSide ? "From " + r.student.name : "Sent to " + ap.user.name}`],
    ["Artisan accepted", s === "PENDING" ? `Waiting for ${artisanSide ? "you" : first} to reply` : s === "DECLINED" ? "The request was declined" : s === "CLOSED" ? "The request was closed" : "Request accepted"],
    ["Job in progress", s === "ACCEPTED" ? (artisanSide ? "Tap Start job when you begin" : `Starts when ${first} begins the job`) : working || waitingConfirm || s === "COMPLETED" ? startedTxt : "Starts once the artisan begins"],
    ["Job completed", s === "COMPLETED" ? "Marked done and confirmed" : waitingConfirm ? (artisanSide ? "Waiting for the customer to confirm" : `${first} marked it done. Confirm it to review`) : artisanSide ? "You mark it done, the customer confirms" : `${first} marks it done, you confirm`],
    [artisanSide ? "Customer review" : "Review artisan", r.rating ? `Rated ${r.rating} out of 5` : "Rate the work and help others hire with confidence"],
  ];
  return (
    <div className="screen tk">
      <div className="tk-top"><button className="tk-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button><span>Request {reqCode(r.id)}</span></div>
      <span className={"rq-pill tk-pill rq-pill--" + cls}><i />{label}</span>
      <h1 className="tk-h">{head}</h1>
      <p className="tk-sub">{sub}</p>

      <div className="tk-card">
        {steps.map(([t, d], i) => (
          <div key={t} className={"tk-step " + (i < done ? "tk-step--done" : i === current ? "tk-step--now" : "tk-step--todo")}>
            <span className="tk-dot">{i < done && <Check size={20} strokeWidth={3} />}</span>
            <div className="tk-st"><b>{t}</b><span>{d}</span></div>
          </div>
        ))}
      </div>

      <div className="tk-actions">
        {artisanSide && s === "PENDING" && (
          <div className="rq-acts" style={{ marginTop: 0 }}>
            <button className="d" onClick={() => onRespond("DECLINED")}>Decline</button>
            <button className="a" onClick={() => onRespond("ACCEPTED")}>Accept</button>
          </div>
        )}
        {artisanSide && s === "ACCEPTED" && <button className="tk-btn" disabled={busy} onClick={() => run(onStart)}>{busy ? "Starting…" : "Start job"}</button>}
        {artisanSide && working && <button className="tk-btn" disabled={busy} onClick={() => run(onDone)}>{busy ? "Saving…" : "Mark job done"}</button>}
        {!artisanSide && waitingConfirm && <button className="tk-btn" onClick={onReview}>Confirm job done and review</button>}
      </div>

      <div className="tk-card">
        <div className="tk-ac">
          <span className="tk-av" style={{ background: bg, color: fg }}>{initials(other.name)}</span>
          <div><b>{other.name}</b><span>{artisanSide ? "Customer" : `Vetted · ${fmtStars(ap.rating)} ★ · ${ap.jobsCompleted} jobs completed`}</span></div>
        </div>
        <button className="tk-msg" onClick={onMessage}><MessageCircle size={20} /> Message {artisanSide ? "customer" : "artisan"}</button>
        {!artisanSide && !ended && s !== "COMPLETED" && (
          <div className="tk-lock">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            <span>You can review {first} once they mark the job done and you confirm it.</span>
          </div>
        )}
      </div>
      {!ended && <button className="tk-report" onClick={onReport}>Report a problem with this job</button>}
    </div>
  );
}

const TOP_RULES = { minJobs: 25, minRating: 4.7 };
const MIN_PORTFOLIO = 3;

function repeatStats(requests, meId) {
  const per = {};
  for (const r of requests) {
    if (r.status === "COMPLETED" && r.artisanProfile && r.student && r.artisanProfile.user.id === meId) per[r.student.id] = (per[r.student.id] || 0) + 1;
  }
  const ids = Object.keys(per);
  const rep = ids.filter((k) => per[k] > 1);
  return { total: ids.length, repeat: rep.length, repeatIds: new Set(rep) };
}

function TrackRecordView({ user, requests, myReviews, onBack }) {
  const ap = user.artisanProfile;
  const done = requests.filter((r) => r.status === "COMPLETED" && r.artisanProfile.user.id === user.id);
  const rated = done.filter((r) => r.rating);
  const avg = rated.length ? rated.reduce((n, r) => n + r.rating, 0) / rated.length : 0;
  const rs = repeatStats(requests, user.id);
  const now = new Date();
  const months = Array.from({ length: 6 }, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - (5 - i), 1);
    return { key: d.getFullYear() + "-" + d.getMonth(), label: d.toLocaleDateString("en-US", { month: "short" }), n: 0 };
  });
  for (const r of done) {
    const d = new Date(r.updatedAt);
    const m = months.find((x) => x.key === d.getFullYear() + "-" + d.getMonth());
    if (m) m.n++;
  }
  const maxN = Math.max(1, ...months.map((m) => m.n));
  const dist = [5, 4, 3, 2, 1].map((s) => ({ s, n: rated.filter((r) => r.rating === s).length }));
  const maxD = Math.max(1, ...dist.map((d) => d.n));
  const top = ap.badge === "TOP_RATED";
  const jobsOk = ap.jobsCompleted >= TOP_RULES.minJobs;
  const ratingOk = Number(ap.rating) >= TOP_RULES.minRating;
  const Chk = ({ ok, label, val }) => <div className={"trk-chk" + (ok ? "" : " trk-chk--no")}>{ok ? <Check size={18} /> : <Clock size={18} />}<span>{label}</span><b>{val}</b></div>;
  return (
    <div className="screen trk">
      <button className="nf-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button>
      <h1 className="trk-h">Your track record</h1>
      <p className="trk-sub">Your reputation on VettedHands, built one completed job at a time. Customers see this on your profile.</p>
      <div className="trk-tiles">
        <div className="trk-tile trk-tile--g"><b>{ap.jobsCompleted}</b><strong>Jobs completed</strong><span>Counts only jobs the customer confirmed</span></div>
        <div className="trk-tile"><b>{fmtStars(avg || ap.rating)}</b><strong>Average rating</strong><span>From {plural2(rated.length, "review")}</span></div>
        <div className="trk-tile"><b>{rs.repeat}</b><strong>Repeat customers</strong><span>Customers who hired you again</span></div>
        <div className="trk-tile"><b>{myReviews.length}</b><strong>Latest reviews</strong><span>Shown on your profile</span></div>
      </div>

      <div className="trk-card">
        <h3>Jobs completed per month</h3>
        <div className="trk-months">
          {months.map((m) => <div className="trk-m" key={m.key}><b>{m.n}</b><i style={{ height: Math.max(4, (m.n / maxN) * 90) + "px" }} /><span>{m.label}</span></div>)}
        </div>
      </div>

      <div className="trk-card">
        <h3>Rating breakdown</h3>
        {dist.map((d) => <div className="trk-dist" key={d.s}><span style={{ width: 34 }}>{d.s} ★</span><span className="trk-dist-t"><i style={{ width: (d.n / maxD) * 100 + "%" }} /></span><b>{d.n}</b></div>)}
      </div>

      <div className="trk-top">
        <div className="trk-top-h"><b>Top Rated</b><span className={"trk-pill" + (top ? "" : " trk-pill--no")}>{top ? "Earned" : "Not yet"}</span></div>
        <p>Top Rated is never automatic. It needs a real record, and it can be lost if standards slip.</p>
        <Chk ok={jobsOk} label={`Completed jobs (min. ${TOP_RULES.minJobs})`} val={ap.jobsCompleted} />
        <Chk ok={ratingOk} label={`Average rating (min. ${TOP_RULES.minRating})`} val={fmtStars(ap.rating)} />
      </div>

      <div className="trk-card">
        <h3>Recent jobs</h3>
        {done.slice(0, 4).map((r) => (
          <div className="trk-job" key={r.id}>
            <div><b>{r.job.length > 30 ? r.job.slice(0, 30) + "…" : r.job}</b><small>{shortName(r.student.name)} · {listTime(r.updatedAt)}</small></div>
            <div className="trk-job-r"><b>{r.rating ? Number(r.rating).toFixed(1) + " ★" : "No rating"}</b><small>{rs.repeatIds.has(r.student.id) ? "Repeat customer" : r.rating ? "Reviewed" : "Awaiting review"}</small></div>
          </div>
        ))}
        {done.length === 0 && <p className="trk-sub" style={{ margin: 0 }}>You haven't completed any jobs yet. Your first completed job starts your track record.</p>}
      </div>

      {myReviews.slice(0, 2).map((r) => (
        <div key={r.id} className="review-item" style={{ marginBottom: 12 }}>
          <div className="review-stars">{Array.from({ length: 5 }).map((_, i) => <Star key={i} size={13} fill={i < r.rating ? "#B5651D" : "none"} stroke={i < r.rating ? "#B5651D" : "#C9BFAB"} />)}</div>
          <div className="review-text">"{r.reviewText}"</div>
          <div className="review-author">{shortName(r.student.name)}</div>
        </div>
      ))}
    </div>
  );
}
function plural2(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }

    const files = Array.from(e.target.files || []).slice(0, 6 - photos.length);

    setUpBusy(true);
    try { const urls = await Promise.all(files.map((f) => fileToDataUrl(f))); setPhotos((p) => [...p, ...urls].slice(0, 6)); }

/* ---------------- Chat helpers ---------------- */
const reqCode = (id) => "VH-" + String(id).slice(0, 4).toUpperCase();
function shortName(name = "") { const p = name.trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : p[0]; }
function clockTime(d) { return new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
function listTime(d) {
  const x = new Date(d), t = new Date();
  if (x.toDateString() === t.toDateString()) return clockTime(d);
  if (x.toDateString() === new Date(t.getTime() - 864e5).toDateString()) return "Yesterday";
  return x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function dayLabel(d) {
  const x = new Date(d), t = new Date();
  if (x.toDateString() === t.toDateString()) return "Today";
  if (x.toDateString() === new Date(t.getTime() - 864e5).toDateString()) return "Yesterday";
  return x.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
// One tick = sent, two ticks = the other person has opened the chat since.
function Ticks({ read, lead }) {
  return (
    <svg width="17" height="11" viewBox="0 0 17 11" fill="none" stroke={read ? "#1B7F5A" : "#A39B88"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"
      style={{ marginLeft: lead ? 0 : 5, marginRight: lead ? 6 : 0, flexShrink: 0 }}>
      <polyline points="1 6 4 9 10 2" />
      {read && <polyline points="6 6 9 9 15 2" />}
    </svg>
  );
}

/* ---------------- Notifications ---------------- */
// Built from the requests and messages the app already loads. Nothing new on the backend.
function buildNotifications(requests, me) {
  const out = [];
  for (const r of requests) {
    if (!r.artisanProfile || !r.student) continue;
    const artisanSide = r.artisanProfile.user.id === me.id;
    const other = artisanSide ? r.student : r.artisanProfile.user;
    const first = other.name.split(" ")[0];
    const base = { requestId: r.id, time: r.updatedAt || r.createdAt };
    const add = (status, extra) => out.push({ ...base, id: r.id + ":" + status, ...extra });
    if (!artisanSide) {
      if (r.status === "ACCEPTED") add("ACCEPTED", { kind: "ok", title: `${first} accepted your request`, text: "They'll start the job soon. You can message them while you wait." });
      if (r.status === "CONFIRMED" && !r.artisanDoneAt) add("STARTED", { kind: "job", title: `${first} started your job`, text: `${reqCode(r.id)} is in progress.` });
      if (r.status === "CONFIRMED" && r.artisanDoneAt) add("DONE", { kind: "review", title: `${first} marked the job done`, text: "Confirm it and leave a review." });
      if (r.status === "COMPLETED") add("COMPLETED", r.rating
        ? { kind: "ok", title: "Job completed", text: `Thanks for reviewing ${first}.` }
        : { kind: "review", title: `Time to review ${first}`, text: `Your ${r.job.slice(0, 40)} job is complete. Share how it went.` });
      if (r.status === "DECLINED") add("DECLINED", { kind: "flag", title: `${first} declined your request`, text: "Try another artisan near you." });
      if (r.status === "CLOSED") add("CLOSED", { kind: "flag", title: "Request closed", text: "You booked another artisan for this job." });
    } else {
      if (r.status === "PENDING") add("PENDING", { kind: "job", title: `New request from ${first}`, text: r.job });
      if (r.status === "CONFIRMED" && r.artisanDoneAt) add("DONE", { kind: "ok", title: `Waiting for ${first} to confirm`, text: r.job });

function fmtSecs(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob); });
}
// Tap-to-record. start(onClip) asks for the mic. stop(true) sends the clip, stop(false) throws it away.
function useRecorder(maxSecs = 60) {
  const [recording, setRecording] = useState(false);
  const [secs, setSecs] = useState(0);
  const rec = useRef(null), chunks = useRef([]), timer = useRef(null), t0 = useRef(0), keep = useRef(true), done = useRef(null);
  useEffect(() => () => { clearInterval(timer.current); if (rec.current && rec.current.state !== "inactive") { keep.current = false; rec.current.stop(); } }, []);
  async function start(onClip) {
    if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error("Voice notes aren't supported on this browser.");
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { throw new Error("Allow microphone access to record a voice note."); }
    const mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((m) => MediaRecorder.isTypeSupported(m));
    const r = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
    chunks.current = []; keep.current = true; done.current = onClip;
    r.ondataavailable = (e) => { if (e.data && e.data.size) chunks.current.push(e.data); };
    r.onstop = async () => {
      clearInterval(timer.current);
      stream.getTracks().forEach((t) => t.stop());
      setRecording(false);
      const len = Math.max(1, Math.round((Date.now() - t0.current) / 1000));
      if (keep.current && chunks.current.length && done.current) {
        const type = (r.mimeType || mime || "audio/mp4").split(";")[0];
        done.current(await blobToDataUrl(new Blob(chunks.current, { type })), len);
      }
    };
    rec.current = r; t0.current = Date.now(); setSecs(0); setRecording(true); r.start();
    timer.current = setInterval(() => { const s = Math.round((Date.now() - t0.current) / 1000); setSecs(s); if (s >= maxSecs) stop(true); }, 250);
  }
  function stop(send) { keep.current = send; if (rec.current && rec.current.state !== "inactive") rec.current.stop(); }
  return { recording, secs, start, stop };
}
function VoiceBubble({ src, secs, mine }) {
  const ref = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [pos, setPos] = useState(0);
  const bars = useMemo(() => { let h = 7; for (const c of String(src).slice(-40)) h = (h * 31 + c.charCodeAt(0)) % 9973; return Array.from({ length: 26 }, (_, i) => 6 + ((h * (i + 3) * 7919) % 17)); }, [src]);
  function toggle() { const a = ref.current; if (!a) return; if (a.paused) a.play().catch(() => {}); else a.pause(); }
  const total = secs || 0;
  const frac = total ? Math.min(1, pos / total) : 0;
  return (
    <div className={"vn" + (mine ? " vn--me" : "")}>
      <audio ref={ref} src={src} preload="metadata" onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}
        onEnded={() => { setPlaying(false); setPos(0); }} onTimeUpdate={(e) => setPos(e.target.currentTime)} />
      <button type="button" className="vn-play" onClick={toggle} aria-label={playing ? "Pause" : "Play"}>{playing ? <Pause size={16} /> : <Play size={16} />}</button>
      <div className="vn-wave">{bars.map((h, i) => <i key={i} className={i / bars.length < frac ? "on" : ""} style={{ height: h }} />)}</div>
      <span className="vn-time">{fmtSecs(playing || pos ? pos : total)}</span>
    </div>
  );
}

// Converts a picked image file into a base64 data URL so it can be sent straight to the
// backend as a plain string — no separate image hosting service needed for now.
// Resizes and compresses an image before converting to a data URL — cuts a
// typical 2-5MB phone photo down to ~50-150KB, which is the main thing making
// uploads, sends, and later loads feel slow. Same function signature as before,
// so every existing call site (work photos, ID doc, request image) speeds up
// automatically with no other changes needed.
function fileToDataUrl(file, maxDim = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

            {user.artisanProfile.badge !== "TOP_RATED" && confirmingVerify && (
              <div className="inline-confirm">
                <div className="inline-confirm-text">Top Rated puts you first in Browse and Online Now, plus a gold badge on your profile.</div>
                <div className="settle-actions">
                  <button className="ghost-btn" onClick={() => setConfirmingVerify(false)}>Cancel</button>
                  <button className="settle-btn" onClick={() => { onSetBadge("TOP_RATED"); setConfirmingVerify(false); }}>Confirm</button>
                </div>
              </div>
            )}
            {user.artisanProfile.badge === "TOP_RATED" && <div className="verified-note"><Award size={14} /> You're a Top Rated verified artisan</div>}
          </div>
          {user.artisanProfile.photos && (
            <div className="photo-picker" style={{ marginTop: 10 }}>
              {user.artisanProfile.photos.map((p) => (
                <div key={p.id} style={{ position: "relative" }}>
                  <img src={p.url} className="photo-thumb" style={{ objectFit: "cover" }} />
                  <button onClick={() => onRemovePhoto(p.id)} style={{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%", background: "var(--danger)", color: "#fff", border: "2px solid var(--bg)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: 0 }}><X size={11} /></button>
                </div>
              ))}
              {user.artisanProfile.photos.length < 6 && (
                <label className="photo-add" style={{ cursor: "pointer" }}>
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={async (e) => { const f = e.target.files[0]; if (f) onAddPhoto(await fileToDataUrl(f)); e.target.value = ""; }} />
                  <Camera size={16} /> Add
                </label>
              )}
            </div>
          )}
          <button className="browse-link" onClick={onBrowse}>Need a service yourself? Browse artisans <ChevronRight size={14} /></button>
        </div>
      )}

      {!isArtisan && (
        <div className="section">
          <div className="section-head"><span>Offer your services</span></div>
          {!application && !showForm && <button className="artisan-cta" onClick={() => setShowForm(true)}><Hammer size={17} /> Become a vetted artisan on VettedHands</button>}
          {!application && showForm && (
            <div className="form form--card">
              <label>Trade<select value={trade} onChange={(e) => setTrade(e.target.value)}>{trades.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></label>
              <label>Tell customers about your work<textarea rows={3} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="At least 10 characters…" /></label>
              <label>Phone / WhatsApp number<input required type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} className="text-input" placeholder="e.g. 0803xxxxxxx" /></label>
              <label>Social media username (Instagram, Facebook, or Twitter/X)<input value={socialHandle} onChange={(e) => setSocialHandle(e.target.value)} className="text-input" placeholder="e.g. @tunde_electrics" /></label>
              <label>Government ID (NIN slip, driver's license, or voter's card) — seen only by VettedHands admin
                {idDocument ? (
                  <div className="id-preview">
                    <img src={idDocument} className="id-preview-img" />
                    <button type="button" className="id-remove-btn" onClick={() => setIdDocument(null)}><X size={12} /> Remove</button>
                  </div>
                ) : (
                  <label className="id-upload-btn">
                    <input type="file" accept="image/*" onChange={handleIdPick} style={{ display: "none" }} />
                    <Camera size={16} /> Upload ID photo
                  </label>
                )}
              </label>
              <label>Photos of past work
                <div className="photo-picker">
                  {photos.map((p, i) => <img key={i} src={p} className="photo-thumb" style={{ objectFit: "cover" }} />)}
                  {photos.length < 4 && (
                    <label className="photo-add" style={{ cursor: uploading ? "wait" : "pointer" }}>
                      <input type="file" accept="image/*" multiple onChange={handlePhotoPick} style={{ display: "none" }} disabled={uploading} />
                      <Camera size={16} /> {uploading ? "…" : "Add"}
                    </label>
                  )}
                </div>
              </label>
              <div className="settle-actions">
                <button className="ghost-btn" onClick={() => setShowForm(false)}><X size={14} /> Cancel</button>
                <button className="settle-btn" disabled={bio.trim().length < 10 || !phone.trim() || !idDocument} onClick={() => { onApply(trade, bio.trim(), photos, phone.trim(), socialHandle.trim(), idDocument); setShowForm(false); }}>Submit for review</button>
              </div>
            </div>
          )}
          {application && application.status === "PENDING" && (
            <div className="pending-card">
              <div className="pending-title">Application under review</div>
              <div className="pending-sub">We're checking your details. You'll become an artisan once approved by an admin.</div>
              {application.infoRequestNote && (
                <div className="info-request-note">
                  <AlertTriangle size={13} /> VettedHands needs more info: "{application.infoRequestNote}".
                  <a className="support-link" href={`mailto:${SUPPORT_EMAIL}?subject=${encodeURIComponent("Application info request")}&body=${encodeURIComponent("Hi, responding to your request for more info on my artisan application: ")}`}>Reach out to support</a>
                </div>
              )}
            </div>
          )}
          {application && application.status === "REJECTED" && (
            <div className="pending-card"><div className="pending-title" style={{ color: "var(--danger)" }}>Application not approved</div></div>
          )}
        </div>
      )}

      <div className="section">
        <div className="settings-list">
          <div className="settings-row settings-row--danger" onClick={onLogout} style={{ cursor: "pointer" }}><LogOut size={17} /> Log out</div>
        </div>
      </div>
      {!isArtisan && <button className="browse-link" onClick={onBrowse}>Browse artisans <ChevronRight size={14} /></button>}
    </div>
  );
}

/* ---------------- Bottom nav ---------------- */
function BottomNav({ active, onChange, isArtisan, requestCount, messageCount, hide }) {
  const items = [
    { id: "home", label: "Home", icon: Home },
    { id: "requests", label: "Requests", icon: ClipboardList, badge: requestCount },
    { id: "messages", label: "Messages", icon: MessageCircle, badge: messageCount },
    { id: "profile", label: "Profile", icon: UserIcon },
  ];
  return (
    <div className={"bottomnav" + (hide ? " bottomnav--hide" : "")}>
      {items.map((it) => { const I = it.icon; const isActive = active === it.id; return (
        <button key={it.id} className={"nav-item" + (isActive ? " nav-item--active" : "")} onClick={() => onChange(it.id)}>
          <span className="nav-icon-wrap"><I size={19} strokeWidth={isActive ? 2.4 : 2} />{it.badge > 0 && <span className="nav-badge">{it.badge}</span>}</span>
          <span>{it.label}</span>
        </button>
      ); })}
    </div>
  );
}

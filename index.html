function urlB64ToUint8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

// Talks to the real backend. Throws an Error with a readable message on failure.
async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  let res, data = null;
  const attempts = method === "GET" ? 3 : 1;
  for (let i = 0; i < attempts; i++) {
    try {
      res = await fetch(`${API_BASE}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
    } catch (e) {
      if (i === attempts - 1) throw new Error("No connection. Check your network and try again.");
      await new Promise((r) => setTimeout(r, 1500));
      continue;
    }
    data = null;
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok && res.status >= 500 && i < attempts - 1) { await new Promise((r) => setTimeout(r, 1500)); continue; }
    break;
  }
  if (!res.ok) {
    const raw = (data && data.error) || "";
    if (/prisma|database server|invocation/i.test(raw)) throw new Error("Waking up the server. Please try again in a few seconds.");
    const apiErr = new Error(raw || `Request failed (${res.status})`);
    apiErr.data = data;
    throw apiErr;
  }
  return data;
}

  const unlock = () => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) {} };
  ["pointerdown", "touchstart", "keydown"].forEach((ev) => window.addEventListener(ev, unlock, { passive: true }));
  return function () {
    try {
      if (localStorage.getItem("vh_sound") === "off") return;
      if (!ctx || ctx.state !== "running") return;
      const t = ctx.currentTime;
      [[880, 0], [1318, 0.15]].forEach(([f, d]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.28, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.4);
        o.connect(g); g.connect(ctx.destination); o.start(t + d); o.stop(t + d + 0.45);
      });
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    } catch (e) {}
  };
})();
function initials(name = "") { return name.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase(); }
function colorFor(id = "") { const palette = ["#0F4D3A", "#B5651D", "#1B6650"]; let h = 0; for (const c of id) h += c.charCodeAt(0); return palette[h % palette.length]; }
const EXTRA_LABELS = {}; // names of services an admin has hidden (still shown on existing artisans)
function applyServices(list) {
  (list || []).forEach((s) => {
    EXTRA_LABELS[s.key] = s.label;
    const i = trades.findIndex((t) => t.id === s.key);
    if (s.active && i < 0) trades.push({ id: s.key, label: s.label, icon: iconForService(s.key, s.label, s.icon) });
    if (s.active && i >= 0) trades[i].label = s.label;
    if (!s.active && i >= 0 && !CORE_TRADE_IDS.includes(s.key)) trades.splice(i, 1);
  });
}
const CORE_TRADE_IDS = trades.map((t) => t.id);
function prettyKey(k) { return String(k || "").toLowerCase().replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()); }
function tradeLabel(t) { const found = trades.find((x) => x.id === t); return found ? found.label : EXTRA_LABELS[t] || prettyKey(t); }
function fmtStars(n) { return Number(n || 0).toFixed(1); }

function tokenRole(t) {
  try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role; } catch (e) { return null; }
}
function useAuth() {
  const [token, setToken] = useState(() => localStorage.getItem("vh_token") || null);
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(!!token);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!token) { setLoading(false); return; }
    api("/api/auth/me", { token })
      .then((d) => { if (d.token && tokenRole(token) !== d.user.role) { localStorage.setItem("vh_token", d.token); setToken(d.token); } setUser(d.user); })
      .catch(() => { localStorage.removeItem("vh_token"); setToken(null); })
      .finally(() => setLoading(false));
  }, [token]);

    function startSession(d) { localStorage.setItem("vh_token", d.token); setToken(d.token); setUser(d.user); }
  async function login(email, password) {
    setError(null);
    startSession(await api("/api/auth/login", { method: "POST", body: { email, password } }));
  }
  async function register(name, email, password, area) {
    setError(null);
    const d = await api("/api/auth/register", { method: "POST", body: { name, email, password, area } });
    if (d.needsVerification) return d;
    startSession(d);
  }
  async function verifyEmail(email, code) { startSession(await api("/api/auth/verify-email", { method: "POST", body: { email, code } })); }
  async function resendCode(email) { await api("/api/auth/resend-code", { method: "POST", body: { email } }); }
  async function forgotPassword(email) { await api("/api/auth/forgot-password", { method: "POST", body: { email } }); }
  async function resetPassword(email, code, password) { startSession(await api("/api/auth/reset-password", { method: "POST", body: { email, code, password } })); }
  function logout() {
    localStorage.removeItem("vh_token");
    setToken(null);
    setUser(null);
  }
    return { token, setToken, user, setUser, loading, error, login, register, logout, verifyEmail, resendCode, forgotPassword, resetPassword };
}

function CodeBoxes({ value, onChange }) {
  const refs = useRef([]);
  useEffect(() => { if (refs.current[0]) refs.current[0].focus(); }, []);
  function onBox(i, v) {
    const d = v.replace(/\D/g, "");
    if (!d) { onChange(value.slice(0, i) + value.slice(i + 1)); return; }
    const pos = Math.min(i, value.length);
    onChange((value.slice(0, pos) + d.slice(-1) + value.slice(pos + 1)).slice(0, 6));
    if (pos < 5 && refs.current[pos + 1]) refs.current[pos + 1].focus();
  }
  function onKey(i, e) {
    if (e.key === "Backspace" && !value[i] && i > 0) {
      e.preventDefault();
      onChange(value.slice(0, i - 1));
      refs.current[i - 1].focus();
    }
  }
  function onPaste(e) {
    const t = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
    if (!t) return;
    e.preventDefault();
    onChange(t);
    refs.current[Math.min(t.length, 5)].focus();
  }
  return (
    <div className="code-row" onPaste={onPaste}>
      {Array.from({ length: 6 }, (_, i) => (
        <input key={i} ref={(el) => (refs.current[i] = el)} className="code-box" inputMode="numeric" pattern="[0-9]*"
          autoComplete={i === 0 ? "one-time-code" : "off"} aria-label={`Digit ${i + 1}`}
          value={value[i] || ""} onChange={(e) => onBox(i, e.target.value)} onKeyDown={(e) => onKey(i, e)} />
      ))}
    </div>
  );
}

function AuthScreen({ initialMode, onBack, auth, onLegal }) {
  const [mode, setMode] = useState(initialMode || "login"); // register | login | forgot | code
  const [after, setAfter] = useState("verify"); // what the code screen finishes: verify | reset
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [area, setArea] = useState(areas[1]);
  const [agree, setAgree] = useState(false);
  const [code, setCode] = useState("");
  const [wait, setWait] = useState(0);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [info, setInfo] = useState(null);
  const addr = email.trim().toLowerCase();

  useEffect(() => {
    if (wait <= 0) return;
    const id = setTimeout(() => setWait((w) => w - 1), 1000);
    return () => clearTimeout(id);
  }, [wait]);

  async function run(fn) {
    setErr(null); setInfo(null); setBusy(true);
    try { await fn(); } catch (ex) { setErr(ex.message); } finally { setBusy(false); }
  }
  function toCode(kind) {
    setAfter(kind); setCode(""); setWait(60); setMode("code");
    if (kind === "reset") setPassword("");
  }
  function submitMain(e) {
    e.preventDefault();
    run(async () => {
      if (mode === "login") {
        try { await auth.login(addr, password); }
        catch (ex) { if (ex.data && ex.data.needsVerification) { toCode("verify"); return; } throw ex; }
      } else if (mode === "register") {
        const d = await auth.register(name.trim(), addr, password, area);
        if (d && d.needsVerification) toCode("verify");
      } else if (mode === "forgot") {
        await auth.forgotPassword(addr);
        toCode("reset");
      }
    });
  }
  function submitCode(e) {
    e.preventDefault();
    run(async () => {
      if (after === "verify") await auth.verifyEmail(addr, code);
      else await auth.resetPassword(addr, code, password);
    });
  }
  function resend() {
    if (wait > 0 || busy) return;
    run(async () => {
      if (after === "verify") await auth.resendCode(addr); else await auth.forgotPassword(addr);
      setWait(60);
      setInfo("A new code is on its way. Check your inbox and spam folder.");
    });
  }
  function goBack() {
    setErr(null); setInfo(null);
    if (mode === "code") setMode(after === "reset" ? "forgot" : initialMode === "login" ? "login" : "register");
    else if (mode === "forgot") setMode("login");
    else onBack();
  }
  const clock = "0:" + String(wait).padStart(2, "0");

  return (
    <div className="auth">
      <div className="auth-inner">
        <div className="auth-top">
          <button className="auth-back" onClick={goBack} aria-label="Back"><ArrowLeft size={20} /></button>
          <span className="landing-mark landing-mark--sm"><ShieldCheck size={16} /></span>
          <span className="auth-brand">VettedHands</span>
        </div>

        {mode === "code" ? (
          <>
            <div className="auth-ic"><Send size={26} /></div>
            <h1 className="auth-h1">{after === "reset" ? "Check your email." : "Enter the 6-digit code"}</h1>
            <p className="auth-sub">We sent a code to <b style={{ color: "var(--ink)" }}>{addr}</b>. <button type="button" className="auth-link" onClick={goBack}>Change</button></p>
            <form className="auth-form" onSubmit={submitCode}>
              <CodeBoxes value={code} onChange={setCode} />
              {after === "reset" && (
                <label>New password<input required type="password" minLength={8} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="At least 8 characters" /></label>
              )}
              {info && <div className="auth-info">{info}</div>}
              {err && <div className="auth-err">{err}</div>}
              <button className="auth-submit" disabled={busy || code.length < 6 || (after === "reset" && password.length < 8)}>
                {busy ? "Please wait…" : after === "reset" ? "Reset password" : "Verify and continue"}
              </button>
            </form>
            <div className="auth-resend">
              Didn't get it? {wait > 0 ? <b style={{ color: "var(--ink)" }}>Resend in {clock}</b> : <button type="button" className="auth-link" onClick={resend}>Resend code</button>}
              <div style={{ marginTop: 6 }}>Check your spam folder too.</div>
            </div>
            <div className="auth-warn"><span>VettedHands will never ask you to share this code. Anyone who does is trying to take over your account.</span></div>
          </>
        ) : mode === "forgot" ? (
          <>
            <h1 className="auth-h1">Reset your password.</h1>
            <p className="auth-sub">Enter your email and we'll send you a 6-digit code.</p>
            <form className="auth-form" onSubmit={submitMain}>
              <label>Email<input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" /></label>
              {err && <div className="auth-err">{err}</div>}
              <button className="auth-submit" disabled={busy}>{busy ? "Please wait…" : "Send code"}</button>
            </form>
            <div className="auth-resend"><button type="button" className="auth-link" onClick={() => setMode("login")}>Back to sign in</button></div>
          </>
        ) : (
          <>
            <h1 className="auth-h1">{mode === "register" ? <>Find skilled people.<br />Hire with confidence.</> : "Welcome back."}</h1>
            <p className="auth-sub">{mode === "register" ? "Create your account in under a minute. No payment needed." : "Sign in to track your requests and jobs."}</p>
            <div className="seg">
              <button type="button" className={"seg-btn" + (mode === "register" ? " seg-btn--on" : "")} onClick={() => { setErr(null); setMode("register"); }}>Create account</button>
              <button type="button" className={"seg-btn" + (mode === "login" ? " seg-btn--on" : "")} onClick={() => { setErr(null); setMode("login"); }}>Sign in</button>
            </div>
            <form className="auth-form" onSubmit={submitMain}>
              {mode === "register" && (
                <label>Full name<input required value={name} onChange={(e) => setName(e.target.value)} placeholder="Your name" /></label>
              )}
              <label>Email<input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" /></label>
              <label>Password<input required type="password" minLength={8} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="At least 8 characters" /></label>
              {mode === "login" && (
                <button type="button" className="auth-link auth-forgot" onClick={() => { setErr(null); setMode("forgot"); }}>Forgot password?</button>
              )}
              {mode === "register" && (
                <label>Where are you? <span style={{ fontWeight: 500, color: "var(--ink-soft)" }}>(optional)</span><select value={area} onChange={(e) => setArea(e.target.value)}>{areas.filter((a) => a !== "All areas").map((a) => <option key={a}>{a}</option>)}</select></label>
              )}
              {mode === "register" && (
                <label className="auth-agree"><input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} /><span>I am 18 or older and agree to the <button type="button" className="auth-link" onClick={() => onLegal("terms")}>Terms</button> and <button type="button" className="auth-link" onClick={() => onLegal("privacy")}>Privacy Policy</button>.</span></label>
              )}
              {err && <div className="auth-err">{err}</div>}
              <button className="auth-submit" disabled={busy || (mode === "register" && !agree)}>{busy ? "Please wait…" : mode === "login" ? "Sign in" : "Create account"}</button>
            </form>
            {mode === "register" && (
              <div className="auth-note"><UserIcon size={20} /><span>Everyone starts as a customer. Have a trade? You can apply to become a vetted artisan from your profile. We'll email you a 6-digit code to confirm your address.</span></div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

  function payWithPopup(d) {
    return new Promise((resolve) => {
      const redirect = () => { window.location.href = d.authorizationUrl; };
      if (!window.PaystackPop || !d.accessCode) { redirect(); return resolve(); }
      let loaded = false;
      const timer = setTimeout(() => { if (!loaded) redirect(); }, 25000);
      const popup = new window.PaystackPop();
      popup.resumeTransaction(d.accessCode, {
        onLoad: () => { loaded = true; clearTimeout(timer); },
        onSuccess: async () => {
          setPayFx({ busy: true });
          try {
            const v = await api(`/api/payments/verify/${encodeURIComponent(d.reference)}`, { token });
            await loadRequests();
            if (v.status === "HELD") setPayFx({ done: true, title: d.kind === "addon" ? "Extra work paid" : "Payment secured", sub: d.kind === "addon" ? "Held safely by VettedHands and released with the rest of the job." : "Your money is held safely by VettedHands until the job is done. Your booking is confirmed." });
            else { setPayFx(null); flash(v.status === "REFUNDED" ? "That payment arrived too late and was refunded." : "We're still confirming your payment. Check back in a minute."); }
          } catch (e) { setPayFx(null); fail(e); }
          resolve();
        },
        onCancel: () => { clearTimeout(timer); flash("Payment cancelled. You can try again."); resolve(); },
        onError: () => { clearTimeout(timer); redirect(); resolve(); },
      });
    });
  }

{pushAsk && (
          <div className="sg-back" onClick={() => { try { localStorage.setItem("vh_push_asked_" + user.id, "1"); } catch (e) { /* ignore */ } setPushAsk(false); }}>
            <div className="sg-card" onClick={(e) => e.stopPropagation()}>
              <h3>Stay in the loop</h3>
              <p>Get an alert the moment someone replies, sends a quote or pays. You can turn this off any time in your profile.</p>
              <button className="primary-btn" style={{ margin: "12px 0 0" }} onClick={async () => { setPushAsk(false); await togglePush(); }}>Turn on alerts</button>
              <button className="sg-x" onClick={() => { try { localStorage.setItem("vh_push_asked_" + user.id, "1"); } catch (e) { /* ignore */ } setPushAsk(false); }}>Not now</button>
            </div>
          </div>
        )}
        {toast && <div className="toast">{toast}</div>}
    </>
  );
}

  let list = onlyOn ? filtered.filter((a) => a.online) : filtered.slice();
  list.sort((x, y) => (Number(!!y.isPro) - Number(!!x.isPro)) || (sort === "jobs" ? y.jobsCompleted - x.jobsCompleted : (y.rating || 0) - (x.rating || 0)));

    <div className="screen">
      <div className="bw-head">
        <button className="iconbtn" onClick={onBack} aria-label="Back"><ArrowLeft size={18} /></button>

      </div>
      <div className="bw-search"><Search size={17} /><input placeholder="Search a trade or name" value={query} onChange={(e) => setQuery(e.target.value)} />{query && <button onClick={() => setQuery("")} aria-label="Clear"><X size={15} /></button>}</div>
      <div className="chip-row">
        <button className={"chip" + (!tradeFilter ? " chip--active" : "")} onClick={() => setTradeFilter(null)}>All</button>

      </div>
      <div className="bw-tools">
        <label className="bw-area"><MapPin size={14} /><select value={area} onChange={(e) => setArea(e.target.value)}>{areas.map((x) => <option key={x} value={x}>{x}</option>)}</select></label>
        <button className={"bw-on" + (onlyOn ? " bw-on--yes" : "")} onClick={() => setOnlyOn(!onlyOn)}><i />Available now</button>
        <select className="bw-sort" value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort"><option value="rating">Top rated</option><option value="jobs">Most jobs</option></select>
      </div>
      <div className="hm-list bw-list">

const KIND_LABEL = { STORY: "Story", UPDATE: "Update", GUIDE: "Guide" };
const POST_STATE = {
  PENDING: ["Waiting for approval", "amber"],
  PUBLISHED: ["Live", "green"],
  REJECTED: ["Not approved", "red"],
  HIDDEN: ["Hidden", "grey"],
};
const REPORT_REASONS = ["Not true", "Rude or abusive", "Spam or advert", "Contains personal details", "Other"];
// Written by us, always shown. Admin-written guides appear after it.
const BUILT_IN_GUIDE = {
  id: "builtin-guide", kind: "GUIDE", author: "VettedHands", builtin: true,
  title: "How VettedHands works",
  body: [
    "FOR CUSTOMERS",
    "1. Tap Request a service, describe the job and pick your area. You can send it to more than one artisan.",
    "2. Artisans who accept can then chat with you. Compare, ask questions, agree a time.",
    "3. Confirm the one you want. Your other requests for that job close automatically.",
    "4. The artisan starts the job and marks it done. You confirm and leave a review.",
    "",
    "FOR ARTISANS",
    "1. Turn on Available so customers can see you.",
    "2. Accept a request to open the chat. You can't message before accepting.",
    "3. Wait for the customer to confirm the booking, then tap Start job and Mark done.",
    "4. Good reviews build your rating and earn the Top Rated badge.",
    "",
    "STAY SAFE",
    "Keep chats inside VettedHands so reports can be checked. Never share your PIN. Don't send money in advance or outside the app. If something goes wrong, use Report on the job.",
  ].join("\n"),
};

function postDate(d) { return timeAgo(d); }

function BlogSection({ token, user, isArtisan, flash, fail, onBack }) {
  const [screen, setScreen] = useState({ name: "list" }); // list | post | write | mine
  const [tab, setTab] = useState("ALL");
  const [posts, setPosts] = useState(null);
  const [mine, setMine] = useState([]);

  async function load() {
    try {
      const [a, b] = await Promise.all([api("/api/blog", { token }), api("/api/blog/mine", { token })]);
      setPosts(a.posts); setMine(b.posts);
    } catch (e) { setPosts((p) => p || []); fail(e); }
  }
  useEffect(() => { load(); }, []);

  if (screen.name === "post") {
    return <BlogPostView token={token} id={screen.id} seed={screen.seed} isArtisan={isArtisan} flash={flash} fail={fail}
      onBack={() => { setScreen({ name: screen.from || "list" }); load(); }} />;
  }
  if (screen.name === "write") {
    return <BlogWrite token={token} isArtisan={isArtisan} flash={flash} fail={fail}
      onBack={() => setScreen({ name: "list" })} onDone={() => { load(); setScreen({ name: "mine" }); }} />;
  }

  const open = (p, from) => setScreen({ name: "post", id: p.id, seed: p, from });

  if (screen.name === "mine") {
    return (
      <div className="screen bl">
        <div className="bl-head"><button className="iconbtn" onClick={() => setScreen({ name: "list" })} aria-label="Back"><ArrowLeft size={18} /></button><h1>Your posts</h1></div>
        {mine.length === 0 && <div className="bl-empty"><b>Nothing yet.</b>Posts you write will show up here with their status.</div>}
        <div className="bl-list">
          {mine.map((p) => { const [l, c] = POST_STATE[p.status]; return (
            <button key={p.id} className="bl-card" onClick={() => open(p, "mine")}>
              <span className="bl-top"><span className={"bl-pill bl-pill--" + c}>{l}</span><span className="bl-kind">{KIND_LABEL[p.kind]}</span></span>
              <b>{p.title}</b>
              {(p.status === "REJECTED" || p.status === "HIDDEN") && p.rejectionReason && <p className="bl-why">{p.rejectionReason}</p>}
              <small>{postDate(p.createdAt)}</small>
            </button>
          ); })}
        </div>
      </div>
    );
  }

  const live = (posts || []).filter((p) => tab === "ALL" || p.kind === tab);
  const showBuiltIn = tab === "ALL" || tab === "GUIDE";
  const waiting = mine.filter((p) => p.status === "PENDING").length;
  return (
    <div className="screen bl">
      <div className="bl-head">
        <button className="iconbtn" onClick={onBack} aria-label="Back"><ArrowLeft size={18} /></button>
        <h1>Blog</h1>
        <button className="bl-write" onClick={() => setScreen({ name: "write" })}><Pen size={15} /> Write</button>
      </div>
      <div className="chip-row bl-tabs">
        {[["ALL", "All"], ["STORY", "Stories"], ["UPDATE", "Updates"], ["GUIDE", "Guides"]].map(([k, l]) =>
          <button key={k} className={"chip" + (tab === k ? " chip--active" : "")} onClick={() => setTab(k)}>{l}</button>)}
      </div>
      {mine.length > 0 && (
        <button className="bl-mine" onClick={() => setScreen({ name: "mine" })}>
          <span>Your posts{waiting ? ` · ${waiting} waiting for approval` : ""}</span><ChevronRight size={16} />
        </button>
      )}
      <div className="bl-list">
        {showBuiltIn && (
          <button className="bl-card bl-card--guide" onClick={() => open(BUILT_IN_GUIDE, "list")}>
            <span className="bl-top"><span className="bl-pill bl-pill--green">Start here</span><span className="bl-kind">Guide</span></span>
            <b>{BUILT_IN_GUIDE.title}</b>
            <p>A two minute walk through requests, booking and reviews.</p>
          </button>
        )}
        {posts === null && <div className="bl-empty">Loading…</div>}
        {live.map((p) => (
          <button key={p.id} className="bl-card" onClick={() => open(p, "list")}>
            <span className="bl-top"><span className={"bl-kindpill bl-kindpill--" + p.kind}>{KIND_LABEL[p.kind]}</span><small>{postDate(p.createdAt)}</small></span>
            <b>{p.title}</b>
            <p>{p.body.length > 150 ? p.body.slice(0, 150).trim() + "…" : p.body}</p>
            <span className="bl-by">
              {p.kind === "STORY" && p.artisan ? <>{p.author} on <i>{p.artisan.name}</i> · {tradeLabel(p.artisan.trade)}</> : p.kind === "UPDATE" && p.artisan ? <>{p.author}</> : <>{p.author}</>}
              {p.reply && <span className="bl-replied"> · Artisan replied</span>}
            </span>
          </button>
        ))}
        {posts !== null && live.length === 0 && !showBuiltIn && <div className="bl-empty"><b>Nothing here yet.</b>Be the first to write one.</div>}
      </div>
      <p className="bl-foot">Posts are checked by VettedHands before they appear. Keep it honest and respectful.</p>
    </div>
  );
}

function BlogPostView({ token, id, seed, isArtisan, flash, fail, onBack }) {
  const [p, setP] = useState(seed || null);
  const [reporting, setReporting] = useState(false);
  const [reason, setReason] = useState(REPORT_REASONS[0]);
  const [reply, setReply] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (seed && seed.builtin) return;
    api(`/api/blog/${id}`, { token }).then((d) => setP(d.post)).catch((e) => { if (!seed) fail(e); });
  }, [id]);
  if (!p) return <div className="screen bl"><div className="bl-head"><button className="iconbtn" onClick={onBack}><ArrowLeft size={18} /></button></div><div className="bl-empty">Loading…</div></div>;

  async function act(fn) { if (busy) return; setBusy(true); try { await fn(); } catch (e) { fail(e); } finally { setBusy(false); } }
  const sendReport = () => act(async () => { await api(`/api/blog/${p.id}/report`, { method: "POST", token, body: { reason } }); setReporting(false); flash("Thanks. We'll look at this post."); });
  const sendReply = () => act(async () => { const d = await api(`/api/blog/${p.id}/reply`, { method: "POST", token, body: { text: reply } }); setP(d.post); setReply(""); flash("Reply posted"); });
  const del = () => act(async () => { if (!window.confirm("Delete this post?")) return; await api(`/api/blog/${p.id}`, { method: "DELETE", token }); flash("Post deleted"); onBack(); });
  const [stateLabel, stateCls] = POST_STATE[p.status] || [];
  const canReply = p.kind === "STORY" && p.status === "PUBLISHED" && p.artisan && p.artisan.mine && !p.reply;

  return (
    <div className="screen bl">
      <div className="bl-head"><button className="iconbtn" onClick={onBack} aria-label="Back"><ArrowLeft size={18} /></button><h1>{KIND_LABEL[p.kind]}</h1></div>
      <article className="bl-post">
        {p.mine && p.status !== "PUBLISHED" && <div className={"bl-state bl-state--" + stateCls}><b>{stateLabel}</b>{p.rejectionReason && <span>{p.rejectionReason}</span>}{p.status === "PENDING" && <span>An admin will review it soon.</span>}</div>}
        <h2>{p.title}</h2>
        <div className="bl-meta">
          <span className="bl-av">{initials(p.author)}</span>
          <span><b>{p.author}</b>{!p.builtin && <small> · {postDate(p.createdAt)}</small>}</span>
        </div>
        {p.kind === "STORY" && p.artisan && <div className="bl-about"><ShieldCheck size={16} /> About <b>{p.artisan.name}</b> · {tradeLabel(p.artisan.trade)} · {p.artisan.area}</div>}
        <div className="bl-body">{p.body.split("\n").map((line, i) => line === "" ? <div key={i} className="bl-gap" /> : /^[A-Z ]{4,}$/.test(line) ? <h3 key={i}>{line}</h3> : <p key={i}>{line}</p>)}</div>
        {p.reply && <div className="bl-reply"><small>Reply from {p.artisan ? p.artisan.name.split(" ")[0] : "the artisan"}</small><p>{p.reply.text}</p></div>}
      </article>
      {canReply && (
        <div className="bl-replybox">
          <b>Reply to this story</b>
          <textarea value={reply} onChange={(e) => setReply(e.target.value.slice(0, 500))} placeholder="Say thanks or give your side. You can reply once." />
          <button className="primary-btn" disabled={busy || reply.trim().length < 2} onClick={sendReply}>Post reply</button>
        </div>
      )}
      {!p.builtin && (
        <div className="bl-actions">
          {p.mine ? <button className="bl-link bl-link--danger" onClick={del}><Trash size={15} /> Delete post</button>
            : p.status === "PUBLISHED" && !reporting && <button className="bl-link" onClick={() => setReporting(true)}><Flag size={15} /> Report this post</button>}
        </div>
      )}
      {reporting && (
        <div className="bl-replybox">
          <b>What's wrong with it?</b>
          <select value={reason} onChange={(e) => setReason(e.target.value)}>{REPORT_REASONS.map((r) => <option key={r}>{r}</option>)}</select>
          <button className="primary-btn" disabled={busy} onClick={sendReport}>Send report</button>
          <button className="ghost-btn" onClick={() => setReporting(false)}>Cancel</button>
        </div>
      )}
    </div>
  );
}

function BlogWrite({ token, isArtisan, flash, fail, onBack, onDone }) {
  const [jobs, setJobs] = useState(null);
  const [kind, setKind] = useState(isArtisan ? "UPDATE" : "STORY");
  const [requestId, setRequestId] = useState("");
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    api("/api/blog/eligible", { token }).then((d) => { setJobs(d.jobs); if (d.jobs[0]) setRequestId(d.jobs[0].requestId); }).catch((e) => { setJobs([]); fail(e); });
  }, []);
  const story = kind === "STORY";
  const noJobs = story && jobs && jobs.length === 0;
  const ok = !busy && title.trim().length >= 3 && body.trim().length >= 20 && (!story || requestId);
  async function submit() {
    if (!ok) return;
    setBusy(true);
    try {
      await api("/api/blog", { method: "POST", token, body: { kind, title: title.trim(), body: body.trim(), requestId: story ? requestId : undefined } });
      flash("Sent for approval");
      onDone();
    } catch (e) { fail(e); } finally { setBusy(false); }
  }
  return (
    <div className="screen bl">
      <div className="bl-head"><button className="iconbtn" onClick={onBack} aria-label="Back"><ArrowLeft size={18} /></button><h1>Write a post</h1></div>
      {isArtisan && (
        <div className="ms-seg bl-seg">
          <button className={kind === "UPDATE" ? "on" : ""} onClick={() => setKind("UPDATE")}>My update</button>
          <button className={kind === "STORY" ? "on" : ""} onClick={() => setKind("STORY")}>Story about a job</button>
        </div>
      )}
      <div className="bl-form">
        {story && (
          <label>Which job is this about?
            {jobs === null ? <span className="bl-hint">Loading…</span> : noJobs ? <span className="bl-hint">You can write a story after a job is completed. None are ready yet.</span> :
              <select value={requestId} onChange={(e) => setRequestId(e.target.value)}>{jobs.map((j) => <option key={j.requestId} value={j.requestId}>{j.artisanName} · {tradeLabel(j.trade)} · {j.job.slice(0, 32)}</option>)}</select>}
          </label>
        )}
        {!noJobs && <>
          <label>Title<input value={title} maxLength={90} onChange={(e) => setTitle(e.target.value)} placeholder={story ? "e.g. Fixed my socket in one visit" : "e.g. Now taking weekend jobs"} /></label>

          <button className="primary-btn" disabled={!ok} onClick={submit}>{busy ? "Sending…" : "Send for approval"}</button>
        </>}
      </div>
    </div>
  );
}

/* ---------------- Artisan profile ---------------- */
function timeAgo(d) {
  const days = Math.floor((Date.now() - new Date(d).getTime()) / 864e5);
  if (days < 1) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 14) return `${days} days ago`;
  if (days < 60) return `${Math.floor(days / 7)} weeks ago`;
  return `${Math.floor(days / 30)} months ago`; 
}

/* ---------------- Request flow ---------------- */
const WHEN_OPTIONS = [
  { id: "asap", label: "As soon as possible", sub: "Next available artisan", short: "ASAP" },
  { id: "today", label: "Today", sub: "Afternoon", short: "Today" },
  { id: "tomorrow", label: "Tomorrow", sub: "Morning", short: "Tomorrow" },
  { id: "date", label: "Pick a date", sub: "Choose day and time", short: "Scheduled" },
];
const SORTS = [["best", "Best match"], ["area", "Distance"], ["rating", "Rating"], ["jobs", "Jobs completed"]];

function whenText(w) {
  if (w.when === "today") return "Today afternoon";
  if (w.when === "tomorrow") return "Tomorrow morning";
  if (w.when === "date" && w.whenDate) {
    const d = new Date(w.whenDate);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }
  return "As soon as possible";
}

// Trade match is the search itself. Then: available, same area, verification,
// rating (weighted by jobs so one 5-star job cannot outrank a proven record), jobs completed.
function matchScore(a, area) {
  let s = 0;
  if (a.online) s += 1000;
  if (a.area === area) s += 400;
  if (a.skillVerified) s += 120;
  if (a.badge === "TOP_RATED") s += 120;
  if (a.isPro) s += 150;
  s += Number(a.rating || 0) * 20 * Math.min(1, (a.jobsCompleted || 0) / 5);
  s += Math.min(a.jobsCompleted || 0, 50);
  return s;
}

function RequestFlow({ wiz, setWiz, meId, onBack, onSelectArtisan, onSendDirect }) {
  const set = (patch) => setWiz((w) => ({ ...w, ...patch }));
  const [photoBusy, setPhotoBusy] = useState(false);
  const [sending, setSending] = useState(false);
  async function sendDirect() {
    if (sending) return;
    setSending(true);
    try { await onSendDirect(); } finally { setSending(false); }
  }
  const formOk = wiz.trade && wiz.problem.trim().length >= 10 && (wiz.when !== "date" || !!wiz.whenDate);

  async function pickPhoto(e) {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setPhotoBusy(true);
    try { set({ image: await fileToDataUrl(f) }); } finally { setPhotoBusy(false); }
  }
  async function search() {
    set({ step: 2, loading: true, searched: false, sort: "best" });
    try {
      const d = await api(`/api/artisans?trade=${wiz.trade}`);
      set({ results: d.artisans.filter((a) => a.user.id !== meId), loading: false, searched: true });
    } catch (e) { set({ results: [], loading: false, searched: true }); }
  }

  const list = useMemo(() => {
    const arr = [...wiz.results];
    const sc = (a) => matchScore(a, wiz.area);
    if (wiz.sort === "area") arr.sort((a, b) => (b.area === wiz.area) - (a.area === wiz.area) || sc(b) - sc(a));
    else if (wiz.sort === "rating") arr.sort((a, b) => (b.rating - a.rating) || (b.jobsCompleted - a.jobsCompleted));
    else if (wiz.sort === "jobs") arr.sort((a, b) => (b.jobsCompleted - a.jobsCompleted) || (b.rating - a.rating));
    else arr.sort((a, b) => sc(b) - sc(a));
    return arr;
  }, [wiz.results, wiz.sort, wiz.area]);

  const whenShort = (WHEN_OPTIONS.find((o) => o.id === wiz.when) || WHEN_OPTIONS[0]).short;

  return (
    <div className="screen rf">
      <div className="rf-top">
        <button className="rf-back" onClick={() => (wiz.step === 2 ? set({ step: 1 }) : onBack())} aria-label="Back"><ArrowLeft size={22} /></button>
        <span>{wiz.direct ? "New request" : `New request · Step ${wiz.step} of 2`}</span>
      </div>

      {wiz.step === 1 ? (
        <>
          <h1 className="rf-h">{wiz.direct ? `Request ${wiz.direct.user.name.split(" ")[0]}` : "What do you need help with?"}</h1>
          <p className="rf-sub">{wiz.direct ? "Describe the job so they can quote and prepare." : "The clearer the job, the better the match."}</p>

          {!wiz.direct && <div className="rf-label">Service category</div>}
          <div className="rf-chips">
            {(wiz.direct ? [] : trades).map((t) => <button key={t.id} type="button" className={"rf-chip" + (wiz.trade === t.id ? " on" : "")} onClick={() => set({ trade: t.id })}>{t.label}</button>)}
          </div>

          <div className="rf-label">Describe the job</div>
          <textarea className="rf-text" rows={4} maxLength={500} value={wiz.problem} onChange={(e) => set({ problem: e.target.value })} placeholder="e.g. The socket in my kitchen sparks when I plug anything in." />
          <div className="rf-count"><span>Mention what you see, hear or smell.</span><span>{wiz.problem.length} / 500</span></div>

          <div className="rf-label">Your location</div>
          <label className="rf-field">
            <MapPin size={18} />
            <select value={wiz.area} onChange={(e) => set({ area: e.target.value })}>
              {areas.filter((a) => a !== "All areas").map((a) => <option key={a} value={a}>{a}, Ado-Ekiti</option>)}
            </select>
            <ChevronDown size={16} />
          </label>

          <div className="rf-label">Preferred time</div>
          <div className="rf-times">
            {WHEN_OPTIONS.map((o) => (
              <button key={o.id} type="button" className={"rf-time" + (wiz.when === o.id ? " on" : "")} onClick={() => set({ when: o.id })}>
                <b>{o.label}</b><span>{o.sub}</span>
              </button>
            ))}
          </div>
          {wiz.when === "date" && <input className="rf-date" type="datetime-local" value={wiz.whenDate} onChange={(e) => set({ whenDate: e.target.value })} />}

          <div className="rf-label">Photo <small>(optional)</small></div>
          <div className="rf-photo">
            <label className="rf-add">
              <input type="file" accept="image/*" style={{ display: "none" }} onChange={pickPhoto} />
              <span>{photoBusy ? "…" : "+"}</span>Add
            </label>
            {wiz.image && (
              <div className="rf-thumb">
                <img src={wiz.image} alt="Photo of the problem" />
                <button type="button" onClick={() => set({ image: null })} aria-label="Remove photo"><X size={12} /></button>
              </div>
            )}
            <p>A clear photo helps artisans quote and prepare tools.</p>
          </div>

          <div className="rf-bar">
            <div className="rf-note"><ShieldCheck size={16} /> Only vetted artisans are matched. No payment needed to request.</div>
            <button className="rf-go" disabled={!formOk || photoBusy || sending} onClick={wiz.direct ? sendDirect : search}>{wiz.direct ? (sending ? "Sending…" : `Send request to ${wiz.direct.user.name.split(" ")[0]}`) : "Find trusted artisans"}</button>
          </div>
        </>
      ) : (
        <>
          <h1 className="rf-h">
            {wiz.loading ? "Finding trusted artisans…" : list.length ? `We found ${list.length} trusted ${list.length === 1 ? "artisan" : "artisans"} near you` : "No artisans available for this service right now"}
          </h1>
          <div className="rf-tags"><span>{tradeLabel(wiz.trade)}</span><span>{wiz.area}</span><span>{whenShort}</span></div>

          {!wiz.loading && wiz.searched && list.length === 0 && (
            <div className="rf-empty">
              <div className="rf-empty-ic"><MapPin size={26} /></div>
              <b>No artisans available for this service right now.</b>
              <p>Nobody vetted for {tradeLabel(wiz.trade)} is listed in Ado-Ekiti yet. Try another service, or check back soon.</p>
              <button className="rf-ghost" onClick={() => set({ step: 1 })}>Try another service</button>
            </div>
          )}

          {list.length > 0 && (
            <>
              <div className="rf-info"><ShieldCheck size={18} /><span>Ranked by trade match, availability, distance, verification, rating and jobs completed.</span></div>
              <div className="rf-sorts">
                {SORTS.map(([k, l]) => <button key={k} className={"rf-sort" + (wiz.sort === k ? " on" : "")} onClick={() => set({ sort: k })}>{l}</button>)}
              </div>
              <div className="rf-list">
                {list.map((a) => { const [bg, fg] = tintFor(a.id); return (
                  <div key={a.id} className="rf-card">
                    <div className="rf-card-top">
                      <span className="rf-av" style={{ background: bg, color: fg }}><Face u={a.user} /></span>
                      <div className="rf-id"><b>{a.user.name}</b><span>{tradeLabel(a.trade)}{a.area === wiz.area ? " · Same area" : ""}</span></div>
                      <span className="rf-rate"><Star size={14} fill="#B5651D" stroke="none" /><b>{fmtStars(a.rating)}</b></span>
                    </div>
                    <div className="rf-badges">
                      <span className="rf-b rf-b--g"><ShieldCheck size={13} /> Vetted</span>
                      {a.skillVerified && <span className="rf-b rf-b--b">Skill Verified</span>}
                      {a.isPro && <span className="rf-b rf-b--a">Member</span>}
                      {a.badge === "TOP_RATED" && <span className="rf-b rf-b--a">Top Rated</span>}
                    </div>
                    <div className="rf-meta">
                      <span><b>{a.jobsCompleted}</b> jobs completed</span>
                      <span><MapPin size={13} /> {a.area}</span>
                      <span className={a.online ? "rf-on" : "rf-off"}><i />{a.online ? "Available now" : "Offline"}</span>
                    </div>
                    <button className="rf-view" onClick={() => onSelectArtisan(a)}>View profile</button>
                  </div>
                ); })}
              </div>
            </>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------- Requests tab ---------------- */
function statusMeta(status) {
  const map = {
    PENDING: { label: "Pending", cls: "badge--pending" },
    ACCEPTED: { label: "Accepted", cls: "badge--accepted" },
    CONFIRMED: { label: "Confirmed", cls: "badge--confirmed" },
    COMPLETED: { label: "Completed", cls: "badge--completed" },
    CLOSED: { label: "Closed", cls: "badge--closed" },
    DECLINED: { label: "Declined", cls: "badge--declined" },
    CANCELLED: { label: "Cancelled", cls: "badge--declined" },
  };
  return map[status] || { label: status, cls: "" };
}

/* ---------------- Requests tab (new design) ---------------- */
function pillFor(r, artisanSide) {
  const s = r.status;
  if (s === "PENDING") return artisanSide ? ["New request", "dark"] : ["Request sent", "amber"];
  if (s === "ACCEPTED") return r.quotedPrice ? (artisanSide ? ["Price agreed", "blue"] : ["Pay to confirm", "amber"]) : ["Agree the price", "blue"];
  if (s === "CONFIRMED" && r.payments && r.payments[0] && r.payments[0].status === "DISPUTED") return ["Under review", "red"];
  if (s === "CONFIRMED" && r.cancelRequestedAt) return ["Cancel requested", "amber"];
  if (s === "CONFIRMED") return r.artisanDoneAt ? (artisanSide ? ["Awaiting customer", "blue"] : ["Confirm job", "amber"]) : r.startedAt ? ["In progress", "green"] : ["Booked", "green"];
  if (s === "COMPLETED") return ["Completed", "dark"];
  if (s === "DECLINED") return ["Declined", "red"];
  if (s === "CANCELLED") return ["Cancelled", "red"];
  return ["Closed", "grey"];
}
// A plain-words "what happens now" line for the chat. `short` fits on the collapsed job bar, `text` is the full sentence.
function nextStepFor(r, artisanSide) {
  const st = r.status;
  const pay = r.payments && r.payments[0];
  if (st === "PENDING") return artisanSide ? { short: "Accept or decline", text: "New request. Accept it if you can do the job, or decline.", cta: "Open" } : { short: "Waiting for the artisan", text: "Request sent. Waiting for the artisan to reply." };
  if (st === "ACCEPTED" && !r.quotedPrice) return artisanSide
    ? { short: "Send your quote", text: "Agree the details in the chat, then send your quote from View job.", cta: "Quote" }
    : { short: "Review the quote when it comes", text: "Chat about the job. When the artisan sends a quote, open View job to accept it or counter.", cta: "Quote" };
  if (st === "ACCEPTED") return artisanSide
    ? { short: "Waiting for payment", text: "Price agreed. Waiting for the customer to pay. You can start once they have." }
    : { short: "Pay to confirm", text: "Price agreed. Pay now to confirm your booking. Your money is held safely until the job is done.", cta: "Pay now" };
  if (st === "CONFIRMED" && pay && pay.status === "DISPUTED") return { short: "VettedHands is reviewing", text: "VettedHands is reviewing this job. You will be told the result here." };
  if (st === "CONFIRMED" && r.cancelRequestedAt) return { short: "Reply to cancellation", text: "A cancellation request is waiting for a reply.", cta: "Open" };
  if (st === "CONFIRMED" && r.artisanDoneAt) return artisanSide
    ? { short: "Waiting for the customer", text: "Marked done. Waiting for the customer to confirm. Once they confirm and review, payment is released and this chat closes." }
    : { short: "Confirm the job", text: "The artisan says the job is done. Confirm it to release payment and leave a review. The chat closes once you confirm, so ask anything you need first.", cta: "Confirm" };
  if (st === "CONFIRMED" && r.startedAt) return artisanSide
    ? { short: "Tap Job done when finished", text: "Job in progress. Tap Job done in View job when you finish. You can also ask for extra work payment there.", cta: "Open" }
    : { short: "Work in progress", text: "The job is in progress. If more work is needed, the artisan can ask you for extra payment here." };
  if (st === "CONFIRMED") return artisanSide
    ? { short: "Start the job", text: "Booked and paid. Start the job from View job when you begin work.", cta: "Start" }
    : { short: "Artisan will start soon", text: "Booked. Your payment is held safely. The artisan will start soon." };
  if (st === "COMPLETED") return { short: artisanSide ? "Payout in Earnings" : "Receipt ready", text: artisanSide ? "Job complete. Your payout and receipt are in Earnings." : "Job complete. Your receipt is ready under View job.", cta: "Open" };
  return null;
}
function reqBucket(r, meId) {
  if (r.status === "COMPLETED") return "completed";
  if (r.status === "DECLINED" || r.status === "CLOSED" || r.status === "CANCELLED") return "cancelled";
  if (r.status === "PENDING" && r.artisanProfile.user.id === meId) return "new";
  return "active";
}

const REPLY_WINDOW_MIN = 30;
function ReplyTimer({ since }) {
  const [, tick] = useState(0);
  useEffect(() => { const id = setInterval(() => tick((n) => n + 1), 30000); return () => clearInterval(id); }, []);
  const left = Math.ceil((new Date(since).getTime() + REPLY_WINDOW_MIN * 60000 - Date.now()) / 60000);
  if (left <= 0) return <span className="rq-timer rq-timer--late"><Clock size={13} /> Reply overdue</span>;
  return <span className="rq-timer"><Clock size={13} /> Reply in {left} min</span>;
}

  const [tab, setTab] = useState(isArtisan && requests.some((r) => bucketOf(r) === "new") ? "new" : "active");

/* ---------------- Request tracking ---------------- */
function TrackView({ request: r, user, onBack, onMessage, onConfirm, onRespond, onStart, onDone, onReview, onReport, onReceipt, onBookAgain, onCancelAction, quote }) {
  const [busy, setBusy] = useState(false);

  const ap = r.artisanProfile;
  const artisanSide = ap.user.id === user.id;

  const first = other.name.split(" ")[0];
  const s = r.status;
  const ended = s === "DECLINED" || s === "CLOSED" || s === "CANCELLED";
  const booked = s === "CONFIRMED" && !r.startedAt && !r.artisanDoneAt;
  const working = s === "CONFIRMED" && !!r.startedAt && !r.artisanDoneAt;
  const waitingConfirm = s === "CONFIRMED" && !!r.artisanDoneAt;
  const disputed = !!(r.payments && r.payments[0] && r.payments[0].status === "DISPUTED");
  const done = ended || s === "PENDING" ? 1 : s === "ACCEPTED" ? 2 : booked || working ? 3 : waitingConfirm ? 4 : 6;
  const current = ended ? -1 : s === "PENDING" ? 1 : s === "ACCEPTED" ? 2 : booked || working ? 3 : waitingConfirm ? 4 : -1;
  const [label, cls] = pillFor(r, artisanSide);

  async function run(fn) { if (busy) return; setBusy(true); try { await fn(); } finally { setBusy(false); } }

  else if (s === "ACCEPTED") head = artisanSide ? `Waiting for ${first} to confirm the booking` : `${first} accepted for ${naira(r.quotedPrice)}. Pay to book them`;
  else if (booked) head = artisanSide ? `${first} booked you. Start when you're ready` : `${first} is booked for your job`;
  else if (working) head = artisanSide ? `You're working on ${first}'s job` : `${first} is working on your job`;
  else if (waitingConfirm) head = artisanSide ? `Waiting for ${first} to confirm` : `${first} marked the job done`;
  else head = r.rating ? "Job completed and reviewed" : "Job completed";
  if (s === "ACCEPTED" && !r.quotedPrice) head = artisanSide ? "Send a quote to agree the price" : `${first} accepted. Agree the price to go ahead`;
  const sub = `${tradeLabel(ap.trade)}${r.area ? " · " + r.area : ""} · ${r.when}`;
  const startedTxt = r.startedAt ? `Started ${dayLabel(r.startedAt)}, ${clockTime(r.startedAt)}` : s === "COMPLETED" ? "Work finished" : "Work under way";
  const steps = [
    ["Request sent", `${dayLabel(r.createdAt)}, ${clockTime(r.createdAt)} · ${artisanSide ? "From " + r.student.name : "Sent to " + ap.user.name}`],
    ["Artisan accepted", s === "PENDING" ? `Waiting for ${artisanSide ? "you" : first} to reply` : s === "DECLINED" ? "The request was declined" : s === "CLOSED" ? "The request was closed" : s === "CANCELLED" ? "The request was cancelled" : "Request accepted"],
    ["Booking confirmed", s === "PENDING" ? "After the artisan accepts" : ended ? "Not reached" : s === "ACCEPTED" ? (artisanSide ? "Waiting for the customer to confirm" : `Pay to book ${first}. Your other requests for this job close once payment goes through`) : "The customer confirmed the booking"],
    ["Job in progress", s === "ACCEPTED" || booked ? (artisanSide ? (booked ? "Tap Start job when you begin" : "After the customer confirms") : `Starts when ${first} begins the job`) : working || waitingConfirm || s === "COMPLETED" ? startedTxt : "Starts once the artisan begins"],    ["Job completed", s === "COMPLETED" ? "Marked done and confirmed" : waitingConfirm ? (artisanSide ? "Waiting for the customer to confirm" : `${first} marked it done. Confirm it to review`) : artisanSide ? "You mark it done, the customer confirms" : `${first} marks it done, you confirm`],
    [artisanSide ? "Customer review" : "Review artisan", r.rating ? `Rated ${r.rating} out of 5` : "Rate the work and help others hire with confidence"],
  ];
  return (
    <div className="screen tk">
      <div className="tk-top"><button className="tk-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button><span>Request {reqCode(r.id)}</span></div>
      <span className={"rq-pill tk-pill rq-pill--" + cls}><i />{label}</span>
      <h1 className="tk-h">{head}</h1>
      <p className="tk-sub">{sub}</p>

      <div className="tk-card">
        {steps.map(([t, d], i) => (
          <div key={t} className={"tk-step " + (i < done ? "tk-step--done" : i === current ? "tk-step--now" : "tk-step--todo")}>
            <span className="tk-dot">{i < done && <Check size={20} strokeWidth={3} />}</span>
            <div className="tk-st"><b>{t}</b><span>{d}</span></div>
          </div>
        ))}
      </div>

      {(() => {
  const pay = r.payments && r.payments[0];
  if (!pay || ["PENDING", "FAILED"].includes(pay.status)) return null;
if (s === "CANCELLED" && pay.status === "HELD") return <div className="tk-pay"><b>Refund in progress</b><span>The booking was cancelled. {artisanSide ? "The customer is being refunded." : `Your ${naira(pay.amount)} is being returned to you. This usually takes a minute, then a few days to show in your account.`}</span></div>;
  const when = pay.releaseAfter ? ` Auto-release: ${new Date(pay.releaseAfter).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}.` : "";
  const m = {
    HELD: ["Payment secured", artisanSide ? `${naira(pay.artisanPayout)} will be paid to you when ${first} confirms the job.${when}` : `${naira(pay.amount)} is held safely by VettedHands. It is released to ${first} when you confirm the job is done.${when}`],
    DISPUTED: ["Payment on hold", "A report was filed on this job. VettedHands is reviewing it and the money stays held until we decide."],
    RELEASED: ["Payment released", artisanSide ? `${naira(pay.artisanPayout)} was sent to your bank account.` : `${naira(pay.amount)} was released to ${first}.`],
    REFUNDED: ["Payment refunded", artisanSide ? "The customer was refunded." : "Your money was returned to you."],
  }[pay.status];
  return m ? <div className="tk-pay"><b>{m[0]}</b><span>{m[1]}</span></div> : null;
})()}
{quote && (s === "ACCEPTED" || r.quotedPrice) && <QuotePanel request={r} user={user} {...quote} />}
{quote && s === "CONFIRMED" && <AddOnPanel request={r} user={user} {...quote} />}
<div className="tk-actions">
        {artisanSide && s === "PENDING" && (
          <div className="rq-acts" style={{ marginTop: 0 }}>
            <button className="d" onClick={() => onRespond("DECLINED")}>Decline</button>
            <button className="a" onClick={() => onRespond("ACCEPTED")}>Accept</button>
          </div>
        )}
        {artisanSide && s === "ACCEPTED" && !!r.quotedPrice && <div className="tk-note">Price agreed. Waiting for {first} to pay and confirm the booking.</div>}
        {!artisanSide && s === "ACCEPTED" && !!r.quotedPrice && !confirming && <button className="tk-btn" onClick={() => setConfirming(true)}>Pay {naira(r.quotedPrice)} to confirm {first}</button>}
        {!artisanSide && s === "ACCEPTED" && !!r.quotedPrice && confirming && (
          <div className="inline-confirm">
            <div className="inline-confirm-text">You pay {naira(r.quotedPrice)} now. VettedHands holds it safely and releases it to {first} only after you confirm the job is done. Your other requests for this job close once payment goes through.</div>
            <div className="settle-actions">
              <button className="ghost-btn" onClick={() => setConfirming(false)}>Cancel</button>
              <button className="settle-btn" disabled={busy} onClick={() => run(async () => { await onConfirm(); setConfirming(false); })}>{busy ? "Opening payment…" : "Pay now"}</button>
            </div>
          </div>
        )}
        {artisanSide && booked && <button className="tk-btn" disabled={busy} onClick={() => run(onStart)}>{busy ? "Starting…" : "Start job"}</button>}
        {artisanSide && working && <button className="tk-btn" disabled={busy} onClick={() => run(onDone)}>{busy ? "Saving…" : "Mark job done"}</button>}
        {!artisanSide && waitingConfirm && !disputed && <button className="tk-btn" onClick={onReview}>Confirm job done and review</button>}
        {!artisanSide && waitingConfirm && disputed && <div className="tk-note">This job is under review by VettedHands. We will decide what happens to the payment and update you here.</div>}
        {s === "COMPLETED" && !artisanSide && onBookAgain && <button className="tk-btn" onClick={onBookAgain}>Book this artisan again</button>}
        {s === "COMPLETED" && !!r.quotedPrice && onReceipt && <button className="tk-btn" style={{ background: "var(--surface)", color: "var(--primary)", border: "1.5px solid var(--primary)" }} onClick={onReceipt}>View receipt</button>}
      </div>

      <div className="tk-card">
        <div className="tk-ac">
          <span className="tk-av" style={{ background: bg, color: fg }}><Face u={other} /></span>
          <div><b>{other.name}</b><span>{artisanSide ? "Customer" : `Vetted · ${fmtStars(ap.rating)} ★ · ${ap.jobsCompleted} jobs completed`}</span></div>
        </div>
        <button className="tk-msg" onClick={onMessage}><MessageCircle size={20} /> Message {artisanSide ? "customer" : "artisan"}</button>
        {!artisanSide && !ended && s !== "COMPLETED" && (
          <div className="tk-lock">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            <span>You can review {first} once they mark the job done and you confirm it.</span>
          </div>
        )}
      </div>
      {!ended && s !== "COMPLETED" && <CancelBar request={r} user={user} onAction={onCancelAction} />}
      {!ended && <button className="tk-report" onClick={onReport}>Report a problem with this job</button>}
    </div>
  );
}

/* ---------------- Cancelling ---------------- */
const CANCEL_REASONS = {
  customer: ["Found another artisan", "Artisan is not responding", "I no longer need this done", "Price or terms didn't work", "The time doesn't work for me", "Other"],
  artisan: ["I can't make the time", "This job is outside my skill", "Customer is not responding", "Price or terms didn't work", "The location is too far", "Other"],
};
function CancelBar({ request: r, user, onAction, compact }) {
  const artisanSide = r.artisanProfile.user.id === user.id;
  const other = artisanSide ? r.student : r.artisanProfile.user;
  const first = other.name.split(" ")[0];
  const [sheet, setSheet] = useState(null); // "ask" | "reply"
  const [reason, setReason] = useState("");
  const [note, setNote] = useState("");
  const noFunds = true, setNoFunds = () => {}; // payments are held by VettedHands now, so the old "no money exchanged" tick is gone
  const [busy, setBusy] = useState(false);
  const s = r.status;
  const booked = s === "CONFIRMED";
  const iAsked = booked && r.cancelRequestedById === user.id;
  const theyAsked = booked && !!r.cancelRequestedAt && r.cancelRequestedById !== user.id;
  if (booked && r.artisanDoneAt) return null;
  if (booked && r.payments && r.payments[0] && ["DISPUTED"].includes(r.payments[0].status)) return null; // frozen while VettedHands reviews
  if (s === "PENDING" && artisanSide) return null; // artisans decline pending requests instead
  if (!["PENDING", "ACCEPTED", "CONFIRMED"].includes(s)) return null;
  const list = CANCEL_REASONS[artisanSide ? "artisan" : "customer"];
  const reasonOk = reason && (reason !== "Other" || note.trim().length >= 3);
  async function go(path, method, body, msg) {
    if (busy) return;
    setBusy(true);
    try { const ok = await onAction(path, method, body, msg); if (ok) { setSheet(null); setReason(""); setNote(""); setNoFunds(false); } } finally { setBusy(false); }
  }
  const label = booked ? "Cancel booking" : artisanSide ? "Withdraw from this job" : `Cancel request to ${first}`;
  return (
    <>
      {theyAsked ? (
        <div className="cx-card">
          <b>{first} asked to cancel this booking</b>
          <span>Reason: {r.cancelReason}{r.cancelNote ? ` (${r.cancelNote})` : ""}</span>
          <div className="cx-row"><button className="ghost-btn" disabled={busy} onClick={() => go("cancel-respond", "POST", { agree: false }, "Booking kept")}>Keep booking</button><button className="settle-btn" onClick={() => { setNoFunds(false); setSheet("reply"); }}>Agree to cancel</button></div>
        </div>
      ) : iAsked ? (
        <div className="cx-card cx-wait">
          <b>Waiting for {first} to agree to cancel</b>
          <button className="cx-link" disabled={busy} onClick={() => go("cancel-retract", "POST", {}, "Request withdrawn")}>Take it back</button>
        </div>
      ) : (
        <button className={"cx-btn" + (compact ? " cx-btn--compact" : "")} onClick={() => setSheet("ask")}>{label}</button>
      )}
      {sheet === "ask" && (
        <div className="sg-back" onClick={() => setSheet(null)}>
          <div className="sg-card" onClick={(e) => e.stopPropagation()}>
            <h3>{label}</h3>
            <p>{booked ? (r.startedAt ? `${first} has to agree before this booking is cancelled.` : "The booking is cancelled right away and the customer is refunded in full.") : `${first} will be told. This can't be undone.`} Why are you cancelling?</p>
            <div className="cx-reasons">
              {list.map((x) => (
                <label key={x} className={"cx-reason" + (reason === x ? " on" : "")}><input type="radio" name="cxr" checked={reason === x} onChange={() => setReason(x)} />{x}</label>
              ))}
            </div>
            {reason === "Other" && <textarea className="cx-note" rows={2} maxLength={300} placeholder="Tell us in a few words" value={note} onChange={(e) => setNote(e.target.value)} />}
            {booked && (
              <label className="cx-check"><input type="checkbox" checked={noFunds} onChange={(e) => setNoFunds(e.target.checked)} /><span>The payment is held by VettedHands and refunded in full to the customer.</span></label>
            )}
            {booked && <small className="cx-hint">Once the job has started, the other person must agree. The payment is then refunded in full. If some work was already done, use "Report a problem" instead so VettedHands can decide a fair split.</small>}
            <button className="primary-btn" style={{ margin: "10px 0 0" }} disabled={busy || !reasonOk || (booked && !noFunds)}
              onClick={() => go(booked ? "cancel" : "withdraw", booked ? "POST" : "PATCH", { reason, note: note.trim() || undefined, noFunds: booked ? true : undefined }, booked ? (r.startedAt ? "Cancellation sent" : "Booking cancelled") : "Request cancelled")}>
              {busy ? "Sending…" : booked ? (r.startedAt ? "Send cancellation request" : "Cancel booking") : "Cancel request"}
            </button>
            <button className="sg-x" onClick={() => setSheet(null)}>Back</button>
          </div>
        </div>
      )}
      {sheet === "reply" && (
        <div className="sg-back" onClick={() => setSheet(null)}>
          <div className="sg-card" onClick={(e) => e.stopPropagation()}>
            <h3>Agree to cancel?</h3>
            <p>Agreeing cancels the booking, and the held payment is refunded to the customer.</p>
            <label className="cx-check"><input type="checkbox" checked={noFunds} onChange={(e) => setNoFunds(e.target.checked)} /><span>The payment is held by VettedHands and refunded in full to the customer.</span></label>
            <small className="cx-hint">If the work was partly done and you disagree about money, use "Report a problem" instead.</small>
            <button className="primary-btn" style={{ margin: "10px 0 0" }} disabled={busy} onClick={() => go("cancel-respond", "POST", { agree: true, noFunds }, noFunds ? "Booking cancelled" : "Booking kept")}>
              {busy ? "Sending…" : noFunds ? "Cancel the booking" : "Money was exchanged, keep booking"}
            </button>
            <button className="sg-x" onClick={() => setSheet(null)}>Back</button>
          </div>
        </div>
      )}
    </>
  );
}

/* ---------------- Review ---------------- */
function ReviewView({ request: r, onClose, onSubmit }) {

  const [text, setText] = useState("");

  const who = r.artisanProfile.user;
  const first = who.name.split(" ")[0];
  const [bg, fg] = tintFor(who.id || r.id);
  const WORDS = ["", "Poor", "Fair", "Good", "Very good", "Excellent"];
  const GOOD = ["On time", "Clean work", "Fair price", "Explained clearly", "Good communication", "Went the extra mile"];
  const toggle = (t) => setTags((p) => (p.includes(t) ? p.filter((x) => x !== t) : [...p, t]));
  async function submit() {

  }
  return (
    <div className="screen rv">

/* ---------------- Report a problem ---------------- */
function ReportView({ request: r, user, onClose, onSubmit }) {
  const artisanSide = r.artisanProfile.user.id === user.id;
  const other = artisanSide ? r.student : r.artisanProfile.user;
  const [bg, fg] = tintFor(other.id || r.id);
  const opts = artisanSide
    ? [["Customer unavailable", "Nobody was there or they did not answer"], ["Rude or unsafe behaviour", "Threats, harassment or an unsafe place"], ["Fraud or suspicious behaviour", "Asked to work outside the app, fake request"], ["Other", "Something else we should know"]]
    : [["Artisan didn't show up", "They accepted but never arrived"], ["Poor service", "The work was unfinished or not as agreed"], ["Fraud or suspicious behaviour", "Asked for money outside the app, fake ID, threats"], ["Other", "Something else we should know"]];
  const [reason, setReason] = useState(opts[0][0]);
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  async function submit() {
    if (busy) return;
    setBusy(true);
    try { await onSubmit(reason, note.trim()); } finally { setBusy(false); }
  }
  return (
    <div className="screen rv">
      <div className="rv-top"><button className="tk-back" onClick={onClose} aria-label="Back"><ArrowLeft size={22} /></button><span>Report · Request {reqCode(r.id)}</span></div>
      <h1 className="rv-h" style={{ marginTop: 14 }}>{artisanSide ? "Report a customer" : "Report a problem"}</h1>
      <p className="rv-sub">{artisanSide ? "Customer wasn't there, or something felt wrong? Tell us so we can act." : "Tell us what went wrong with this job. Our team reviews every report and may contact you."}</p>
      <div className="rv-who">
        <span className="tk-av" style={{ background: bg, color: fg }}><Face u={other} /></span>
        <div><b>{other.name} · {tradeLabel(r.artisanProfile.trade)}</b><small>{r.when}{r.area ? " · " + r.area : ""}</small></div>
      </div>
      <div className="rv-label" style={{ marginTop: 22 }}>What happened?</div>
      {opts.map(([t, d]) => (
        <button key={t} type="button" className={"rp-opt" + (reason === t ? " on" : "")} onClick={() => setReason(t)}>
          <span className="rp-radio" />
          <span><b>{t}</b><em>{d}</em></span>
        </button>
      ))}
      <div className="rv-label" style={{ marginTop: 22 }}>Tell us more</div>
      <textarea className="rf-text" rows={4} maxLength={500} value={note} onChange={(e) => setNote(e.target.value)} placeholder="What did you expect, and what happened instead?" />
      <div className="rp-warn"><AlertTriangle size={20} style={{ flexShrink: 0, marginTop: 1 }} /><span>In danger or facing a crime? Call the police first on <b>112</b>. VettedHands reports are not an emergency service.</span></div>
      <button className="rv-submit" style={{ marginTop: 0 }} disabled={busy} onClick={submit}>{busy ? "Submitting…" : "Submit report"}</button>
    </div>
  );
}

/* ---------------- Report about you ---------------- */
function ReportReplyView({ request, token, flash, fail, onBack }) {
  const [data, setData] = useState(null);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    api(`/api/requests/${request.id}/report-about-me`, { token }).then(setData).catch((e) => { fail(e); onBack(); });
  }, [request.id]);
  async function send() {
    if (busy) return;
    setBusy(true);
    try {
      await api(`/api/requests/${request.id}/report-response`, { method: "POST", token, body: { text: text.trim() } });
      flash("Your response was sent");
      onBack();
    } catch (e) { fail(e); } finally { setBusy(false); }
  }
  if (!data) return <div className="screen rv"><div className="rv-top"><button className="tk-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button><span>Loading…</span></div></div>;
  const r = data.report;
  const closed = r.status === "RESOLVED" || r.status === "DISMISSED";
  return (
    <div className="screen rv">
      <div className="rv-top"><button className="tk-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button><span>Report · Request {reqCode(request.id)}</span></div>
      <h1 className="rv-h" style={{ marginTop: 14 }}>A report was filed about this job</h1>
      <p className="rv-sub">Our team reviews every report fairly. You can share your side below.</p>
      <div className="rv-who" style={{ display: "block" }}>
        <b>{r.reason}</b>
        <small style={{ display: "block", marginTop: 6 }}>{data.job}</small>
        {r.note && <small style={{ display: "block", marginTop: 8, fontStyle: "italic" }}>"{r.note}"</small>}
      </div>
      {r.respondedAt ? (
        <div className="tk-note">Your response was sent: "{r.respondentNote}"</div>
      ) : closed ? (
        <div className="tk-note">This report has been closed by our team.</div>
      ) : (
        <>
          <div className="rv-label" style={{ marginTop: 18 }}>Your side of the story</div>
          <textarea className="rf-text" rows={5} maxLength={600} value={text} onChange={(e) => setText(e.target.value)} placeholder="What happened from your point of view?" />
          <button className="rv-submit" disabled={busy || text.trim().length < 5} onClick={send}>{busy ? "Sending…" : "Send response"}</button>
        </>
      )}
    </div>
  );
}

const TOP_RULES = { minJobs: 25, minRating: 4.7 };
const MIN_PORTFOLIO = 3;

function repeatStats(requests, meId) {
  const per = {};
  for (const r of requests) {
    if (r.status === "COMPLETED" && r.artisanProfile && r.student && r.artisanProfile.user.id === meId) per[r.student.id] = (per[r.student.id] || 0) + 1;
  }
  const ids = Object.keys(per);
  const rep = ids.filter((k) => per[k] > 1);
  return { total: ids.length, repeat: rep.length, repeatIds: new Set(rep) };
}

function plural2(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }

const rcDate = (d) => (d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "");
let RECEIPTS_CACHE = null; // last list, so the screen opens instantly and refreshes behind

// Draws the receipt straight onto a canvas (no screenshot library), so the saved picture is sharp and always right.
async function receiptToBlob(r) {
  try { await document.fonts.ready; } catch (e) { /* fine */ }
  const art = r.side === "ARTISAN";
  const paid = r.amount - r.refundAmount;
  const W = 540, P = 28, S = 2;
  const GREEN = "#0F4D3A", INK = "#1E1B16", SOFT = "#6B6357", LINE = "#E4DCC8";
  const FB = "'Bricolage Grotesque','Figtree',system-ui,sans-serif", FT = "'Figtree',system-ui,sans-serif";
  const rows = [["Receipt no.", r.number], ["Issued", rcDate(r.issuedAt)], ["Job", r.job]];
  if (r.scope) rows.push(["Included", r.scope]);
  if (r.completion) rows.push(["Job type", (QT_COMPLETION[r.completion] || "") + (r.quantity ? " · " + r.quantity : "")]);
  rows.push([art ? "Customer" : "Artisan", art ? r.customerName : `${r.artisanName} · ${tradeLabel(r.trade)}`]);
  if (r.paidAt) rows.push(["Paid on", rcDate(r.paidAt)]);
  const sum = [[art ? "Job price" : "Agreed price", naira(r.amount)]];
  if (r.refundAmount > 0) sum.push(["Refunded to customer", "-" + naira(r.refundAmount)]);
  if (art) sum.push([`VettedHands commission (${r.commissionRate}%)`, "-" + naira(r.commission)]);
  const foot = `${art && r.bank ? `Sent to ${r.bank}. ` : ""}Payment reference ${r.reference}. ${art ? "" : "Your payment was held securely by VettedHands until the job was confirmed. "}Questions? ${SUPPORT_EMAIL}`;

  function wrap(ctx, text, maxW) {
    const out = []; let line = "";
    for (const word of String(text).split(/\s+/)) {
      const t = line ? line + " " + word : word;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    if (line) out.push(line);
    return out.length ? out : [""];
  }
  function paint(ctx, H) {
    let y = 0;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    // header
    const g = ctx.createLinearGradient(0, 0, W, 64); g.addColorStop(0, "#0F4D3A"); g.addColorStop(1, "#0A3A2B");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 64);
    ctx.fillStyle = "#F4EFE0"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.font = `800 20px ${FB}`; ctx.fillText("VettedHands", P + 30, 32);
    ctx.strokeStyle = "#F4EFE0"; ctx.lineWidth = 2; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(P + 11, 20); ctx.lineTo(P + 21, 24); ctx.lineTo(P + 21, 33); ctx.quadraticCurveTo(P + 21, 41, P + 11, 45); ctx.quadraticCurveTo(P + 1, 41, P + 1, 33); ctx.lineTo(P + 1, 24); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(P + 6, 32); ctx.lineTo(P + 10, 36); ctx.lineTo(P + 16, 28); ctx.stroke();
    ctx.textAlign = "right"; ctx.globalAlpha = .85; ctx.font = `700 11.5px ${FT}`; ctx.fillText((art ? "PAYOUT RECEIPT" : "PAYMENT RECEIPT"), W - P, 32); ctx.globalAlpha = 1;
    y = 64 + 24;
    // completed row
    ctx.textAlign = "left";
    ctx.fillStyle = GREEN; ctx.beginPath(); ctx.arc(P + 15, y + 15, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(P + 8, y + 15); ctx.lineTo(P + 13, y + 20); ctx.lineTo(P + 22, y + 10); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = `700 15px ${FT}`; ctx.fillText("Job completed", P + 42, y + 9);
    ctx.fillStyle = SOFT; ctx.font = `500 12.5px ${FT}`; ctx.fillText(rcDate(r.completedAt), P + 42, y + 26);
    y += 52;
    // big amount
    ctx.fillStyle = GREEN; ctx.font = `800 38px ${FB}`; ctx.textBaseline = "alphabetic"; ctx.fillText(naira(art ? r.artisanPayout : paid), P, y + 30);
    ctx.fillStyle = SOFT; ctx.font = `600 12.5px ${FT}`; ctx.fillText(art ? "paid out to you" : "paid through VettedHands", P, y + 50);
    y += 68;
    ctx.setLineDash([4, 4]); ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W - P, y); ctx.stroke(); ctx.setLineDash([]);
    y += 20;
    // rows
    for (const [k, v] of rows) {
      ctx.font = `700 13px ${FT}`;
      const lines = wrap(ctx, v, W - P * 2 - 104);
      ctx.fillStyle = SOFT; ctx.font = `500 13px ${FT}`; ctx.fillText(k, P, y + 12);
      ctx.fillStyle = INK; ctx.font = `700 13px ${FT}`;
      lines.forEach((ln, i) => ctx.fillText(ln, P + 104, y + 12 + i * 18));
      y += Math.max(1, lines.length) * 18 + 8;
    }
    y += 8;
    // summary box
    const boxH = 28 + sum.length * 24 + 38;
    ctx.fillStyle = "#F3F8F5"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(P, y, W - P * 2, boxH, 14) : ctx.rect(P, y, W - P * 2, boxH); ctx.fill();
    let by = y + 18;
    sum.forEach(([k, v]) => {
      ctx.fillStyle = SOFT; ctx.font = `500 13px ${FT}`; ctx.textAlign = "left"; ctx.fillText(k, P + 14, by + 12);
      ctx.fillStyle = INK; ctx.font = `700 13px ${FT}`; ctx.textAlign = "right"; ctx.fillText(v, W - P - 14, by + 12); by += 24;
    });
    ctx.strokeStyle = "#D6E6DD"; ctx.beginPath(); ctx.moveTo(P + 14, by + 2); ctx.lineTo(W - P - 14, by + 2); ctx.stroke();
    ctx.fillStyle = GREEN; ctx.font = `800 15px ${FT}`; ctx.textAlign = "left"; ctx.fillText(art ? "You receive" : "Total paid", P + 14, by + 24);
    ctx.textAlign = "right"; ctx.fillText(naira(art ? r.artisanPayout : paid), W - P - 14, by + 24);
    y += boxH + 18;
    // footer text
    ctx.textAlign = "left"; ctx.fillStyle = SOFT; ctx.font = `500 11.5px ${FT}`;
    const fl = wrap(ctx, foot, W - P * 2);
    fl.forEach((ln, i) => ctx.fillText(ln, P, y + 12 + i * 16));
    y += fl.length * 16 + 22;
    // PAID stamp
    ctx.save(); ctx.translate(W - P - 62, 64 + 62); ctx.rotate(-0.21); ctx.globalAlpha = .85;
    ctx.strokeStyle = GREEN; ctx.fillStyle = GREEN; ctx.lineWidth = 3;
    ctx.font = `800 22px ${FB}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-46, -19, 92, 38, 8) : ctx.rect(-46, -19, 92, 38); ctx.stroke();
    ctx.fillText("PAID", 0, 1); ctx.restore();
    return y;
  }
  // First pass on a tall scratch canvas to learn the height, second pass at the exact size.
  const scratch = document.createElement("canvas"); scratch.width = W; scratch.height = 2400;
  const H = Math.ceil(paint(scratch.getContext("2d"), 2400));
  const cv = document.createElement("canvas"); cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext("2d"); ctx.scale(S, S);
  paint(ctx, H);
  return await new Promise((res) => cv.toBlob(res, "image/png"));
}

function ReceiptsView({ token, flash, fail, onBack, requestId }) {
  const [data, setData] = useState(RECEIPTS_CACHE);
  const [sel, setSel] = useState(null);
  const [busy, setBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  async function saveImage(r) {
    if (saving) return;
    setSaving(true);
    try {
      const blob = await receiptToBlob(r);
      const file = new File([blob], `VettedHands-${r.number}.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: "VettedHands receipt" });
      else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = file.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        flash("Receipt saved as an image");
      }
    } catch (e) { if (!(e && e.name === "AbortError")) flash("Couldn't save the image. Use Save as PDF or print instead."); }
    setSaving(false);
  }
  useEffect(() => {
    api("/api/receipts", { token })
      .then((d) => { RECEIPTS_CACHE = d; setData(d); const hit = requestId && d.receipts.find((x) => x.requestId === requestId); if (hit) setSel(hit.id); })
      .catch((e) => { setData({ receipts: [], optOut: false }); fail(e); });
  }, []);
  const back = <button className="nf-back" onClick={() => (sel && !requestId ? setSel(null) : onBack())} aria-label="Back"><ArrowLeft size={22} /></button>;
  if (!data) return <div className="screen hp">{back}<h1 className="trk-h">Receipts</h1><div className="sk sk-row" /><div className="sk sk-row" /><div className="sk sk-row" /></div>;
  const cur = data.receipts.find((r) => r.id === sel);
  async function toggleOpt() {
    if (busy) return;
    setBusy(true);
    try {
      const d = await api("/api/receipts/prefs", { method: "PATCH", token, body: { optOut: !data.optOut } });
      setData({ ...data, optOut: d.optOut });
      flash(d.optOut ? "Receipt alerts off. Receipts stay saved here." : "Receipt alerts on");
    } catch (e) { fail(e); } finally { setBusy(false); }
  }
  function share(r) {
    const t = `VettedHands receipt ${r.number}: ${naira(r.side === "ARTISAN" ? r.artisanPayout : r.amount - r.refundAmount)} for "${r.job}"`;
    if (navigator.share) navigator.share({ title: "VettedHands receipt", text: t }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => flash("Receipt details copied")).catch(() => {});
  }
  if (cur) {
    const art = cur.side === "ARTISAN";
    const paid = cur.amount - cur.refundAmount;
    return (
      <div className="screen hp rcpt-screen">
        {back}

function MembershipView({ token, flash, fail, onBack, onPaid }) {
  const [info, setInfo] = useState(null);
  const [busy, setBusy] = useState(null);
  useEffect(() => { api("/api/payments/membership", { token }).then(setInfo).catch(fail); }, []);
  async function buy(planId) {
    if (busy) return;
    setBusy(planId);
    try {
      const d = await api("/api/payments/membership/initialize", { method: "POST", token, body: { plan: planId } });
      await new Promise((resolve) => {
        const redirect = () => { window.location.href = d.authorizationUrl; resolve(); };
        if (!window.PaystackPop || !d.accessCode) return redirect();
        let loaded = false;
        const timer = setTimeout(() => { if (!loaded) redirect(); }, 25000);
        new window.PaystackPop().resumeTransaction(d.accessCode, {
          onLoad: () => { loaded = true; clearTimeout(timer); },
          onSuccess: async () => {
            try {
              await api(`/api/payments/membership/verify/${encodeURIComponent(d.reference)}`, { token });
              setInfo(await api("/api/payments/membership", { token }));
              await onPaid();
              flash("Welcome, Member");
            } catch (e) { fail(e); }
            resolve();
          },
          onCancel: () => { clearTimeout(timer); resolve(); },
          onError: () => { clearTimeout(timer); redirect(); },
        });
      });
    } catch (e) { fail(e); } finally { setBusy(null); }
  }
  const save = info && info.plans.length > 1 ? Math.round(100 - (info.plans[1].amount / (info.plans[0].amount * 12)) * 100) : 0;
  return (
    <div className="screen hp">
      <button className="nf-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button>
      <h1 className="trk-h">Membership</h1>
      <p className="trk-sub">Get seen first, keep more of every job.</p>
      {info && (
        <div className={"tk-note"} style={{ marginBottom: 16 }}>
          {info.active ? <><b>You are a Member</b><br />{info.expiresAt ? `Active until ${new Date(info.expiresAt).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}` : "Active"}</> : <b>You are not a Member yet</b>}
        </div>
      )}
      <div className="trk-card">
        <div className="trk-chk"><Check size={18} /><span>Shown first when customers search and browse</span></div>
        <div className="trk-chk"><Check size={18} /><span>Member badge on your profile and cards</span></div>
        <div className="trk-chk"><Check size={18} /><span>{info ? `Lower commission: ${info.rates.member}% instead of ${info.rates.free}% on every job` : "Lower commission on every job"}</span></div>
      </div>
      {info && info.plans.map((p) => (
        <button key={p.id} className="mb-plan" disabled={!!busy} onClick={() => buy(p.id)}>
          <span><b>{p.label}</b><small>{p.days} days{p.id === "YEAR" && save > 0 ? ` · save ${save}%` : ""}{info.active ? " · adds to your current period" : ""}</small></span>
          <em>{busy === p.id ? "Opening…" : naira(p.amount)}</em>
        </button>
      ))}
      <p className="apl-help">Membership fees are not refundable. Being a Member does not change the Vetted, Skill Verified or Top Rated checks.</p>
    </div>
  );
}

function BankView({ token, flash, fail, onBack }) {
  const [banks, setBanks] = useState([]);
  const [saved, setSaved] = useState(undefined);
  const [code, setCode] = useState("");
  const [acct, setAcct] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(() => {
    api("/api/payments/bank", { token }).then((d) => setSaved(d.bank)).catch((e) => { setSaved(null); fail(e); });
    api("/api/payments/banks", { token }).then((d) => setBanks(d.banks)).catch(() => {});
  }, []);
  async function save() {
    if (busy) return;
    setBusy(true); setErr(null);
    try {
      const d = await api("/api/payments/bank", { method: "POST", token, body: { bankCode: code, accountNumber: acct } });
      setSaved(d.bank); setAcct(""); setCode(""); flash("Payout account saved");
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  }
  const ok = code && /^\d{10}$/.test(acct);
  return (
    <div className="screen hp">
      <button className="nf-back" onClick={onBack} aria-label="Back"><ArrowLeft size={22} /></button>
      <h1 className="trk-h">Payout account</h1>
      <p className="trk-sub">This is where VettedHands sends your money when a job is confirmed. The account name must match the name on your profile.</p>
      {saved && <div className="tk-note" style={{ marginBottom: 16 }}><b>{saved.accountName}</b><br />{saved.bankName} · ending {saved.accountLast4}</div>}
      <div className="rf-label">{saved ? "Change account" : "Add your account"}</div>
      <BankPicker banks={banks} value={code} onChange={setCode} />
      <input className="apl-in" style={{ marginTop: 10 }} inputMode="numeric" maxLength={10} value={acct} onChange={(e) => setAcct(e.target.value.replace(/\D/g, ""))} placeholder="10-digit account number" />
      {err && <div className="auth-err" style={{ marginTop: 10 }}>{err}</div>}
      <button className="rf-go" style={{ marginTop: 16 }} disabled={!ok || busy} onClick={save}>{busy ? "Checking account…" : "Verify and save"}</button>
      <p className="apl-help">We check the account with your bank. After a change, payouts pause for 24 hours to protect you.</p>
    </div>
  );
}

  const [sending, setSending] = useState(false);

    const files = Array.from(e.target.files || []).slice(0, 6 - photos.length);

      <div className="rf-chips">{trades.map((t) => <button key={t.id} type="button" className={"rf-chip" + (trade === t.id ? " on" : "")} onClick={() => setTrade(t.id)}>{t.label}</button>)}</div>

      <div className="rf-label">Location</div>
      <input className="apl-in apl-ro" value={`${user.area || "Ado-Ekiti"}, Ado-Ekiti`} readOnly />
      <div className="rf-label">About your service</div>
      <textarea className="rf-text" rows={4} maxLength={500} value={about} onChange={(e) => setAbout(e.target.value)} placeholder="What you do, what you are best at, and how you work." />
      <div className="rf-count"><span /><span>{about.length} / 500</span></div>

          <div className="rf-thumb" key={i}><img src={p} alt={"Photo " + (i + 1)} /><button type="button" onClick={() => setPhotos((x) => x.filter((_, j) => j !== i))} aria-label="Remove photo"><X size={12} /></button></div>
        ))}
        {photos.length < 6 && <label className="rf-add"><input type="file" accept="image/*" multiple style={{ display: "none" }} onChange={addPhotos} /><span>{upBusy ? "…" : "+"}</span>Add</label>}

/* ---------------- Chat helpers ---------------- */
const reqCode = (id) => "VH-" + String(id).slice(0, 4).toUpperCase();
const naira = (kobo) => "₦" + (Number(kobo || 0) / 100).toLocaleString("en-NG");
function shortName(name = "") { const p = name.trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : p[0]; }
function clockTime(d) { return new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
function listTime(d) {
  const x = new Date(d), t = new Date();
  if (x.toDateString() === t.toDateString()) return clockTime(d);
  if (x.toDateString() === new Date(t.getTime() - 864e5).toDateString()) return "Yesterday";
  return x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function dayLabel(d) {
  const x = new Date(d), t = new Date();
  if (x.toDateString() === t.toDateString()) return "Today";
  if (x.toDateString() === new Date(t.getTime() - 864e5).toDateString()) return "Yesterday";
  return x.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
// One tick = sent, two ticks = the other person has opened the chat since.
function Ticks({ read, lead }) {

      <polyline points="1 6 4 9 10 2" />

  );
}

/* ---------------- Notifications ---------------- */
// Built from the requests and messages the app already loads. Nothing new on the backend.
function buildNotifications(requests, me) {
  const out = [];
  for (const r of requests) {
    if (!r.artisanProfile || !r.student) continue;
    const artisanSide = r.artisanProfile.user.id === me.id;
    const other = artisanSide ? r.student : r.artisanProfile.user;
    const first = other.name.split(" ")[0];
    const base = { requestId: r.id, time: r.updatedAt || r.createdAt };
    const add = (status, extra) => out.push({ ...base, id: r.id + ":" + status, ...extra });
    if (!artisanSide) {
      if (r.status === "ACCEPTED") add("ACCEPTED", { kind: "ok", title: `${first} accepted your request`, text: "Confirm the booking to go ahead. You can message them while you decide." });
      if (r.status === "CONFIRMED" && r.startedAt && !r.artisanDoneAt) add("STARTED", { kind: "job", title: `${first} started your job`, text: `${reqCode(r.id)} is in progress.` });
      if (r.status === "CONFIRMED" && r.artisanDoneAt) add("DONE", { kind: "review", title: `${first} marked the job done`, text: "Confirm it and leave a review." });
      if (r.status === "COMPLETED") add("COMPLETED", r.rating
        ? { kind: "ok", title: "Job completed", text: `Thanks for reviewing ${first}.` }
        : { kind: "review", title: `Time to review ${first}`, text: `Your ${r.job.slice(0, 40)} job is complete. Share how it went.` });
      if (r.status === "DECLINED") add("DECLINED", { kind: "flag", title: `${first} declined your request`, text: "Try another artisan near you." });
      if (r.status === "CLOSED") add("CLOSED", { kind: "flag", title: "Request closed", text: "You booked another artisan for this job." });
      if (r.status === "CANCELLED") add("CANCELLED", { kind: "flag", title: "Request cancelled", text: r.job });
    } else {
      if (r.status === "PENDING") add("PENDING", { kind: "job", title: `New request from ${first}`, text: r.job });
      if (r.status === "CONFIRMED" && !r.startedAt && !r.artisanDoneAt) add("BOOKED", { kind: "ok", title: `${first} booked you`, text: "Start the job when you're ready." });
      if (r.status === "CLOSED") add("CLOSED", { kind: "flag", title: `${first} chose another artisan`, text: r.job });
      if (r.status === "CANCELLED") add("CANCELLED", { kind: "flag", title: "Request cancelled", text: r.job });
      if (r.status === "CONFIRMED" && r.artisanDoneAt) add("DONE", { kind: "ok", title: `Waiting for ${first} to confirm`, text: r.job });
      if (r.status === "COMPLETED") add("COMPLETED", { kind: "review", title: `Job completed for ${first}`, text: r.rating ? `They rated you ${r.rating} out of 5.` : "Waiting for their review." });
    }
    const m = r.lastMessage;
    if (m && m.senderType !== "SYSTEM" && m.senderId !== me.id) {
      out.push({ ...base, id: `m:${r.id}:${m.id}`, time: m.createdAt, kind: "msg", autoRead: r.unreadCount === 0, title: `${first} sent ${m.audioSecs ? "a voice note" : "a message"}`, text: m.audioSecs ? "Voice note · " + fmtSecs(m.audioSecs) : m.text });
    }
  }
  return out.sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 40);
}
const notifUnread = (n) => !n.readAt;
const NOTIF_KIND = { REQUEST_NEW: "job", REQUEST_ACCEPTED: "ok", REQUEST_DECLINED: "flag", REQUEST_CLOSED: "flag", REQUEST_WITHDRAWN: "flag", POST_ABOUT_YOU: "msg", CANCEL_REQUESTED: "job", CANCEL_REPLY: "flag", BOOKING_CONFIRMED: "ok", JOB_STARTED: "job", JOB_DONE: "review", JOB_COMPLETED: "ok", REVIEW_RECEIVED: "review", POST_APPROVED: "ok", POST_REJECTED: "flag", POST_HIDDEN: "flag", POST_REPLY: "msg", APP_APPROVED: "ok", APP_REJECTED: "flag", APP_INFO: "job", REPORT_UPDATE: "ok", REPORT_ABOUT_YOU: "flag", PAYMENT_HELD: "ok", PAYOUT_SENT: "ok", PAYOUT_BLOCKED: "flag", BANK_CHANGED: "flag", BOOKING_CANCELLED: "flag", PAYMENT_REFUNDED: "ok", PAYMENT_UPDATE: "ok", QUOTE_NEW: "job", QUOTE_COUNTER: "job", QUOTE_ACCEPTED: "ok", QUOTE_DECLINED: "flag", MEMBERSHIP_ACTIVE: "ok", RECEIPT_READY: "ok", ADDON_NEW: "job", ADDON_PAID: "ok", ADDON_DECLINED: "job" };

const NOTIF_STYLE = {

/* ---------------- Messages tab ---------------- */
function MessagesListView({ requests, user, onOpen, onTypingList }) {
  const [tab, setTab] = useState("active");
  const [typingIds, setTypingIds] = useState([]);
  const idsKey = requests.filter((r) => !["COMPLETED", "DECLINED", "CLOSED", "CANCELLED"].includes(r.status)).map((r) => r.id).join(",");
  useEffect(() => {
    if (!onTypingList || !idsKey) return;
    let off = false, stop = false;
    const tick = async () => {
      if (stop) return;
      try { const t = await onTypingList(idsKey.split(",")); if (!off) setTypingIds(t); }
      catch (e) { if (/404|not found/i.test(e.message || "")) stop = true; if (!off) setTypingIds([]); }
    };
    tick();
    const id = setInterval(tick, 3000);
    return () => { off = true; clearInterval(id); };
  }, [idsKey]);
  const [q, setQ] = useState("");
  const done = (r) => ["COMPLETED", "DECLINED", "CLOSED", "CANCELLED"].includes(r.status);
  const rows = requests
    .map((r) => {
      const artisanSide = r.artisanProfile.user.id === user.id;
      const other = artisanSide ? r.student : r.artisanProfile.user;
      return { r, other, name: artisanSide ? shortName(other.name) : other.name, at: (r.lastMessage && r.lastMessage.createdAt) || r.updatedAt || r.createdAt };
    })
    .filter((x) => (tab === "past" ? done(x.r) : !done(x.r)))
    .filter((x) => !q.trim() || `${x.other.name} ${x.r.job} ${reqCode(x.r.id)}`.toLowerCase().includes(q.trim().toLowerCase()))
    .sort((a, b) => new Date(b.at) - new Date(a.at));
  return (
    <div className="screen ms">
      <h1 className="ms-h">Messages</h1>
      <div className="ms-seg">
        <button className={tab === "active" ? "on" : ""} onClick={() => setTab("active")}>Active jobs</button>
        <button className={tab === "past" ? "on" : ""} onClick={() => setTab("past")}>Past jobs</button>
      </div>
      <label className="ms-search"><Search size={18} /><input placeholder={user.role === "ARTISAN" ? "Search by customer or job" : "Search by artisan or job"} value={q} onChange={(e) => setQ(e.target.value)} /></label>
      <div className="ms-list">
        {rows.map(({ r, other, name, at }) => {
          const m = r.lastMessage;
          const unread = r.unreadCount || 0;
          const mine = !!m && m.senderId === user.id;
          const [bg, fg] = tintFor(other.id || r.id);
          const preview = m ? (m.senderType === "SYSTEM" ? m.text : (mine ? "You: " : "") + (m.audioSecs ? "Voice note · " + fmtSecs(m.audioSecs) : m.hasImage && (!m.text || m.text === "Photo") ? "Photo" : m.text)) : r.job;
          return (
            <button key={r.id} className={"ms-row" + (unread ? " ms-row--new" : "")} onClick={() => onOpen(r.id)}>
              <span className="ms-av" style={{ background: bg, color: fg }}><Face u={other} /></span>
              <span className="ms-main">
                <span className="ms-top"><b>{name}</b><time className={unread ? "new" : ""}>{listTime(at)}</time></span>
                <span className="ms-sub">{tradeLabel(r.artisanProfile.trade)} · {reqCode(r.id)}</span>
                <span className="ms-prev">
                  {typingIds.includes(r.id)
                    ? <span className="ms-txt ms-typing">typing…</span>
                    : <span className={"ms-txt" + (unread ? " new" : "")}>{mine && <Ticks lead read={!!m.read} />}<span className="ms-t">{preview}</span></span>}
                  {unread > 0 && <span className="ms-count">{unread}</span>}
                </span>
              </span>
            </button>
          );
        })}

// Converts a picked image file into a base64 data URL so it can be sent straight to the
// backend as a plain string — no separate image hosting service needed for now.
// Resizes and compresses an image before converting to a data URL — cuts a
// typical 2-5MB phone photo down to ~50-150KB, which is the main thing making
// uploads, sends, and later loads feel slow. Same function signature as before,
// so every existing call site (work photos, ID doc, request image) speeds up
// automatically with no other changes needed.
function fileToDataUrl(file, maxDim = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

                  <button onClick={() => onRemovePhoto(p.id)} style={{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%", background: "var(--danger)", color: "#fff", border: "2px solid var(--bg)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: 0 }}><X size={11} /></button>
                </div>
              ))}
              {user.artisanProfile.photos.length < 6 && (
                <label className="photo-add" style={{ cursor: "pointer" }}>
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={async (e) => { const f = e.target.files[0]; if (f) onAddPhoto(await fileToDataUrl(f)); e.target.value = ""; }} />
                  <Camera size={16} /> Add
                </label>
              )}
            </div>
          )}
          <button className="browse-link" onClick={onRequestArtisan}>Need a service yourself? Request an artisan <ChevronRight size={14} /></button>
        </div>
      )}

      {!isArtisan && (
        <div className="section">
          <div className="section-head"><span>Offer your services</span></div>
          {!application && !showForm && <button className="artisan-cta" onClick={() => setShowForm(true)}><Hammer size={17} /> Become a vetted artisan on VettedHands</button>}
          {!application && showForm && (
            <div className="form form--card">
              <label>Trade<select value={trade} onChange={(e) => setTrade(e.target.value)}>{trades.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</select></label>
              <label>Tell customers about your work<textarea rows={3} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="At least 10 characters…" /></label>
              <label>Phone / WhatsApp number<input required type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} className="text-input" placeholder="e.g. 0803xxxxxxx" /></label>
              <label>Social media username (Instagram, Facebook, or Twitter/X)<input value={socialHandle} onChange={(e) => setSocialHandle(e.target.value)} className="text-input" placeholder="e.g. @tunde_electrics" /></label>
              <label>Government ID (NIN slip, driver's license, or voter's card) — seen only by VettedHands admin
                {idDocument ? (
                  <div className="id-preview">
                    <img src={idDocument} className="id-preview-img" alt="Preview of your ID photo" />
                    <button type="button" className="id-remove-btn" onClick={() => setIdDocument(null)}><X size={12} /> Remove</button>
                  </div>
                ) : (
                  <label className="id-upload-btn">
                    <input type="file" accept="image/*" onChange={handleIdPick} style={{ display: "none" }} />
                    <Camera size={16} /> Upload ID photo
                  </label>
                )}
              </label>
              <label>Photos of past work
                <div className="photo-picker">
                  {photos.map((p, i) => <img key={i} src={p} className="photo-thumb" alt={"Work photo " + (i + 1)} style={{ objectFit: "cover" }} />)}
                  {photos.length < 4 && (
                    <label className="photo-add" style={{ cursor: uploading ? "wait" : "pointer" }}>
                      <input type="file" accept="image/*" multiple onChange={handlePhotoPick} style={{ display: "none" }} disabled={uploading} />
                      <Camera size={16} /> {uploading ? "…" : "Add"}
                    </label>
                  )}
                </div>
              </label>
              <div className="settle-actions">
                <button className="ghost-btn" onClick={() => setShowForm(false)}><X size={14} /> Cancel</button>
                <button className="settle-btn" disabled={bio.trim().length < 10 || !phone.trim() || !idDocument} onClick={() => { onApply(trade, bio.trim(), photos, phone.trim(), socialHandle.trim(), idDocument); setShowForm(false); }}>Submit for review</button>
              </div>
            </div>
          )}
          {application && application.status === "PENDING" && (
            <div className="pending-card">
              <div className="pending-title">Application under review</div>
              <div className="pending-sub">We're checking your details. You'll become an artisan once approved by an admin.</div>
              {application.infoRequestNote && (
                <>
                  <div className="info-request-note">
                    <AlertTriangle size={13} /> VettedHands needs more info: "{application.infoRequestNote}".
                  </div>
                  <InfoReplyBox application={application} />
                </>
              )}
            </div>
          )}
          {application && application.status === "REJECTED" && (
            <div className="pending-card"><div className="pending-title" style={{ color: "var(--danger)" }}>Application not approved</div></div>
          )}
        </div>
      )}

      <div className="section">
        <div className="settings-list">
          <div className="settings-row settings-row--danger" onClick={onLogout} style={{ cursor: "pointer" }}><LogOut size={17} /> Log out</div>
        </div>
      </div>
      {!isArtisan && <button className="browse-link" onClick={onRequestArtisan}>Request an artisan <ChevronRight size={14} /></button>}
    </div>
  );
}

/* ---------------- Bottom nav ---------------- */
function BottomNav({ active, onChange, isArtisan, requestCount, messageCount, hide }) {
  const items = [
    { id: "home", label: "Home", icon: Home },
    { id: "requests", label: "Requests", icon: ClipboardList, badge: requestCount },
    { id: "messages", label: "Messages", icon: MessageCircle, badge: messageCount },
    { id: "profile", label: "Profile", icon: UserIcon },
  ];
  return (
    <div className={"bottomnav" + (hide ? " bottomnav--hide" : "")}>
      {items.map((it) => { const I = it.icon; const isActive = active === it.id; return (
        <button key={it.id} className={"nav-item" + (isActive ? " nav-item--active" : "")} onClick={() => onChange(it.id)}>
          <span className="nav-icon-wrap"><I size={19} strokeWidth={isActive ? 2.4 : 2} />{it.badge > 0 && <span className="nav-badge">{it.badge}</span>}</span>
          <span>{it.label}</span>
        </button>
      ); })}
    </div>
  );
}
